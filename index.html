<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPL Pipe Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c1220">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAANklEQVR42mPgEVIgCTEMFQ31z/8DEbEacCnFrgG/anQNBFWjaCBGNWU2kOMHckKJnHgY6LQEAFy+Va5fyHR2AAAAAElFTkSuQmCC">

<style>
/* Layout: one centered column. Home = rank + lesson path. Each lesson = "Watch me" (a search typed pipe by pipe over sample events, with the why)
   then a timed quiz on exactly what was shown. Deliberately single dark theme: a SOC console lit by vertical "pipe" lines.
   A fixed player bar at the bottom carries pause, replay line, speed, subtitles and voice on every screen. */
:root{
  color-scheme:dark;
  --bg:#0c1220; --panel:#141d30; --panel2:#1b263d; --ink:#edf1f8; --muted:#93a0b8; --line:#29354f;
  --accent:#46d9ff; --ok:#3fcf8e; --bad:#ff6b6b; --code:#0a0f1b; --hl:#b8f0ff;
  --t0:#e2604a; --t1:#2fae5f; --t2:#c98d17; --t3:#4a78d6;
  --c1:#4a78d6; --c2:#c8752a; --c3:#9b6bd6; --c4:#2f9e8f; /* chart series, checked for colour-blind separation on --panel */
  --display:"Chakra Petch","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  background-image:repeating-linear-gradient(90deg,transparent 0 63px,rgba(70,217,255,.035) 63px 65px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 150px}
.app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
code{font-family:var(--mono);font-size:.88em;background:var(--code);border:1px solid var(--line);padding:.05em .35em;border-radius:4px;color:var(--hl)}
.eyebrow{font:600 .74rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 20px;font:700 1rem var(--display);letter-spacing:.03em;background:var(--accent);color:#04202a;box-shadow:0 4px 0 #1b7f99}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1b7f99}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #0a1020}
.btn.sm{padding:9px 14px;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .78rem var(--mono);padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}

/* home */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
.pipe{font:700 6rem/0.8 var(--display);color:var(--accent);grid-row:span 2}
.hero h1{font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:.01em}
.hero p{color:var(--muted);max-width:60ch}
.rank{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.rank b{font:700 1.3rem var(--display)}
.xpbar{grid-column:1/-1;height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#b8f0ff);width:0}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.how b{font:700 1rem var(--display);color:var(--accent)}
.how span{font-size:.9rem;color:var(--muted)}
.path{display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lesson.next{border-color:var(--accent)}
.lesson .n{font:700 2rem/1 var(--display);color:var(--accent);text-align:center}
.lesson.locked{opacity:.55}
.lesson.locked .n{color:var(--muted)}
.lesson .t{font:700 1.05rem var(--display)}
.lesson .m{font-size:.86rem;color:var(--muted)}
.lesson .go{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.mode:hover:not(:disabled){border-color:var(--accent)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode b{font:700 1.15rem var(--display)}
.mode span{color:var(--muted);font-size:.92rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--mono)}
.foot{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.foot .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* watch */
.stagebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
/* Stage-bar title chips may hold a long lesson title; let them shrink and wrap instead of pushing the page sideways on a phone. */
.stagebar .row{min-width:0}
.stagebar .row .chip{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--panel2)}
.dots i.on{background:var(--accent)}
.searchbar{display:flex;flex-direction:column;gap:6px}
.searchbar .lbl{display:flex;justify-content:space-between;font:600 .7rem var(--mono);letter-spacing:.1em;color:var(--muted)}
.spl{margin:0;background:var(--code);border:2px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font:400 .98rem/1.65 var(--mono);color:#e7ecf5;white-space:pre;min-height:56px}
.spl .new{color:var(--hl);background:rgba(70,217,255,.12);border-radius:3px}
.spl .caret{display:inline-block;width:.55em;height:1.1em;background:var(--accent);vertical-align:-.2em;margin-left:1px}
@media (prefers-reduced-motion:no-preference){.spl .caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}}
.say{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.say .what{font:600 1.15rem/1.35 var(--display)}
.say .why{max-width:68ch}
.say .why b,.fb .why b{color:var(--accent);font-family:var(--display);letter-spacing:.04em}
.res{display:flex;flex-direction:column;gap:8px}
.res .cnt{font:600 .8rem var(--mono);color:var(--muted)}
.events{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ev{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.84rem}
.ev:last-child{border-bottom:0}
.ev .tm{font:600 .8rem var(--mono);color:var(--muted)}
.ev .raw{font:.8rem/1.45 var(--mono);overflow-wrap:anywhere;min-width:0}
.ev .meta{font:.72rem var(--mono);color:var(--muted);margin-top:2px}
.ev .raw mark{background:rgba(70,217,255,.25);color:var(--hl);border-radius:2px}
.more{padding:8px 12px;font:.78rem var(--mono);color:var(--muted)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.ctrl .r{display:flex;gap:10px;flex-wrap:wrap}
.sayhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.talk{cursor:pointer;color:var(--accent);flex:none}
.talk .bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.talk .bars i{width:3px;height:4px;background:currentColor;border-radius:1px}
.talk.on{border-color:var(--accent)}
.talk.on .tl::after{content:"ing"}
@media (prefers-reduced-motion:no-preference){.talk.on .bars i{animation:eq .9s ease-in-out infinite}.talk.on .bars i:nth-child(2){animation-delay:.15s}.talk.on .bars i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}}
.flow{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.flow .cap{display:grid;grid-template-columns:minmax(0,.34fr) minmax(0,.32fr) minmax(0,.34fr);gap:8px;font:600 .74rem var(--mono);color:var(--muted);align-items:center}
.flow .cap span:nth-child(2){text-align:center}.flow .cap span:nth-child(3){text-align:right}
.flow .cmd{color:var(--hl);overflow-wrap:anywhere}
.flow .canvas{min-width:0;cursor:pointer}
.flow canvas{display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:.74rem var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.try{border-left:4px solid var(--ok);background:rgba(63,207,142,.07);padding:12px 16px;border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:6px}
.try b{font-family:var(--display);color:var(--ok)}

/* play */
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.top .left{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.score{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.streak{color:var(--accent);border-color:var(--accent)}
.card{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.qtype{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtype .chip{color:var(--accent)}
.prompt{font:600 1.3rem/1.3 var(--display);text-wrap:balance}
.codewrap{position:relative;min-width:0}
.codewrap .lang{position:absolute;top:8px;right:10px;font:600 .66rem var(--mono);letter-spacing:.1em;color:var(--muted)}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font:400 .92rem/1.6 var(--mono);color:#e7ecf5;white-space:pre-wrap;overflow-wrap:anywhere}
.timer{display:grid;grid-template-columns:minmax(0,1fr) 3ch;gap:12px;align-items:center}
.timer .track{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.timer .fill{height:100%;background:var(--accent);transform-origin:left;transition:background .3s}
.timer.low .fill{background:var(--bad)}
.timer .secs{font:700 1.2rem var(--display);text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.lines{grid-template-columns:1fr}
.opt{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:0;border-radius:12px;padding:16px;min-height:76px;color:#fff;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:opacity .2s,transform .1s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt .sh{font-size:1.3rem;line-height:1;text-align:center;opacity:.9}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt .tx.c{font:600 .88rem/1.5 var(--mono);white-space:pre-wrap}
.opt .key{position:absolute;top:6px;right:9px;font:600 .66rem var(--mono);opacity:.7}
.o0{background:var(--t0)}.o1{background:var(--t1)}.o2{background:var(--t2)}.o3{background:var(--t3)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.28}
.opt.right{outline:4px solid var(--ok);outline-offset:2px}
.opt.wrong{outline:4px solid var(--bad);outline-offset:2px}
.order{display:flex;flex-direction:column;gap:12px}
.order h4{margin:0;font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.slots,.pool{display:flex;flex-direction:column;gap:8px;min-height:54px}
.slots{border:2px dashed var(--line);border-radius:12px;padding:8px}
.piece{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;font:600 .88rem/1.45 var(--mono);overflow-wrap:anywhere}
.piece .ix{font:700 .9rem var(--display);color:var(--accent);text-align:center}
.piece:hover:not(:disabled){border-color:var(--accent)}
.piece.ok{border-color:var(--ok)}.piece.no{border-color:var(--bad)}
.slots .empty{color:var(--muted);font-size:.9rem;padding:8px}
.hint{font-size:.9rem;color:var(--muted)}
.fb{display:flex;flex-direction:column;gap:12px;border-radius:16px;padding:18px 20px;border:2px solid var(--line);background:var(--panel)}
.fb.good{border-color:var(--ok)}.fb.badc{border-color:var(--bad)}
.fb .head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.fb .verdict{font:700 1.6rem var(--display)}
.fb.good .verdict{color:var(--ok)}.fb.badc .verdict{color:var(--bad)}
.fb .pts{font:700 1.2rem var(--display);color:var(--accent)}
.fb .why{max-width:68ch}
.fb .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* results */
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.big div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.big b{font:700 1.8rem var(--display);font-variant-numeric:tabular-nums}
.big span{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.banner{background:linear-gradient(90deg,rgba(70,217,255,.18),transparent);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 10px 10px 0;font-weight:700}
.missed{display:flex;flex-direction:column;gap:10px}
.missed details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.missed summary{cursor:pointer;font-weight:700}
.missed details>div{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.actions{display:flex;flex-wrap:wrap;gap:12px}

@media (max-width:640px){
  .opts,.modes,.how{grid-template-columns:1fr}
  .big{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pipe{font-size:4.2rem}
  .lesson{grid-template-columns:40px minmax(0,1fr)}
  .lesson .go{grid-column:1/-1;justify-content:stretch}
  .lesson .go .btn{flex:1}
  .prompt{font-size:1.12rem}
  .opt{min-height:60px}
  .rank{grid-template-columns:1fr}
  .stats{justify-content:flex-start}
  .ev{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .28s ease-out both}
  @keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
  .xpbar i{transition:width .8s ease}
}

/* ---------- 2.0 additions ---------- */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sechead h2{font-size:1.5rem}
.chip.hot{color:var(--accent);border-color:var(--accent)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.lv{color:var(--muted)}
.chip.diff{color:var(--accent);cursor:pointer}
.mono{font-family:var(--mono);font-size:.82rem;overflow-wrap:anywhere}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.logo{display:block;flex:none}
@media (prefers-reduced-motion:no-preference){.logo .sweep{transform-origin:50px 56px;animation:sweep 4s linear infinite}@keyframes sweep{to{transform:rotate(360deg)}}}
.cont{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap}
.btn.big{padding:16px 26px;font-size:1.15rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile b{font:700 1.15rem var(--display)}
.tile span{color:var(--muted);font-size:.9rem}
.tile em{font:600 .76rem var(--mono);font-style:normal;color:var(--accent);margin-top:auto}
.cal{display:flex;gap:3px;flex-wrap:wrap}
.cal i{width:12px;height:12px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.cal i.on{background:var(--ok);border-color:var(--ok)}
.cal i.today{outline:2px solid var(--accent);outline-offset:1px}
.map{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 6px 12px}
.map::before{content:"";position:absolute;left:7%;right:7%;top:31px;height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 14px)}
.stn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0 2px;min-width:0}
.stn .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--display);background:var(--panel2);border:2px solid var(--line);color:var(--muted);
  background-image:conic-gradient(var(--accent) calc(var(--p)*1%),transparent 0);background-origin:border-box}
.stn.live .dot{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 4px rgba(70,217,255,.15)}
.stn.full .dot{background:var(--ok);border-color:var(--ok);color:#06210f}
.stn .nm{font:600 .66rem/1.15 var(--mono);color:var(--muted);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stn.live .nm{color:var(--ink)}
.lesson.done .n{color:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 8px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;opacity:.5}
.bdg span{grid-row:span 2;font-size:1.2rem;color:var(--muted)}
.bdg b{font:700 .86rem var(--display)}
.bdg small{font-size:.74rem;color:var(--muted)}
.bdg.got{opacity:1;border-color:var(--accent)}.bdg.got span{color:var(--accent)}
.dopts{display:grid;gap:10px}
.dopt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.dopt input{grid-row:span 2;accent-color:var(--accent);width:18px;height:18px}
.dopt b{font:700 1.05rem var(--display)}.dopt span{color:var(--muted);font-size:.9rem}
.dopt.on{border-color:var(--accent)}
.tog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tog input{accent-color:var(--accent);width:18px;height:18px;margin-top:3px}
.tog small{display:block;color:var(--muted);font-size:.86rem}
.whybox summary,.pro summary{cursor:pointer;font:700 .8rem var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.whybox .why{margin-top:8px}
.pro{border-left:3px solid var(--t2);background:rgba(201,141,23,.08);padding:10px 14px;border-radius:0 10px 10px 0}
.pro summary{color:var(--t2)}
.pro p{margin-top:6px;font-size:.95rem}
.cap2{display:grid;grid-template-columns:minmax(0,.3fr) minmax(0,.4fr) minmax(0,.3fr);gap:8px;font:600 .74rem var(--mono);color:var(--muted);align-items:center}
.cap2 span:nth-child(2){text-align:center}.cap2 span:nth-child(3){text-align:right}

   aliases and calculated fields that map each sourcetype onto Common Information Model (CIM) names, event types,

   ============================================================ */

    "bad_ip(1)":{args:["ip"],def:"(src_ip=\"$ip$\" OR dest_ip=\"$ip$\" OR srcip=\"$ip$\" OR dstip=\"$ip$\" OR DestinationIp=\"$ip$\")"},
    "hms(1)":{args:["f"],def:"eval $f$=strftime($f$,\"%H:%M:%S\")"}

  extracts:{
    "linux_secure":["(?<result>Failed|Accepted) password for (invalid user )?(?<user>\\S+) from (?<src>\\S+) port (?<src_port>\\d+)"]
  },
  // field aliases: CIM name <- the sourcetype's own name (FIELDALIAS-)
  aliases:{
    "stream:http":{src:"src_ip",dest:"dest_ip",url:"uri"},
    "fgt_traffic":{src:"srcip",dest:"dstip",dest_port:"dstport",src_port:"srcport",bytes_out:"sentbyte",bytes_in:"rcvdbyte"},
    "suricata":{src:"src_ip",dest:"dest_ip",signature:"alert.signature",category:"alert.category",severity_id:"alert.severity"},

    "WinEventLog:Security":{src:"Source_Network_Address",user:"Account_Name"},
    "linux_secure":{}
  },
  // calculated fields (EVAL-): run after aliases, so they can use the CIM names
  calcs:{
    "stream:http":{kb:"round(bytes/1024,1)"},
    "fgt_traffic":{bytes:"sentbyte+rcvdbyte",action:"case(action=\"accept\",\"allowed\",action=\"deny\",\"blocked\")"},
    "WinEventLog:Security":{action:"case(EventCode=4624,\"success\",EventCode=4625,\"failure\")",dest:"host"},

  autolookups:{"WinEventLog:Security":{codes:{table:"windows_events.csv",match:"EventCode",output:["description"]}}},

{id:"L1",stage:1,t:"Events and indexes",goal:"What Splunk actually searches",

   pro:"An index is a set of time-ordered buckets on disk. Naming it is the first thing that makes a search fast, and access to indexes is also how Splunk controls who can see which data."},

{id:"L2",stage:1,t:"Sourcetypes and fields",goal:"Pick the kind of data, then match a field",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http",what:"Narrow to one kind of data.",
   why:"<code>sourcetype</code> says what format the event is in. Splunk uses it to know how to read the event and pull out fields. Here only web requests are left: the IDS alert and the Windows logon are gone.",
   pro:"Besides index, every event carries three default fields: <code>host</code>, the machine it came from; <code>source</code>, the file or channel it was read from; and <code>sourcetype</code>, its format. They're stored when the data arrives, so filtering on them is cheap."},
  {spl:"index=botsv1 sourcetype=stream:http src_ip=23.22.63.114",what:"Match a field instead of any text.",mark:"23.22.63.114",
   why:"<code>field=value</code> matches only when that field has that value. Splunk pulls fields like <code>src_ip</code> out of the raw text as it searches, using the sourcetype's rules. Three requests came from this address.",
   pro:"Fields like <code>src_ip</code> are pulled out while the search runs, not stored in advance. That's called search-time field extraction, and it's why the same raw data can gain new fields later without being loaded again."},
  {spl:"index=botsv1 sourcetype=stream:http status=404",what:"Fields beat bare words.",
   why:"A bare <code>404</code> would match anywhere in the text: a byte count, an ID in a URL. <code>status=404</code> matches only the HTTP status. Two of the scanner's requests hit pages that don't exist. Field values ignore case, but field names don't: <code>STATUS=404</code> would find nothing."}
 ],

{id:"W1",stage:1,t:"Wildcards, NOT and OR",goal:"Match patterns and combine conditions",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http uri=\"*admin*\"",what:"A star matches any characters.",
   why:"<code>*</code> stands for anything, or nothing. <code>uri=\"*admin*\"</code> matches any uri with admin somewhere inside it: five requests to the admin pages. Without the stars, uri would have to be exactly admin, and nothing is.",
   pro:"A wildcard at the start, like <code>*admin</code>, is slow on big data: Splunk can't use its list of indexed words to jump straight to matches. A wildcard only at the end, like <code>admin*</code>, is cheap."},
  {spl:"index=botsv1 sourcetype=stream:http NOT status=200",what:"NOT throws away matches.",
   why:"<code>NOT</code> keeps everything that does not match what follows it. It must be in capitals: a lowercase not is just a word to search for. Seven web requests didn't get a 200.",
   pro:"<code>status!=200</code> looks similar but differs: it only keeps events that have a status field. <code>NOT status=200</code> also keeps events with no status at all. The next step shows why that matters."},
  {spl:"index=botsv1 NOT status=200",what:"Careful: NOT also keeps events with no status at all.",
   why:"Without the sourcetype, the IDS alert and the Windows logon come back too. They have no status field, so status is 200 is not true for them, and NOT keeps them. Nine events instead of seven."},
  {spl:"index=botsv1 sourcetype=stream:http (src_ip=23.22.63.114 OR src_ip=192.168.2.50)",what:"OR keeps events that match either side.",
   why:"<code>OR</code> must be in capitals too. The brackets group the two choices so it's clear what OR joins. Four requests: three from the password guesser and one from the normal visitor.",
   pro:"In the search, Splunk evaluates OR before AND, the opposite of most languages. <code>a OR b c</code> means a or b, and also c. Brackets make it explicit, so use them."}
 ],

   extra:[{t:"uri=admin",why:"Without stars, uri must be exactly admin. No uri is, so nothing matches. Put a star on each side."}]},

{id:"L3",stage:1,t:"Time ranges",goal:"Search only the window you care about",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http earliest=-15m",what:"Pretend it's 22:00. Look at the last 15 minutes only.",
   why:"<code>earliest=-15m</code> means from 15 minutes ago until now: 21:45 to 22:00. The scanner's early requests at 21:42 drop out. Splunk stores events in time order, so a time range lets it skip everything outside the window before reading a single event. It's the biggest speed-up you have.",
   pro:"<code>_time</code> is the time Splunk read from the log when the event arrived. If a log's timestamp was parsed wrong, the event lands in the wrong place on the timeline and time-range searches miss it."},
  {spl:"index=botsv1 sourcetype=stream:http earliest=-20m latest=-15m",what:"Set both ends of the window.",
   why:"<code>latest</code> sets the end. Here the window is 21:40 to 21:45, which holds only the scanner's first burst. Without <code>latest</code>, the end is now. The units are s for seconds, m for minutes, h for hours, d for days and w for weeks.",
   pro:"earliest and latest written in the search override the time picker in the search bar. That makes a saved search behave the same whoever runs it."},
  {spl:"index=botsv1 sourcetype=stream:http earliest=-1h@h",what:"Snap to a clean boundary with @.",
   why:"<code>@h</code> rounds down to the start of the hour. At 22:00, <code>-1h@h</code> means one hour ago, rounded down: 21:00. At 22:20 it would still be 21:00. Analysts use <code>-24h@h</code>, or <code>@d</code> for midnight today, so reports line up with clock hours.",
   pro:"Snapping keeps scheduled searches consistent. A report that runs at 22:07 with <code>-1h@h</code> always starts at 21:00, instead of a window that drifts with the run time."}
 ],

   options:["21:40 to 21:45","21:45 to 22:00","21:40 to 22:00","Nothing: latest must be now"],a:0,
   why:"`earliest` sets the start (20 minutes ago) and `latest` the end (15 minutes ago). In the demo that window held only the scanner's first four requests."},
  {id:"L3q6",lv:2,type:"read",q:"Read the logs. It's 22:00. Which of these does `earliest=-15m` keep?",logs:[9,5,4],hl:["21:47:40","21:45:30","21:42:14"],
   options:["21:47:40 and 21:45:30","Only 21:47:40","All three","Only 21:42:14"],a:0,
   why:"15 minutes before 22:00 is 21:45. Look at the time on the left of each line: 21:47:40 and 21:45:30 are inside the window, 21:42:14 is before it."},
  {id:"L3q7",lv:1,type:"concept",q:"What does `earliest=-7d` mean?",
   options:["From 7 days ago until now","The last 7 minutes","Only day 7 of the month","7 days into the future"],a:0,
   why:"d is days. The units are s, m, h, d and w: seconds, minutes, hours, days and weeks."},
  {id:"L3q8",lv:3,type:"concept",q:"It's 22:20. Where does `earliest=-1h@h` start?",
   options:["21:00","21:20","22:00","20:00"],a:0,
   why:"First go back one hour, to 21:20. Then `@h` rounds down to the start of that hour: 21:00."},
  {id:"L3q9",lv:3,type:"concept",q:"The search says `earliest=-15m`, but the time picker says Last 24 hours. Which wins?",
   options:["The search text","The time picker","Whichever is longer","Splunk shows an error"],a:0,
   why:"earliest and latest written in the search override the time picker. That's why saved searches often carry their own time range."},
  {id:"L3q10",lv:3,type:"concept",q:"An event's timestamp was read wrongly when it arrived. What happens?",
   options:["It sits in the wrong place on the timeline, so time ranges can miss it","Splunk fixes it at search time","It's deleted","Nothing: Splunk ignores timestamps"],a:0,
   why:"`_time` is set when the event arrives. If it's wrong, every time-range search treats the event as if it happened at that wrong time."}
 ]},
/* ---------------------------------------------------------------- 5 */
{id:"L4",stage:1,t:"The pipe and stats",goal:"Turn events into a count",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http",what:"Start with the web requests from lesson 2.",
   why:"Nine events. Reading them one by one works now, but not when there are nine million. We need Splunk to summarise."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count",what:"Add a pipe and count.",
   why:"The pipe <code>|</code> takes everything on its left and hands it to the command on its right. <code>stats count</code> turns all the events into one row with one number. The events themselves are gone now; only the result is left.",
   pro:"stats is a transforming command: it turns events into a results table. In Splunk's search screen, the answer moves from the Events tab to the Statistics tab."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip",what:"Split the count by source.",
   why:"<code>by src_ip</code> gives one row per value of <code>src_ip</code>. Now the story jumps out: one address made five requests, another made three, a normal visitor made one. Notice that only <code>src_ip</code> and <code>count</code> are left; fields like <code>uri</code> are gone after <code>stats</code>.",
   pro:"stats leaves out events that don't have the by field. Over all of botsv1, the Windows logon has no src_ip, so it isn't counted. The IDS alert does have one, so it counts toward 40.80.148.42."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip http_method",what:"Split by two fields at once.",
   why:"With two fields after <code>by</code>, you get one row for each combination that exists. The scanner used both GET and POST, so it gets two rows. Four rows in total."}
 ],
 yourturn:{goal:"Count the web requests for each source IP.",step:2,pieces:["index=botsv1 sourcetype=stream:http","| stats count","by src_ip"],
   extra:[{t:"| table count",why:"table only shows columns. It can't count anything. Counting is the job of stats."}]},
 quiz:[
  {id:"L4q1",lv:1,type:"concept",q:"What does the pipe `|` do?",
   options:["Passes the results on its left into the command on its right","Means OR","Starts a comment","Joins two indexes"],a:0,
   why:"Each pipe is one step. Results flow left to right through the commands."},
  {id:"L4q2",lv:1,type:"read",q:"On the demo data, what comes back?",code:"index=botsv1 sourcetype=stream:http\n| stats count",
   options:["One row: count = 9","9 rows","One row per source IP","The 9 events, unchanged"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats count",cell:[0,"count",9]},
   why:"`stats count` with no `by` makes a single row with the total. There are nine web requests in the sample."},
  {id:"L4q3",lv:2,type:"read",q:"Run this on the sample events. What's the result?",code:"index=botsv1 sourcetype=stream:http\n| stats count by http_method",
   options:["2 rows: GET 5, POST 4","9 rows","1 row: 9","3 rows, one per source"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats count by http_method",rows:2},
   why:"`by http_method` makes one row per method. Five requests were GETs (four scanner, one visitor) and four were POSTs (three brute force, one more from the scanner)."},
  {id:"L4q4",lv:2,type:"concept",q:"After `| stats count by src_ip`, can the next pipe still use the `uri` field?",
   options:["No: only src_ip and count are left","Yes, every field stays","Only if you sort first","Only for the first event"],a:0,
   why:"`stats` replaces the events with its result table. Only the fields it outputs survive: the `by` field and the count. If you need `uri` later, you have to keep it inside `stats`, which comes in lesson 9."},
  {id:"L4q5",lv:1,type:"read",q:"How many commands does this search run?",code:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip",
   options:["2: the search, then stats","1","3","4"],a:0,
   why:"Each pipe starts a new command. The part before the first pipe is the search itself; after the pipe comes `stats`. Counting the pipes is the first step in reading any search."},
  {id:"L4q6",lv:1,type:"fill",q:"Which word fills the gap?",code:"index=botsv1 sourcetype=stream:http\n| stats count ____ src_ip",codeOpts:true,
   options:["by","per","group","for"],a:0,
   why:"`by` names the field to split the count on: one row for each value of `src_ip`."},
  {id:"L4q7",lv:2,type:"read",q:"Read the logs. These three events go into `| stats count by http_method`. What comes out?",logs:[9,8,5],hl:["POST","GET"],
   options:["GET 1, POST 2","POST 3","GET 2, POST 1","3 rows"],a:0,
   why:"Read the method in each line: 21:47:40 is a POST, 21:46:05 is a GET and 21:45:30 is a POST. So GET gets 1 and POST gets 2."},
  {id:"L4q8",lv:2,type:"read",q:"On the demo data, how many rows come back?",code:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip http_method",
   options:["4","3","2","9"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats count by src_ip http_method",rows:4},
   why:"One row per combination that exists: the visitor with GET, the guesser with POST, and the scanner twice, with GET and with POST."},
  {id:"L4q9",lv:3,type:"read",q:"Over all of botsv1, what count does 40.80.148.42 get here?",code:"index=botsv1\n| stats count by src_ip",
   options:["6","5","4","11"],a:0,chk:{spl:"index=botsv1 | stats count by src_ip",cell:[2,"count",6]},
   why:"Without the sourcetype, the IDS alert comes in too, and it has a src_ip of 40.80.148.42. Five web requests plus the alert make six."},
  {id:"L4q10",lv:3,type:"concept",q:"The Windows logon has no `src_ip`. What happens to it in `| stats count by src_ip`?",
   options:["It's left out of the results","It gets its own row with an empty src_ip","Splunk shows an error","It's counted under every address"],a:0,
   why:"stats only counts events that have the by field. Events without it simply don't appear, which is easy to forget when a total looks too low."}
 ]},
/* ---------------------------------------------------------------- 6 */
{id:"L5",stage:1,t:"Sort and head",goal:"Put the loudest first",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip",what:"Where lesson 5 ended.",
   why:"<code>stats</code> sorts its rows by the <code>by</code> field. Numbers sort as numbers, but IP addresses sort as text, character by character. That's why 192.168.2.50 comes first: text order, not importance."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| sort -count",what:"Sort by the count, biggest first.",
   why:"<code>sort count</code> would go smallest first. The minus sign flips it to biggest first. <code>sort</code> can only use <code>count</code> because <code>stats</code> just created it.",
   pro:"sort keeps at most 10,000 rows unless you say otherwise. <code>sort 0 -count</code> sorts everything. Silent cut-offs like this are a classic way to miss something in big data."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| sort -count\n| head 1",what:"Keep only the top row.",
   why:"<code>head 1</code> keeps the first row and drops the rest. With no number, head keeps 10. Because we sorted first, the first row is the noisiest source: our scanner. Order matters: <code>head</code> before <code>sort</code> would keep 192.168.2.50.",
   pro:"<code>tail 1</code> keeps the last row instead of the first."}
 ],
 yourturn:{goal:"Find the single noisiest source IP.",pieces:["index=botsv1 sourcetype=stream:http","| stats count by src_ip","| sort -count","| head 1"],
   extra:[{t:"| sort count",why:"sort count goes smallest first, so head 1 would keep the quietest source. The minus in sort -count puts the biggest first."}]},
 quiz:[
  {id:"L5q1",lv:1,type:"concept",q:"What does `| sort -count` do?",
   options:["Puts the biggest count first","Puts the smallest count first","Removes the count column","Sorts by name"],a:0,
   why:"`sort` goes smallest first. The minus flips it, biggest first."},
  {id:"L5q2",lv:1,type:"read",q:"What does this produce on the demo data?",code:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| sort -count\n| head 1",
   options:["40.80.148.42 with count 5","23.22.63.114 with count 3","192.168.2.50 with count 1","All three rows"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http | stats count by src_ip | sort -count | head 1",cell:[0,"src_ip","40.80.148.42"]},
   why:"Sorted biggest first, the scanner's 5 requests come top, and `head 1` keeps just that row."},
  {id:"L5q3",lv:2,type:"order",q:"Put the pipes in order to find the noisiest source.",
   items:["index=botsv1 sourcetype=stream:http","| stats count by src_ip","| sort -count","| head 1"],
   why:"Find the events, count them, sort the counts, keep the top. Each step needs the one before it: `sort -count` needs the count from `stats`, and `head` only gives the top after sorting."},
  {id:"L5q4",lv:2,type:"bug",q:"This should return the noisiest source but returns 192.168.2.50. Which line throws rows away too early?",codeOpts:true,
   options:["index=botsv1 sourcetype=stream:http","| stats count by src_ip","| head 1","| sort -count"],a:2,
   chk:{spl:"index=botsv1 sourcetype=stream:http | stats count by src_ip | head 1 | sort -count",cell:[0,"src_ip","192.168.2.50"]},
   why:"`head 1` runs before the sort, so it keeps whatever row is first, and `stats` orders rows alphabetically by `src_ip`. Sorting one row afterwards changes nothing. head belongs after the sort."},
  {id:"L5q5",lv:1,type:"fill",q:"Which symbol puts the biggest count first?",code:"| sort ____count",codeOpts:true,
   options:["-","!","^","~"],a:0,
   why:"A minus in front of the field name means biggest first. With nothing in front, `sort` goes smallest first."},
  {id:"L5q6",lv:2,type:"concept",q:"How many rows does `| head` keep when you don't give a number?",
   options:["10","1","All of them","100"],a:0,
   why:"head with no number keeps the first 10 rows."},
  {id:"L5q7",lv:2,type:"read",q:"Read the logs. They arrive in this order. Which one does `| head 1` keep?",logs:[9,8,5],hl:["21:47:40"],
   options:["The one at 21:47:40","The one at 21:45:30","The one at 21:46:05","All three"],a:0,
   why:"Search results come newest first, and head keeps from the top. The first line is 21:47:40, so that's the one kept."},
  {id:"L5q8",lv:3,type:"concept",q:"A table has 50,000 rows. What does `| sort -count` give you?",
   options:["Only 10,000 rows: sort stops there unless you say otherwise","All 50,000 rows, sorted","An error","The 10 biggest"],a:0,
   why:"sort's default limit is 10,000 rows. Use `sort 0 -count` to sort them all."},
  {id:"L5q9",lv:3,type:"read",q:"You run this on the sample. What do you get back?",code:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| sort -count\n| tail 1",
   options:["192.168.2.50 with count 1","40.80.148.42 with count 5","23.22.63.114 with count 3","Nothing"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http | stats count by src_ip | sort -count | tail 1",cell:[0,"src_ip","192.168.2.50"]},
   why:"Sorted biggest first, the last row is the quietest source. `tail 1` keeps the last row."},
  {id:"L5q10",lv:3,type:"fill",q:"Fill the gap so sort has no row limit.",code:"| sort ____ -count",codeOpts:true,
   options:["0","all","*","-1"],a:0,
   why:"A number straight after sort is its limit, and 0 means no limit."}
 ]},
/* ---------------------------------------------------------------- 7 */
{id:"L6",stage:1,t:"Tables, timelines, rename",goal:"Pick columns and tell the story in order",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http src_ip=23.22.63.114",what:"Back to the three POSTs from one source.",
   why:"Raw events are hard to scan. In an investigation you want only the columns that tell the story."},
  {spl:"index=botsv1 sourcetype=stream:http src_ip=23.22.63.114\n| table _time http_method uri status",what:"Show only the columns you need.",
   why:"<code>table</code> keeps the fields you list, in that order, with one row per event. Unlike <code>stats</code>, it doesn't summarise: every event is still there. Note the order: newest first, which is how Splunk returns results.",
   pro:"table is for the final display. In the middle of a search, the lighter command is fields, which comes in lesson 12."},
  {spl:"index=botsv1 sourcetype=stream:http src_ip=23.22.63.114\n| table _time http_method uri status\n| sort _time",what:"Flip it into a timeline, oldest first.",
   why:"<code>sort _time</code> sorts oldest first, so the attack reads like a story from start to finish. Three POSTs to the admin login, one second apart: that's a script guessing passwords, not a person."},
  {spl:"index=botsv1 sourcetype=stream:http src_ip=23.22.63.114\n| table _time http_method uri status\n| sort _time\n| rename http_method AS method, uri AS page",what:"Give columns friendlier names.",
   why:"<code>rename</code> changes a field's name: old name, the word <code>AS</code>, new name. Separate several with commas. From here on the old names are gone, so a later pipe has to use method and page.",
   pro:"A new name with spaces needs double quotes: <code>rename src_ip AS \"Source IP\"</code>. Rename last, just before showing results, so the pipes in between keep working on the standard names."}
 ],
 yourturn:{goal:"Show a timeline, oldest first, of the requests from 23.22.63.114.",step:2,pieces:["index=botsv1 sourcetype=stream:http src_ip=23.22.63.114","| table _time http_method uri status","| sort _time"],
   extra:[{t:"| sort -_time",why:"sort -_time puts the newest first, which is already the default order. A timeline reads oldest first: sort _time."}]},
 quiz:[
  {id:"L6q1",lv:1,type:"concept",q:"What does `| table _time src_ip uri` do?",
   options:["Shows only those columns, in that order, one row per event","Counts events by those fields","Creates a lookup table","Removes those fields"],a:0,
   why:"`table` chooses columns for display. It keeps every event as its own row, so it's for reading, not summarising."},
  {id:"L6q2",lv:1,type:"concept",q:"Results come back newest first. What turns them into a timeline, oldest first?",codeOpts:true,
   options:["| sort _time","| sort -_time","| head _time","| table -_time"],a:0,
   why:"`sort _time` sorts smallest (oldest) first. `sort -_time` would give newest first, which is the default anyway."},
  {id:"L6q3",lv:2,type:"read",q:"Which columns does this show, and in what order?",code:"index=botsv1 sourcetype=stream:http\n| table uri _time src_ip",
   options:["uri, then _time, then src_ip","_time first, always","Alphabetical: _time, src_ip, uri","Only uri"],a:0,
   why:"`table` shows exactly the fields you list, in the order you list them. Put `_time` first when you want a readable timeline."},
  {id:"L6q4",lv:1,type:"concept",q:"Which keeps one row per event: `table` or `stats count by src_ip`?",
   options:["table","stats","Both","Neither"],a:0,
   why:"`table` only picks columns, so all events stay. `stats` collapses them into one row per group."},
  {id:"L6q5",lv:2,type:"read",q:"With the demo data, what's in the first row?",code:"index=botsv1 sourcetype=stream:http src_ip=23.22.63.114\n| table _time http_method uri\n| sort _time",
   options:["21:45:30 · POST · /joomla/administrator/index.php","21:45:32 · POST · /joomla/administrator/index.php","21:47:40 · POST · /joomla/administrator/index.php","The number 3"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http src_ip=23.22.63.114 | table _time http_method uri | sort _time",rows:3,cell:[0,"_time",1470865530]},
   why:"After `sort _time` the oldest request comes first: 21:45:30. 21:47:40 was a different source, so it isn't in these results at all."},
  {id:"L6q6",lv:1,type:"concept",q:"What does `| rename uri AS page` do?",
   options:["Changes the field's name from uri to page","Copies uri into a new field and keeps both","Deletes the page field","Filters to events with a page"],a:0,
   why:"rename changes the name. The values stay the same, and the old name no longer exists."},
  {id:"L6q7",lv:1,type:"fill",q:"Which word fills the gap?",code:"| rename src_ip ____ attacker",codeOpts:true,
   options:["AS","TO","=","->"],a:0,
   why:"rename reads: old name, AS, new name."},
  {id:"L6q8",lv:3,type:"concept",q:"After `| rename uri AS page`, what does a later `| table uri` show?",
   options:["Nothing for uri: that field doesn't exist any more","The original uri values","The page values","An error"],a:0,
   why:"From the rename on, the field is called page. A later pipe that asks for uri finds nothing, so either rename last or use the new name."},
  {id:"L6q9",lv:2,type:"read",q:"Read the logs. They go into `| table _time src_ip | sort _time | head 1`. Which row comes out?",logs:[8,4,1],hl:["21:46:05","21:42:14","21:42:11"],
   options:["21:42:11 · 40.80.148.42","21:46:05 · 192.168.2.50","21:42:14 · 40.80.148.42","All three rows"],a:0,
   why:"sort _time puts the oldest first. Of 21:46:05, 21:42:14 and 21:42:11, the oldest is 21:42:11, and head 1 keeps just that row."},
  {id:"L6q10",lv:3,type:"concept",q:"Which rename works for a column name with a space in it?",codeOpts:true,
   options:["| rename src_ip AS \"Source IP\"","| rename src_ip AS Source IP","| rename \"src_ip\" TO Source IP","| rename src_ip=Source IP"],a:0,
   why:"A name with spaces needs double quotes around it. Without them, Splunk reads Source and IP as two separate words."}
 ]},
/* ---------------------------------------------------------------- 8 */
{id:"N2",stage:1,t:"top, rare and dedup",goal:"Most common, least common, one of each",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n| top uri",what:"top counts each value and puts the most common first.",
   why:"<code>top</code> counts how often each value of a field appears, sorts biggest first, and adds a percent column. The admin login page got four of the nine requests: 44 percent.",
   pro:"top is a shortcut for <code>stats count by uri</code>, then <code>sort -count</code>, then <code>head 10</code>, with the percent added. <code>showperc=false</code> hides the percent column."},
  {spl:"index=botsv1 sourcetype=stream:http\n| top limit=1 src_ip",what:"limit sets how many rows you get.",
   why:"<code>limit=1</code> keeps only the most common value. Without a limit, top shows 10 rows. The scanner made five of the nine requests: 55 percent."},
  {spl:"index=botsv1 sourcetype=stream:http\n| rare http_user_agent",what:"rare is the opposite: least common first.",
   why:"<code>rare</code> counts the same way but puts the least common values at the top. In hunting, the rare thing is often the interesting one: a user agent seen twice deserves a closer look than one seen a million times."},
  {spl:"index=botsv1 sourcetype=stream:http\n| dedup src_ip\n| table _time src_ip uri",what:"dedup keeps one event for each value.",
   why:"<code>dedup src_ip</code> keeps the first event it sees for each address and drops the rest. Results arrive newest first, so you get each source's latest request. Unlike top, the whole event is kept.",
   pro:"dedup can take several fields: <code>dedup src_ip uri</code> keeps one event per pair of values. Events that don't have the field at all are dropped."}
 ],
 yourturn:{goal:"Show each source's latest request: time, source and page.",
   pieces:["index=botsv1 sourcetype=stream:http","| dedup src_ip","| table _time src_ip uri"],
   extra:[{t:"| top src_ip",why:"top counts the values and throws the events away, so there's no time or page left to show. dedup keeps whole events."}]},
 quiz:[
  {id:"N2q1",lv:1,type:"concept",q:"What does `| top uri` return?",
   options:["Each uri with its count and percent, most common first","The first 10 events","Only the most common uri","Every uri, alphabetically"],a:0,
   why:"top counts each value, sorts biggest first, and adds a percent. It shows 10 rows unless you set a limit."},
  {id:"N2q2",lv:1,type:"concept",q:"What does `rare` put first?",
   options:["The least common values","The most common values","The newest events","The oldest events"],a:0,
   why:"rare is top in reverse: least common first. Unusual values are often where an investigation starts."},
  {id:"N2q3",lv:1,type:"concept",q:"What does `| dedup src_ip` do?",
   options:["Keeps one event per src_ip value","Counts the events per src_ip","Deletes the src_ip field","Sorts by src_ip"],a:0,
   why:"dedup removes repeats: for each value it keeps the first event and drops the others."},
  {id:"N2q4",lv:2,type:"read",q:"On the demo data, what comes back?",code:"index=botsv1 sourcetype=stream:http\n| top limit=1 src_ip",
   options:["40.80.148.42, count 5, percent 55.555556","40.80.148.42, count 6","23.22.63.114, count 3","3 rows"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http | top limit=1 src_ip",cell:[0,"percent",55.555556]},
   why:"The scanner made five of the nine web requests. Five out of nine is about 55.6 percent, and limit=1 keeps only that row."},
  {id:"N2q5",lv:2,type:"read",q:"Run this on the sample. How many rows result?",code:"index=botsv1 sourcetype=stream:http\n| dedup src_ip",
   options:["3","9","1","5"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | dedup src_ip",rows:3},
   why:"There are three different source addresses, so dedup keeps one event for each."},
  {id:"N2q6",lv:2,type:"read",q:"Read the logs. They arrive in this order. Which one is left after `| dedup src_ip`?",logs:[7,6,5],hl:["23.22.63.114"],
   options:["21:45:32","21:45:30","21:45:31","All three"],a:0,
   why:"All three share the same src_ip. dedup keeps the first one it sees, and the first line is 21:45:32, the newest."},
  {id:"N2q7",lv:2,type:"read",q:"With the demo data, which user agent is in the first row?",code:"index=botsv1 sourcetype=stream:http\n| rare http_user_agent",codeOpts:true,
   options:["Mozilla/5.0","Acunetix","Python-urllib/2.7","192.168.2.50"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http | rare http_user_agent",cell:[0,"http_user_agent","Mozilla/5.0"]},

  {id:"N2q8",lv:3,type:"concept",q:"`| top uri` gives the same counts as which search?",codeOpts:true,
   options:["| stats count by uri\n| sort -count\n| head 10","| dedup uri","| stats count\n| sort uri","| table uri count"],a:0,
   why:"top is that three-step pattern in one word, plus a percent column."},
  {id:"N2q9",lv:3,type:"concept",q:"You need each source's latest request with its page and time. dedup or top?",
   options:["dedup: it keeps whole events","top: it keeps whole events","Either: they return the same","Neither can do it"],a:0,
   why:"top turns events into counts, so the other fields are gone. dedup keeps the events themselves, one per value."},
  {id:"N2q10",lv:3,type:"concept",q:"What does `| dedup src_ip uri` keep?",
   options:["One event for each pair of src_ip and uri","One event per src_ip, and one per uri","Only events that have no uri","Every event"],a:0,
   why:"With two fields, dedup looks at the combination. A source that asked for three different pages keeps three events."}
 ]},

{id:"N3",stage:1,t:"More stats: dc, values, sum, avg",goal:"Describe each group, not just count it",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count dc(uri) by src_ip",what:"dc counts the different values.",
   why:"<code>dc(uri)</code> is the distinct count: how many different pages each source asked for. The scanner hit five different pages. The guesser hit one page three times. Same idea, very different pattern."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats values(status) by src_ip",what:"values lists each different value once.",
   why:"<code>values(status)</code> shows every different status a source received, sorted, in one cell. The scanner saw 200, 303, 404 and 500: the signature of something poking around.",
   pro:"<code>list()</code> is the cousin of values: it keeps every value in arrival order, repeats included. Both make a multivalue field, several values in one cell."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats sum(bytes) avg(bytes) by src_ip",what:"sum and avg do the maths on a number field.",
   why:"<code>sum(bytes)</code> adds up the bytes, <code>avg(bytes)</code> gives the average. min and max work the same way. And <code>count</code> on its own counts events, while <code>count(uri)</code> counts only the events that have a <code>uri</code>, so it tells you how many requests actually carried one. You can ask for several calculations in one stats."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count AS requests dc(uri) AS pages by src_ip",what:"Name the columns with AS.",
   why:"<code>AS</code> names a result column. The table reads better, and later pipes get a short, clear name to work with: <code>where pages > 2</code>.",
   pro:"After <code>count AS requests</code> there's no field called count any more. A later <code>where count > 2</code> quietly finds nothing."}
 ],
 yourturn:{goal:"For each source, show how many requests it made and how many different pages, named requests and pages.",
   pieces:["index=botsv1 sourcetype=stream:http","| stats count AS requests","dc(uri) AS pages","by src_ip"],
   extra:[{t:"count(uri) AS pages",why:"count(uri) counts every request that has a uri, repeats included. Different pages is the distinct count: dc(uri)."}]},
 quiz:[
  {id:"N3q1",lv:1,type:"concept",q:"What does `dc(uri)` calculate?",
   options:["How many different uri values there are","How many events have a uri","The longest uri","The first uri"],a:0,
   why:"dc is the distinct count: repeats only count once."},
  {id:"N3q2",lv:1,type:"read",q:"With the demo data, what is `dc(uri)` for 23.22.63.114?",code:"index=botsv1 sourcetype=stream:http\n| stats dc(uri) by src_ip",
   options:["1","3","5","0"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats dc(uri) by src_ip",cell:[1,"dc(uri)",1]},
   why:"The guesser asked for the same admin login page three times. One different page."},
  {id:"N3q3",lv:1,type:"fill",q:"Which word names the count column requests?",code:"| stats count ____ requests by src_ip",codeOpts:true,
   options:["AS","=","NAME","TO"],a:0,
   why:"In stats, `AS` gives a result column its name."},
  {id:"N3q4",lv:2,type:"read",q:"With the demo data, what is `sum(bytes)` for 23.22.63.114?",code:"index=botsv1 sourcetype=stream:http\n| stats sum(bytes) by src_ip",
   options:["3072","1024","7350","3"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats sum(bytes) by src_ip",cell:[1,"sum(bytes)",3072]},
   why:"Three requests of 1024 bytes each: 3 times 1024 is 3072."},
  {id:"N3q5",lv:2,type:"read",q:"With the demo data, what does `values(status)` show for the scanner?",code:"index=botsv1 sourcetype=stream:http\n| stats values(status) by src_ip",
   options:["200, 303, 404, 500","404","200, 404, 404, 500, 303","5"],a:0,
   why:"values lists each different status once, sorted. Repeats like the two 404s appear only once."},
  {id:"N3q6",lv:2,type:"read",q:"Read the logs. These three go into `| stats dc(status)`. What's the answer?",logs:[2,1,0],hl:["200","404"],
   options:["2","3","1","404"],a:0,
   why:"The statuses are 404, 404 and 200. Two different values, so the distinct count is 2."},
  {id:"N3q7",lv:3,type:"read",q:"For 23.22.63.114, what are `count(uri)` and `dc(uri)`?",code:"index=botsv1 sourcetype=stream:http\n| stats count(uri) dc(uri) by src_ip",
   options:["3 and 1","1 and 3","3 and 3","1 and 1"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats count(uri) dc(uri) by src_ip",cell:[1,"count(uri)",3]},
   why:"count(uri) counts every request with a uri: three. dc(uri) counts different pages: one."},
  {id:"N3q8",lv:3,type:"concept",q:"Which keeps repeats, in the order they arrived?",codeOpts:true,
   options:["list(status)","values(status)","dc(status)","count(status)"],a:0,
   why:"list keeps every value in order, repeats included. values sorts and removes repeats."},
  {id:"N3q9",lv:3,type:"read",q:"Run this on the sample events. What's the result?",code:"index=botsv1 sourcetype=stream:http\n| stats count AS requests by src_ip\n| where count > 2",
   options:["Nothing: there's no count field after AS","2 rows","3 rows","An error"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http | stats count AS requests by src_ip | where count > 2",rows:0},
   why:"The column is called requests now. where looks for a field called count, finds none, and keeps no rows. It needs `where requests > 2`."},
  {id:"N3q10",lv:3,type:"read",q:"With the demo data, what is `avg(bytes)` for the scanner?",code:"index=botsv1 sourcetype=stream:http\n| stats avg(bytes) by src_ip",
   options:["1470","7350","5","5120"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats avg(bytes) by src_ip",cell:[2,"avg(bytes)",1470]},
   why:"The scanner's five requests add up to 7350 bytes. Divided by five, that's 1470."}
 ]},

{id:"L7",stage:1,t:"eval: make a new field",goal:"Calculate something that isn't in the data",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n| eval kb=bytes/1024\n| table src_ip bytes kb",what:"Turn bytes into kilobytes.",
   why:"<code>eval</code> runs a calculation on every event and stores the answer in a new field, here <code>kb</code>. Fields made by <code>eval</code> work like any other: you can show them, sort on them or count by them."},
  {spl:"index=botsv1 sourcetype=stream:http\n| eval tool=if(http_user_agent=\"Acunetix\", \"scanner\", \"other\")\n| table src_ip http_user_agent tool",what:"Label events with if().",
   why:"<code>if(test, then, else)</code> gives one value when the test is true and another when it isn't. The words in double quotes are text; without quotes Splunk would read <code>scanner</code> as the name of a field. Its last request used a browser user agent, so it slipped through as other.",
   pro:"Inside the brackets, = is a test; the first = in eval is the assignment. == works for the test too. Text is joined with a dot: <code>eval label=src_ip.\" on \".uri</code>."},
  {spl:"index=botsv1 sourcetype=stream:http\n| eval tool=if(http_user_agent=\"Acunetix\", \"scanner\", \"other\")\n| stats count by tool",what:"Count on the field you just made.",
   why:"Because <code>tool</code> is a real field now, <code>stats</code> can split by it. Four scanner requests, five others. This is how analysts build their own categories on the fly."},
  {spl:"index=botsv1 sourcetype=stream:http\n| eval result=case(status>=500, \"error\", status>=400, \"fail\", true(), \"ok\")\n| stats count by result",what:"More than two labels with case().",
   why:"<code>case()</code> takes pairs: a test, then the value to use. The first test that's true wins. <code>true()</code> at the end catches everything else. One server error, two failures, six fine.",
   pro:"Without the final <code>true()</code> pair, events that match no test get no value at all, and stats by that field leaves them out."}
 ],
 yourturn:{goal:"Label each web request as scanner or other, then count each label.",step:2,pieces:["index=botsv1 sourcetype=stream:http","| eval tool=if(http_user_agent=\"Acunetix\", \"scanner\", \"other\")","| stats count by tool"],
   extra:[{t:"| eval tool=if(http_user_agent=Acunetix, scanner, other)",why:"Without double quotes, eval reads Acunetix, scanner and other as field names, not text. Those fields don't exist, so the labels come out empty."}]},
 quiz:[
  {id:"L7q1",lv:1,type:"concept",q:"What does `eval` do?",
   options:["Calculates a new field on every event","Filters events","Counts events","Renames the index"],a:0,
   why:"`eval` computes a value per event and stores it as a field. It doesn't remove or count anything."},
  {id:"L7q2",lv:1,type:"read",q:"An event has `bytes=2048`. What is `kb`?",code:"| eval kb=bytes/1024",
   options:["2","2048","1024","0.5"],a:0,
   why:"2048 divided by 1024 is 2. `eval` does ordinary arithmetic on field values."},
  {id:"L7q3",lv:2,type:"read",q:"For an event with the user agent Mozilla/5.0, what is `tool`?",code:"| eval tool=if(http_user_agent=\"Acunetix\", \"scanner\", \"other\")",
   options:["other","scanner","Mozilla/5.0","Empty"],a:0,
   why:"The test is false, so `if()` returns its third argument, \"other\". That's how the scanner's last request slipped through in the demo."},
  {id:"L7q4",lv:1,type:"fill",q:"Which symbol fills the gap?",code:"| eval kb ____ bytes/1024",codeOpts:true,
   options:["=","==","AS","to"],a:0,
   why:"`eval` reads as: new field, equals sign, calculation. `kb=bytes/1024` makes a field called kb from the calculation on the right."},
  {id:"L7q5",lv:2,type:"concept",q:"Why are \"scanner\" and \"other\" in double quotes inside `eval`?",
   options:["Quotes make them text; without them Splunk looks for fields with those names","Quotes are just decoration","To make them case-sensitive","Quotes mean a regex"],a:0,
   why:"In `eval`, a bare word is a field name and double quotes make a text value. Forget the quotes and you get the value of a field called scanner, which doesn't exist, so the result is empty."},
  {id:"L7q6",lv:1,type:"read",q:"How many rows does this produce on the demo data?",code:"index=botsv1 sourcetype=stream:http\n| eval tool=if(http_user_agent=\"Acunetix\", \"scanner\", \"other\")\n| stats count by tool",
   options:["2","9","1","4"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | eval tool=if(http_user_agent=\"Acunetix\", \"scanner\", \"other\") | stats count by tool",rows:2},
   why:"`tool` only has two values, scanner and other, so `stats count by tool` makes two rows: scanner 4, other 5."},
  {id:"L7q7",lv:2,type:"read",q:"Read the log. What is `result` for this event?",code:"| eval result=case(status>=500, \"error\", status>=400, \"fail\", true(), \"ok\")",logs:[4],hl:["500"],
   options:["error","fail","ok","Empty"],a:0,
   why:"The log says status 500. The first test, status>=500, is true, and the first true test wins: error."},
  {id:"L7q8",lv:2,type:"read",q:"With the demo data, what's the count for fail?",code:"index=botsv1 sourcetype=stream:http\n| eval result=case(status>=500, \"error\", status>=400, \"fail\", true(), \"ok\")\n| stats count by result",
   options:["2","3","1","6"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | eval result=case(status>=500, \"error\", status>=400, \"fail\", true(), \"ok\") | stats count by result",cell:[1,"count",2]},
   why:"The two 404s are 400 or more but under 500, so they're fail. The 500 was caught first by the error test."},
  {id:"L7q9",lv:3,type:"concept",q:"What happens without the final `true(), \"ok\"` pair in that case()?",
   options:["Events matching no test get no value, and stats by result leaves them out","They become \"ok\" anyway","Splunk shows an error","They become \"error\""],a:0,
   why:"case() returns nothing when no test is true. stats skips events that don't have the by field, so six events would vanish from the counts."},
  {id:"L7q10",lv:3,type:"read",q:"An event has `src_ip=10.0.0.9`. What is `label`?",code:"| eval label=\"from \".src_ip",
   options:["from 10.0.0.9","from src_ip","from .10.0.0.9","Empty"],a:0,
   why:"In eval, the dot joins text. \"from \" is text in quotes, src_ip is a field, and the dot glues them together."}
 ]},

{id:"L8",stage:1,t:"where: filter what you calculated",goal:"Keep only the rows that matter",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip",what:"Three sources and their counts.",
   why:"We want only the busy ones. But <code>count</code> didn't exist before <code>stats</code> made it, so we can't filter on it in the search at the start."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| where count > 2",what:"Filter on the new field.",
   why:"<code>where</code> keeps rows where its test is true. It can test any field that exists at that point, including ones made by <code>stats</code> or <code>eval</code>. The normal visitor with one request is gone.",
   pro:"Filter in the first part of the search whenever you can: that part uses the index to skip data before it's read, while where only runs after events are fetched. And where compares text exactly, case included: <code>where http_method=\"post\"</code> finds nothing."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| where count > 2\n| sort -count",what:"Busiest first.",
   why:"Same sort as lesson 6. You've now built a real hunt: which sources are unusually busy against our web server? Swap the 2 for a sensible number and this is a basic scanner detection."},
  {spl:"index=botsv1 sourcetype=stream:http\n| where like(uri, \"%admin%\") AND status!=404\n| stats count by src_ip",what:"Patterns in where use like().",
   why:"In <code>where</code>, a star is just a star. For a pattern, use <code>like()</code>, where <code>%</code> means any characters. Here: admin pages that didn't get a 404. Four requests, three from the guesser."}
 ],
 yourturn:{goal:"Which sources made more than 2 requests? Busiest first.",step:2,pieces:["index=botsv1 sourcetype=stream:http","| stats count by src_ip","| where count > 2","| sort -count"],
   extra:[{t:"| head 2",why:"head 2 keeps the first two rows whatever their counts are. To keep rows by their value, filter with where."}]},
 quiz:[
  {id:"L8q1",lv:1,type:"concept",q:"Why does `where count > 2` go after `stats`, not in the first part of the search?",
   options:["count doesn't exist until stats creates it","The first part is case-sensitive","> isn't allowed in SPL","The first part only accepts indexes"],a:0,
   why:"Each pipe can only use fields that exist at that point. `count` is made by `stats`, so the filter has to come after it."},
  {id:"L8q2",lv:1,type:"read",q:"What does this produce on the demo data?",code:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| where count > 2",
   options:["2 rows: 23.22.63.114 (3) and 40.80.148.42 (5)","1 row","3 rows","Nothing"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats count by src_ip | where count > 2",rows:2},
   why:"The counts were 1, 3 and 5. Only 3 and 5 are bigger than 2."},
  {id:"L8q3",lv:2,type:"bug",q:"This should count admin-page requests per source, but returns nothing. Which line is wrong?",codeOpts:true,
   options:["index=botsv1 sourcetype=stream:http","| where uri=\"*admin*\"","| stats count by src_ip"],a:1,
   chk:{spl:"index=botsv1 sourcetype=stream:http | where uri=\"*admin*\" | stats count by src_ip",rows:0},
   why:"`where` compares exactly, so the stars are taken literally and no uri equals \"*admin*\". Put `uri=\"*admin*\"` in the first part of the search, or use `like(uri, \"%admin%\")` in where."},
  {id:"L8q4",lv:1,type:"read",q:"Which line throws rows away after the counting?",code:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| where count > 2\n| sort -count",codeOpts:true,
   options:["| where count > 2","| stats count by src_ip","| sort -count","index=botsv1 sourcetype=stream:http"],a:0,
   why:"`where` keeps only rows where its test is true, so it drops the source with one request. `stats` summarises and `sort` only reorders; neither removes rows."},
  {id:"L8q5",lv:2,type:"order",q:"Build the hunt: which sources made more than 2 requests, busiest first?",
   items:["index=botsv1 sourcetype=stream:http","| stats count by src_ip","| where count > 2","| sort -count"],
   why:"Events, then count, then filter on the count, then sort. `where` needs `count`, which only exists after `stats`."},
  {id:"L8q6",lv:2,type:"concept",q:"In `where`, which test matches any uri containing admin?",codeOpts:true,
   options:["like(uri, \"%admin%\")","uri=\"*admin*\"","uri=admin","like(uri, \"*admin*\")"],a:0,
   why:"In where, the pattern function is like(), and its wildcard is %. A star is just a star there."},
  {id:"L8q7",lv:2,type:"read",q:"Read the logs. Which ones survive `| where bytes > 1000`?",logs:[8,5,1],hl:["5120","1024","312"],
   options:["21:46:05 and 21:45:30","Only 21:46:05","All three","Only 21:42:11"],a:0,
   why:"Look at bytes in each line: 5120, 1024 and 312. The first two are bigger than 1000; 312 isn't."},
  {id:"L8q8",lv:3,type:"read",q:"On the demo data, how many rows come back?",code:"index=botsv1 sourcetype=stream:http\n| where http_method=\"post\"",
   options:["0","4","5","9"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | where http_method=\"post\"",rows:0},
   why:"where compares text exactly, case included. The method is POST in capitals, so \"post\" matches nothing. In the first part of the search, http_method=post would have matched."},
  {id:"L8q9",lv:3,type:"concept",q:"Why put a filter like `status=404` in the first part of the search rather than in `where`?",
   options:["The first part uses the index to skip data before it's read","where can't test status","It's only a style choice","where is case-insensitive"],a:0,
   why:"The base search lets Splunk skip whole chunks of data. where only runs on events that were already fetched, so filtering there costs more."},
  {id:"L8q10",lv:3,type:"read",q:"With the demo data, what's the count for 40.80.148.42?",code:"index=botsv1 sourcetype=stream:http\n| where like(uri, \"%admin%\") AND status!=404\n| stats count by src_ip",
   options:["1","2","5","3"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | where like(uri, \"%admin%\") AND status!=404 | stats count by src_ip",cell:[1,"count",1]},
   why:"The scanner asked for two admin pages: one got a 404 and is dropped, the POST at 21:47:40 got a 303 and stays."}
 ]},

{id:"N4",stage:1,t:"fields, search, and reading a full hunt",goal:"Read any search pipe by pipe",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n| fields src_ip uri status",what:"fields chooses which fields travel down the pipe.",
   why:"<code>fields</code> keeps only the fields you list, plus internal ones like <code>_time</code> and <code>_raw</code>. With a minus, <code>fields - bytes</code> removes the ones you list instead. table is for showing; fields is for speed.",
   pro:"fields early in a search is a real speed-up on big data: fewer fields travel through every pipe after it."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| search count>2",what:"search later in the pipe filters too.",
   why:"The <code>search</code> command filters with the same rules as the start of a search: wildcards work, and text ignores case. <code>where</code> is for calculations: comparing two fields with each other, or using functions like like()."},
  {spl:"index=botsv1 sourcetype=stream:http ```web requests only```\n| stats count AS requests dc(uri) AS pages by src_ip\n| where requests > 2 ```busy sources```\n| sort -requests",what:"A full hunt, with comments.",
   why:"Text inside triple backticks is a comment: Splunk ignores it. Now read it pipe by pipe. Where: web requests in botsv1. Then: per source, count requests and different pages. Keep the busy ones. Busiest first.",
   pro:"A reading routine for any search: first find where it looks (index, sourcetype, time), then count the pipes, then for each pipe ask what goes in and what comes out."}
 ],
 yourturn:{goal:"Find sources that requested more than 2 different pages.",spl:"index=botsv1 sourcetype=stream:http\n| stats count AS requests dc(uri) AS pages by src_ip\n| where pages > 2",
   pieces:["index=botsv1 sourcetype=stream:http","| stats count AS requests dc(uri) AS pages by src_ip","| where pages > 2"],
   extra:[{t:"| where count > 2",why:"There's no count field any more: stats named it requests. And the goal is different pages, which is pages."}]},
 quiz:[
  {id:"N4q1",lv:1,type:"concept",q:"What does `| fields src_ip uri` do?",
   options:["Keeps only those fields, plus internal ones like _time and _raw","Counts by those fields","Shows them as a table and nothing else","Renames them"],a:0,
   why:"fields chooses what travels on down the pipe. It's mainly about speed; table is the one for display."},
  {id:"N4q2",lv:1,type:"concept",q:"What does Splunk do with ```text in triple backticks```?",
   options:["Ignores it: it's a comment","Searches for it","Treats it as a field name","Shows it as a title"],a:0,
   why:"Triple backticks mark a comment, so you can explain a search inside the search."},
  {id:"N4q3",lv:1,type:"concept",q:"What does `| fields - bytes` do?",
   options:["Removes the bytes field","Keeps only bytes","Subtracts bytes","Sorts by bytes, smallest first"],a:0,
   why:"With a minus, fields removes the fields you list and keeps the rest."},
  {id:"N4q4",lv:2,type:"read",q:"With the demo data, what does this hunt return?",code:"index=botsv1 sourcetype=stream:http ```web requests only```\n| stats count AS requests dc(uri) AS pages by src_ip\n| where requests > 2 ```busy sources```\n| sort -requests",
   options:["2 rows: 40.80.148.42 (5 requests, 5 pages), then 23.22.63.114 (3, 1)","3 rows","1 row: 40.80.148.42","Nothing: the comments break it"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http ```web requests only``` | stats count AS requests dc(uri) AS pages by src_ip | where requests > 2 ```busy sources``` | sort -requests",cell:[1,"src_ip","23.22.63.114"]},
   why:"The visitor has one request, so where drops it. The other two are sorted busiest first. Comments change nothing."},
  {id:"N4q5",lv:2,type:"order",q:"Put the hunt in order.",
   items:["index=botsv1 sourcetype=stream:http","| stats count AS requests dc(uri) AS pages by src_ip","| where requests > 2","| sort -requests"],
   why:"Where to look, then summarise, then filter on the summary, then order it. Each pipe works on what the one before it made."},
  {id:"N4q6",lv:2,type:"bug",q:"This returns nothing. Which line is wrong?",codeOpts:true,
   options:["index=botsv1 sourcetype=stream:http","| stats count by src_ip","| where requests > 2"],a:2,
   chk:{spl:"index=botsv1 sourcetype=stream:http | stats count by src_ip | where requests > 2",rows:0},
   why:"stats made a field called count, not requests. where looks for requests, finds no such field, and keeps nothing."},
  {id:"N4q7",lv:2,type:"read",q:"You run this on the sample. What do you get back?",code:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| search count>2",
   options:["2 rows: 23.22.63.114 and 40.80.148.42","3 rows","Nothing: search must come first","1 row"],a:0,chk:{spl:"index=botsv1 sourcetype=stream:http | stats count by src_ip | search count>2",rows:2},
   why:"search can filter later in the pipe too. Here it does the same job as `where count > 2`."},
  {id:"N4q8",lv:3,type:"concept",q:"Which command can compare one field with another, like `bytes > avg_bytes`?",codeOpts:true,
   options:["where","search","fields","table"],a:0,
   why:"where evaluates expressions, so both sides can be fields or calculations. search treats the right-hand side as a plain value to match."},
  {id:"N4q9",lv:3,type:"read",q:"Read the logs. They go into `| stats dc(src_ip) AS sources count AS hits by uri`. What comes out?",logs:[9,6,5],hl:["40.80.148.42","23.22.63.114","administrator"],
