  {id:"E2q5",lv:3,type:"concept",q:"\"New Privileged Account Created\" is only high severity, yet its urgency is critical. How?",
   options:["It landed on a critical-priority asset, and high severity × critical priority = critical urgency","Severity and urgency are the same field","ES rounds all privileged-account notables up to critical","Its owner set it to critical"],a:0,
   why:"The lesson walked it: high severity on a critical-priority asset (the domain controller) meets at critical in the matrix. Priority lifted it, not severity."}
 ],
 pro:"When you sort Incident Review by urgency you are sorting by severity×priority — so a quiet-looking rule on a crown-jewel asset can outrank a scary-looking rule on a sandbox. Trust the urgency, but know what built it."},

/* ---------------------------------------------------------------- E3 */
{id:"E3",stage:6,data:"desk",t:"Triaging a notable",goal:"Move a notable through the workflow and pivot to the raw events behind it",
 steps:[
  {spl:"`notable` status=\"In Progress\"\n| table rule_name owner user",what:"Before you grab a notable, see what's already being worked.",
   why:"A notable has a <b>status</b> that moves through the workflow: <b>New → In Progress → Pending → Resolved → Closed</b>. The <b>owner</b> is the analyst who took it. Both status and owner live in the Incident Review store, so we filter with the <code>`notable`</code> macro, not plain <code>index=notable</code>. Only one notable is already In Progress — dsong owns the \"Successful Login After Brute Force\" on svc_backup. You wouldn't double-work that one.",
   pro:"Taking ownership (setting owner to yourself and status to In Progress) is the single most useful triage habit in a shared queue: it stops two analysts burning time on the same alert."},
  {spl:"`notable` status=New\n| stats count",what:"How much untouched work is in the queue.",
   why:"<code>status=New</code> is everything nobody has picked up. Seven of the eight notables are still New; the eighth is the one dsong is working. In Incident Review you'd select a New notable, set yourself as owner and move it to In Progress — the same transition, done from the UI.",
   screen:{title:"Incident Review — edit",kind:"form",rows:[["Status","New → In Progress"],["Owner","(unassigned) → you"],["Disposition","— (set at close)"],["Comment","\"Investigating brute force on srv-web01\""]],hl:["Status","Owner"],note:"Changing Status and Owner is how a notable moves. Disposition is left blank until you close it."}},
  {spl:"index=win EventCode=4625 dest=srv-web01 src=45.77.53.176\n| stats count by src",what:"Every notable carries a drilldown search. This is the one behind the brute-force notable.",
   why:"A correlation search stores a <b>drilldown_search</b> with each notable — the query that pivots you from the one-line alert to the raw events that triggered it. Clicking it in Incident Review runs exactly this: 30 failed RDP logons from 45.77.53.176 against srv-web01. That's how you confirm a notable in seconds instead of hand-writing the search.",
   pro:"When a notable fires and the drilldown returns nothing, that's a signal in itself — the rule and its drilldown have drifted apart, or the data model changed. A drilldown that no longer matches its rule is a tuning job."}
 ],
 yourturn:{goal:"Find the one notable another analyst is already working, and show its rule_name and owner. Use the notable macro so status and owner come through.",
   pieces:["`notable` status=\"In Progress\"","| table rule_name owner"],
   extra:[{t:"`notable` status=New",why:"New is the untouched pile — seven notables. The one being worked has status In Progress, not New."}]},
 quiz:[
  {id:"E3q1",lv:1,type:"concept",q:"What does a notable's status field track?",
   options:["Where it is in the triage workflow: New, In Progress, Pending, Resolved, Closed","How bad the event is","Which index it came from","The analyst's name"],a:0,
   why:"Status is the workflow position. Severity is how bad; owner is who's on it. Status moves New → In Progress → Pending → Resolved → Closed."},
  {id:"E3q2",lv:1,type:"concept",q:"What is a notable's drilldown search?",
   options:["A stored query that pivots from the notable to the raw events that triggered it","The correlation search's schedule","A list of owners","The urgency formula"],a:0,
   why:"Each notable carries a drilldown_search. Running it takes you from the one-line alert to the underlying events — the fast way to confirm what fired."},
  {id:"E3q3",lv:2,type:"read",q:"You want to avoid double-working. How many notables is someone already on? Read the search.",code:"`notable` status=\"In Progress\"\n| stats count",
   options:["1","7","8","0"],a:0,chk:{spl:"`notable` status=\"In Progress\" | stats count",rows:1,cell:[0,0,"1"]},
   why:"Only one notable is In Progress (dsong's). The other seven are still New — untouched work you can pick up."},
  {id:"E3q4",lv:2,type:"read",q:"The brute-force notable's drilldown runs below. How many failed logons does it confirm?",code:"index=win EventCode=4625 dest=srv-web01 src=45.77.53.176\n| stats count by src",
   options:["30","20","2","0"],a:0,chk:{spl:"index=win EventCode=4625 dest=srv-web01 src=45.77.53.176 | stats count by src",rows:1,cell:[0,1,"30"]},
   why:"The drilldown returns the raw events behind the notable: 45.77.53.176 made 30 failed RDP logons against srv-web01. One click confirms the alert."},
  {id:"E3q5",lv:3,type:"concept",q:"You open a notable and its drilldown search returns zero events. What does that most likely mean?",
   options:["The rule and its drilldown have drifted apart and the rule needs tuning","The notable is automatically a true positive","The index was deleted","Every drilldown returns zero by design"],a:0,
   why:"The veteran note said it: a drilldown that no longer matches its rule is a tuning job — the correlation logic and the drilldown query have drifted, or the underlying data changed."}
 ],
 pro:"Triage is a loop: take ownership, run the drilldown to see the evidence, decide, then set a status and (at close) a disposition. The queue stays honest only if analysts actually move notables through those states."},

/* ---------------------------------------------------------------- E4 */
{id:"E4",stage:6,data:"desk",t:"Risk-Based Alerting",goal:"Add risk to objects over the day, then alert when the total crosses a threshold",
 steps:[
  {spl:"index=risk\n| table _time risk_object risk_score search_name",what:"A different model: instead of one alert per event, small scores accrue to an object.",
   why:"<b>Risk-Based Alerting (RBA)</b> is an ES approach. Rather than firing a notable on every suspicious event, many smaller rules each write a <b>risk event</b> into <code>index=risk</code>, attaching a <b>risk_score</b> to a <b>risk_object</b> — a user, a host, an IP. One odd event on its own rarely means much; the point is what adds up.",
   pro:"RBA was built to kill alert fatigue. A single \"user logged in from a new country\" notable is mostly noise; the same event as +50 risk, alongside +40 for impossible travel, is signal. You alert on the pattern, not each spark."},
  {spl:"index=risk\n| stats sum(risk_score) AS total by risk_object\n| sort -total",what:"Sum each object's risk for the day. One name pulls ahead.",
   why:"<code>stats sum(risk_score) AS total by risk_object</code> is the heart of RBA: it adds every risk event a user or host collected. <b>svc_backup</b> leads at 110 — three separate rules fired on it (signed in from a brute-force source, created a privileged account, installed PsExec). No single one is a notable on its own; together they tell the whole attack story.",
   screen:{title:"Risk Analysis",kind:"table",cols:["risk_object","total risk","contributing rules"],rows:[["svc_backup","110","3"],["wrk-klagerfield","90","2"],["wrk-fyodor","90","2"],["abungstein","90","2"],["wrk-btun","90","3"]],hl:[0],note:"svc_backup is the only object whose summed risk reaches 100. The rest sit just under."}},
  {spl:"index=risk\n| stats sum(risk_score) AS total by risk_object\n| where total>=100",what:"The risk incident rule: one notable, only when the total crosses the line.",
   why:"A <b>risk incident rule</b> is itself a correlation search that runs over <code>index=risk</code> and fires when an object's summed risk crosses a threshold — here <code>where total>=100</code>. Only svc_backup clears it, so the SOC gets <b>one</b> notable for the whole compromise instead of a dozen low-value ones. That single notable is the RBA payoff.",
   pro:"Thresholds are a tuning dial just like Station 4's `where count>=20`. Set it too low and RBA becomes as noisy as what it replaced; too high and a real incident sits at 90 forever. You tune it against your own risk scores."}
 ],
 yourturn:{goal:"Run the risk incident rule: sum each object's risk and keep only those at or above 100.",
   pieces:["index=risk","| stats sum(risk_score) AS total by risk_object","| where total>=100"],
   extra:[{t:"| where total>100",why:"The threshold is 100 or above. svc_backup is exactly 110 so it still shows here, but an object sitting at exactly 100 would be missed by >100 — use >=."}]},
 quiz:[
  {id:"E4q1",lv:1,type:"concept",q:"What is the core idea of Risk-Based Alerting?",
   options:["Many small rules add risk_score to a risk_object; you alert when the total crosses a threshold","Every event becomes its own notable immediately","It deletes low-severity events","It replaces indexes with risk scores"],a:0,
   why:"RBA accrues small scores to a user or host across many events, then fires once when the summed risk is high enough — reducing the one-notable-per-event noise."},
  {id:"E4q2",lv:1,type:"concept",q:"In a risk event, what is the risk_object?",
   options:["The entity the risk is attached to — a user, host or IP","The name of the index","The analyst who owns it","The time of the event"],a:0,
   why:"risk_object is the thing accumulating risk (e.g. the user svc_backup or the host wrk-fyodor). risk_score is how much that one event added."},
  {id:"E4q3",lv:2,type:"read",q:"The risk incident rule uses a threshold of 100. Which object fires it? Read the search.",code:"index=risk\n| stats sum(risk_score) AS total by risk_object\n| where total>=100",
   options:["svc_backup","wrk-fyodor","abungstein","all of them"],a:0,chk:{spl:"index=risk | stats sum(risk_score) AS total by risk_object | where total>=100",rows:1},
   why:"svc_backup totals 110 from three rules — the only object at or above 100. The others sit at 90, just under the line, so the rule stays quiet on them."},
  {id:"E4q4",lv:2,type:"fill",q:"Fill the clause that sums each object's risk for the day.",code:"index=risk\n| ___ by risk_object\n| sort -total",codeOpts:true,
   options:["stats sum(risk_score) AS total","stats count AS total","eval total=risk_score","top risk_score"],a:0,
   why:"sum(risk_score) adds every risk event's score per object; AS total names the result. count would tally events, not their scores."},
  {id:"E4q5",lv:3,type:"concept",q:"Why run RBA on summed risk instead of firing a notable on each contributing rule?",
   options:["One odd event is usually noise; the accumulated pattern across rules is the signal","Summing is faster to compute","It avoids using index=notable","Risk scores can't be searched individually"],a:0,
   why:"The veteran note made the case: a lone \"new country\" sign-in is mostly noise, but the same event as +50 risk alongside impossible travel and more becomes signal. RBA alerts on the pattern, not each spark."}
 ],
 pro:"RBA and notables aren't rivals — a risk incident rule's output IS a notable. RBA just changes what earns one: not a single event, but a story that added up past your threshold."},

{id:"E5",stage:6,data:"desk",t:"Correlation searches and response",goal:"See how a notable is created and acted on, and where ES ends and SOAR begins",
 steps:[
  {spl:"`notable` rule_name=\"Successful Login After Brute Force\"\n| table rule_name urgency status drilldown_search",what:"Read one notable end to end — including the search stored inside it.",
   why:"A <b>correlation search</b> is a scheduled search whose <b>adaptive response action</b> is \"create a notable\". When it fires it stamps the notable with its rule_name, a drilldown_search and a starting status; the urgency is then set from severity and priority. We read it with the <code>`notable`</code> macro so the live urgency and status come through alongside the stored <code>drilldown_search</code>.",
   pro:"The same correlation search can carry more than one response action: create a notable AND add risk to the user AND send an email. One rule, several automatic reactions."},
  {spl:"index=risk search_name=\"Privileged Account Created\"\n| table risk_object risk_score risk_message",what:"The other kind of response action: write risk instead of (or as well as) a notable.",
   why:"\"Add to risk\" is an adaptive response action too. Here the rule that caught svc_backup creating a privileged account didn't just raise a notable — it added +40 risk to svc_backup with a human-readable <b>risk_message</b>. That's how a single detection feeds both the queue and the RBA total at once.",
   screen:{title:"Adaptive Response Actions",kind:"form",rows:[["Notable","create a notable in Incident Review"],["Risk Analysis","add risk_score to a risk_object"],["Notification","send email / Slack / webhook"],["Run a script","hand off to SOAR or a custom action"]],hl:["Notable","Risk Analysis"],note:"Adaptive response actions are the things ES can do automatically when a correlation search fires. They run one step each."}},
  {spl:"`notable` urgency=critical\n| table rule_name owner status",what:"Where ES hands off. The honest line on response.",
   noflow:true,
   why:"<b>Adaptive response</b> (what you just saw) is ES doing <i>one</i> thing automatically per action — raise a notable, add risk, send an email, kick off a single script. <b>SOAR</b> (Station 7) is a separate product that runs <i>multi-step playbooks</i> across many tools: enrich the IP, disable the account, open a ticket, wait for approval, then close the loop. A critical notable like these is exactly what you'd route from ES into a SOAR playbook.",
   pro:"The clean mental split: ES decides <i>what deserves attention and why</i> (correlation, urgency, risk); SOAR decides <i>what to do about it, step by step</i>. Adaptive response is the one-step bridge between them."}
 ],
 yourturn:{goal:"Open the critical \"Successful Login After Brute Force\" notable and show its urgency, status and the drilldown search stored in it.",
   pieces:["`notable` rule_name=\"Successful Login After Brute Force\"","| table rule_name urgency status drilldown_search"],
   extra:[{t:"| table rule_name urgency status owner",why:"Close, but the task asks for the drilldown_search the correlation search stored — that's the field that lets you pivot to the raw events, not owner."}]},

  {id:"E5q2",lv:1,type:"concept",q:"Which of these is an adaptive response action ES can run when a correlation search fires?",

  {id:"E5q3",lv:2,type:"read",q:"Read the critical notable. What drilldown search did its correlation search store?",code:"`notable` rule_name=\"Successful Login After Brute Force\"\n| table rule_name urgency drilldown_search",
   options:["index=win EventCode=4624 src=45.77.53.176 | table _time user host","index=notable | stats count","index=risk | stats sum(risk_score)","nothing — notables have no drilldown"],a:0,chk:{spl:"`notable` rule_name=\"Successful Login After Brute Force\" | table rule_name urgency drilldown_search",rows:1},

  {id:"E5q4",lv:2,type:"concept",q:"In one line: how do ES adaptive response and SOAR differ?",

  {id:"E5q5",lv:3,type:"concept",q:"The same correlation search both raised a notable AND added +40 risk to svc_backup. How is that possible?",

/* ============================================================
   STATION 5 — ADMIN (stage 5)
   Reading the configuration behind the data: where events are stored and for how long (indexes.conf),
   how they arrive (inputs.conf / outputs.conf, and the universal-vs-heavy forwarder split), how they're
   parsed and fielded (props.conf / transforms.conf, index-time vs search-time), and who may see what
   (authorize.conf roles and capabilities, plus knowledge-object permissions).

   The game's engine can't run `| rest` or search _internal, so each step is anchored on a real search an
   admin would run over the day's data to SEE the thing the config controls (which indexes hold data, which
   hosts forward, which sourcetypes exist), and the configuration itself is shown in `screen` cards of
   kind:"code" — the exact .conf stanzas and settings, with correct default values.

   Gate honoured:
   - Every stanza and setting is named exactly as in the real spec files (indexes.conf, inputs.conf,
     outputs.conf, props.conf, transforms.conf, authorize.conf), and the default values are the product's.
   - Each lesson marks which settings apply at INDEX TIME (parsing) and which at SEARCH TIME.
   - The universal forwarder does NOT parse; a heavy forwarder and an indexer DO. Index-time settings take
     effect on the first heavy forwarder or indexer the data reaches, never on a universal forwarder.
   - Teach-first in every step `why`; one write-it per lesson (WRITEITS); situational lead-ins; no repeats;
     Level-3 questions use only what the why/veteran notes said. Never reuse ids.
   ============================================================ */
const ADMIN=[
/* ---------------------------------------------------------------- A1 */
{id:"A1",stage:5,data:"desk",t:"Indexes and retention",goal:"Where events are stored on disk, and the settings that decide how long they stay",
 steps:[
  {spl:"index=* | stats count by index",what:"Every event you've searched lives in an index. Here are the day's.",
   why:"An <b>index</b> is a set of directories on disk, defined in <code>indexes.conf</code>. Each index stanza is just its name in brackets with its paths: <code>homePath</code> (hot and warm buckets), <code>coldPath</code> (older, cold buckets) and <code>thawedPath</code> (restored archives). Naming an index in a search is Splunk opening those directories. Six indexes hold today's data. In practice a .conf file like this lives in an app's local folder (<code>$SPLUNK_HOME/etc/apps/&lt;app&gt;/local</code>), often pushed to many instances by a <b>deployment server</b>; <code>system/local</code> works but is hard to manage at scale.",
   screen:{title:"indexes.conf",kind:"code",path:"$SPLUNK_HOME/etc/system/local/indexes.conf",code:"[win]\nhomePath   = $SPLUNK_DB/win/db\ncoldPath   = $SPLUNK_DB/win/colddb\nthawedPath = $SPLUNK_DB/win/thaweddb",hl:[0],note:"indexes.conf is index-time: it's read by the indexer that stores the data. homePath/coldPath/thawedPath are required for a custom index."},
   pro:"The three paths can sit on different storage: homePath on fast SSD for recent data, coldPath on cheaper disk for older buckets. That tiering is most of why coldPath exists."},
  {spl:"index=* | stats count by index\n| sort -count",what:"The firewall index is the heaviest. Heavy indexes are the ones retention bites first.",
   why:"Two settings cap an index. <code>maxTotalDataSizeMB</code> (default <b>500000</b>, about 500&nbsp;GB) limits its size; <code>frozenTimePeriodInSecs</code> (default <b>188697600</b>, about six years) limits its age. When an index passes either limit, its oldest bucket <b>rolls to frozen</b> — by default deleted, or copied to <code>coldToFrozenDir</code> first if you set one. Both are index-time settings on the indexer.",
   screen:{title:"indexes.conf",kind:"code",path:"$SPLUNK_HOME/etc/system/local/indexes.conf",code:"[fw]\nhomePath   = $SPLUNK_DB/fw/db\ncoldPath   = $SPLUNK_DB/fw/colddb\nthawedPath = $SPLUNK_DB/fw/thaweddb\nmaxTotalDataSizeMB     = 500000\nfrozenTimePeriodInSecs = 188697600\ncoldToFrozenDir        = /archive/fw",hl:[4,5,6],note:"Defaults: maxTotalDataSizeMB 500000, frozenTimePeriodInSecs 188697600. Without coldToFrozenDir, frozen buckets are deleted, not archived."}},
  {spl:"index=win | stats min(_time) AS earliest max(_time) AS latest",what:"An index is time-ordered. That's what makes retention cheap.",
   why:"Events are stored in time-ordered <b>buckets</b> that age through four stages: <b>hot → warm → cold → frozen</b>. New data lands in a writable hot bucket (<code>maxHotBuckets</code>, default <b>auto</b>, which gives 3 hot buckets); when it rolls it becomes a read-only warm bucket in homePath (<code>maxWarmDBCount</code>, default <b>300</b>); older warm buckets move to coldPath; and past the size or age limit they freeze. Because buckets carry their time range, freezing the oldest is just deleting a directory.",
   pro:"A <b>thawed</b> bucket is a frozen one you've restored into thawedPath to search an old incident. It's manual and outside the normal lifecycle, which is why it has its own path."}
 ],
 yourturn:{goal:"Take the index inventory an admin starts from: a count of events per index.",
   pieces:["index=*","| stats count by index"],
   extra:[{t:"| stats count by sourcetype",why:"That groups by sourcetype, not index. Retention and storage are configured per index, so an admin sizing indexes.conf counts by index."}]},
 quiz:[
  {id:"A1q1",lv:1,type:"concept",q:"In Splunk, what is an index?",
   options:["A set of time-ordered directories (buckets) on disk, defined in indexes.conf","A saved search that runs on a schedule","A role that controls who sees data","A field extracted at search time"],a:0,
   why:"An index is storage: directories of time-ordered buckets, configured in indexes.conf with homePath, coldPath and thawedPath. Searching it opens those directories."},
  {id:"A1q2",lv:2,type:"read",q:"A teammate asks the default age limit for an index before data freezes. Which setting, and what's its default?",
   options:["frozenTimePeriodInSecs, default 188697600 (about 6 years)","maxTotalDataSizeMB, default 188697600","frozenTimePeriodInSecs, default 86400","retentionDays, default 2160"],a:0,
   why:"frozenTimePeriodInSecs caps an index by age; its default is 188697600 seconds, roughly six years. maxTotalDataSizeMB (default 500000) caps it by size instead."},
  {id:"A1q3",lv:2,type:"order",q:"Put a bucket's lifecycle stages in the order data moves through them.",
   items:["hot (writable, in homePath)","warm (read-only, in homePath)","cold (in coldPath)","frozen (deleted or archived)"],
   why:"Data lands in a hot bucket, rolls to warm (still homePath), ages to cold (coldPath), then freezes past the size or age limit — deleted, or archived if coldToFrozenDir is set."},
  {id:"A1q4",lv:2,type:"fill",q:"Fill the setting that archives buckets instead of deleting them when they freeze.",code:"[fw]\nfrozenTimePeriodInSecs = 188697600\n___ = /archive/fw",codeOpts:true,
   options:["coldToFrozenDir","thawedPath","coldPath","maxTotalDataSizeMB"],a:0,
   why:"coldToFrozenDir names where frozen buckets are copied before removal. Without it, freezing just deletes. coldPath is where cold (not frozen) buckets live; thawedPath is for manual restores."},
  {id:"A1q5",lv:3,type:"bug",q:"This custom-index stanza won't behave as the admin intends. Which line is wrong?",codeOpts:true,
   options:["[fw]","homePath = $SPLUNK_DB/fw/db","coldPath = $SPLUNK_DB/fw/colddb","maxTotalDataSizeMB = 500","frozenTimePeriodInSecs = 188697600"],a:3,
   why:"maxTotalDataSizeMB is in megabytes, so 500 caps the whole fw index at 500 MB — it would freeze and delete firewall data almost immediately. The default is 500000 (~500 GB); 500 is almost certainly a typo for that."},
  {id:"A1q6",lv:2,type:"stanza",q:"Write the indexes.conf stanza for a new index named fw_logs that freezes (drops) its data after 90 days. 90 days = 7,776,000 seconds.",
   header:"[fw_logs]",pairs:{homePath:"*",coldPath:"*",thawedPath:"*",frozenTimePeriodInSecs:"7776000"},
   model:"[fw_logs]\nhomePath   = $SPLUNK_DB/fw_logs/db\ncoldPath   = $SPLUNK_DB/fw_logs/colddb\nthawedPath = $SPLUNK_DB/fw_logs/thaweddb\nfrozenTimePeriodInSecs = 7776000",
   hint:"Open with [fw_logs], give the three …Path settings, then set frozenTimePeriodInSecs = 7776000 (90 × 24 × 60 × 60).",
   note:"frozenTimePeriodInSecs is the age, in seconds, at which buckets freeze — deleted unless coldToFrozenDir archives them first. 7,776,000 is 90 days. The three paths just say where the index's buckets live on disk."}
 ],
 pro:"indexes.conf is pure index-time: it's read by the indexer that stores the data, so these settings never do anything on a universal forwarder, which stores nothing."},

/* ---------------------------------------------------------------- A2 */
{id:"A2",stage:5,data:"desk",t:"Forwarders: universal vs heavy",goal:"How data reaches the indexer, and the one difference that decides where parsing happens",
 steps:[
  {spl:"index=win | stats count by host\n| sort -count",what:"Nine Windows hosts sent data today. Each runs a forwarder.",
   why:"A <b>forwarder</b> is a Splunk agent on a machine that collects logs and sends them to an indexer. What it collects is set in <code>inputs.conf</code>: a <code>[monitor://...]</code> stanza names a file or directory to watch, and sets the <code>index</code> and <code>sourcetype</code> for that data. The <code>host</code> field you're grouping by is stamped by the forwarder.",
   screen:{title:"inputs.conf  (on the forwarder)",kind:"code",path:"$SPLUNK_HOME/etc/system/local/inputs.conf",code:"[monitor:///var/log/secure]\nindex      = linux\nsourcetype = linux_secure\ndisabled   = false",hl:[0,1,2],note:"inputs.conf defines what to read and tags it with index and sourcetype. A [monitor://path] input follows the file as it grows."}},
  {spl:"index=sysmon | stats count by host",what:"Those forwarders all point at the same indexers. That's outputs.conf.",
   why:"Where a forwarder sends its data is set in <code>outputs.conf</code>. The <code>[tcpout]</code> stanza names a default group; a <code>[tcpout:<group>]</code> stanza lists the indexers in <code>server</code>. The standard Splunk receiving port is <b>9997</b>. List two or more indexers and the forwarder load-balances across them automatically.",
   screen:{title:"outputs.conf  (on the forwarder)",kind:"code",path:"$SPLUNK_HOME/etc/system/local/outputs.conf",code:"[tcpout]\ndefaultGroup = primary_indexers\n\n[tcpout:primary_indexers]\nserver = idx1.example.com:9997, idx2.example.com:9997",hl:[3,4],note:"outputs.conf is on the forwarder. server lists the indexers and their receiving port, 9997 by convention."}},
  {spl:"index=win | stats dc(host) AS forwarders",what:"Now the one distinction the whole station turns on.",
   noflow:true,
   why:"A <b>universal forwarder (UF)</b> is tiny and <b>does not parse</b> — it ships raw data on, unbroken into events and with no index-time fields. A <b>heavy forwarder (HF)</b> is full Splunk and <b>does parse</b>. So <b>does an indexer</b>. Parsing (breaking events, extracting the timestamp, applying index-time props and transforms) happens on the <b>first heavy forwarder or indexer</b> the data reaches — never on a universal forwarder. A plain UF&nbsp;→&nbsp;indexer path parses on the indexer; a UF&nbsp;→&nbsp;HF&nbsp;→&nbsp;indexer path parses on the HF.",
   pro:"The exceptions are narrow: a UF does apply INDEXED_EXTRACTIONS for structured files (CSV, JSON) and can use EVENT_BREAKER to split a stream for load-balancing. For ordinary log lines, the rule holds — the UF just forwards."}
 ],
 yourturn:{goal:"Check which Windows hosts are forwarding, busiest first — the admin's first look at a quiet agent.",
   pieces:["index=win","| stats count by host","| sort -count"],
   extra:[{t:"| stats count by sourcetype",why:"That counts sourcetypes, not hosts. To spot a forwarder that's gone quiet you group by host."}]},
 quiz:[
  {id:"A2q1",lv:1,type:"concept",q:"What is a forwarder in Splunk?",
   options:["An agent on a machine that collects logs and sends them to an indexer","The indexer that stores the data","A search command that routes results","A role that grants access to an index"],a:0,
   why:"A forwarder is the collection agent. inputs.conf says what it reads; outputs.conf says which indexers it sends to."},
  {id:"A2q2",lv:1,type:"concept",q:"The key difference between a universal forwarder and a heavy forwarder is:",
   options:["A universal forwarder doesn't parse; a heavy forwarder does","A universal forwarder is faster to search","A heavy forwarder can't send to an indexer","A universal forwarder stores data locally"],a:0,
   why:"The universal forwarder ships raw, unparsed data. The heavy forwarder (full Splunk) parses — breaks events, pulls the timestamp, applies index-time props/transforms."},
  {id:"A2q3",lv:2,type:"read",q:"Data flows universal forwarder → indexer, with no heavy forwarder between. Where is it parsed?",
   options:["On the indexer — it's the first full Splunk instance in the path","On the universal forwarder","Nowhere; it's stored raw","On the search head when you search it"],a:0,
   why:"A universal forwarder never parses. Parsing happens on the first heavy forwarder or indexer the data reaches — here, the indexer."},
  {id:"A2q4",lv:2,type:"fill",q:"Fill the stanza header that lists a forwarder's destination indexers.",code:"[tcpout]\ndefaultGroup = primary_indexers\n\n[___:primary_indexers]\nserver = idx1:9997, idx2:9997",codeOpts:true,
   options:["tcpout","monitor","indexAndForward","httpout"],a:0,
   why:"A [tcpout:<group>] stanza lists the indexers for that group in server. [monitor://...] belongs in inputs.conf; it reads data, it doesn't send it."},
  {id:"A2q5",lv:3,type:"concept",q:"An admin puts an index-time props/transforms rule on a universal forwarder to drop a noisy sourcetype. Why won't it work on that box?",
   options:["A universal forwarder doesn't parse — index-time transforms run on a heavy forwarder or indexer","The server port should be 8089, not 9997","[monitor://] can't set a sourcetype","outputs.conf must come before inputs.conf"],a:0,
   why:"The veteran point from step 3: a universal forwarder doesn't parse, so index-time props/transforms do nothing there. The drop rule has to live on the first heavy forwarder or indexer that parses the data."},
  {id:"A2q6",lv:2,type:"stanza",q:"Write the outputs.conf stanza named [tcpout:primary_indexers] that sends this forwarder's data to an indexer at 10.0.0.5 on the Splunk receiving port 9997.",
   header:"[tcpout:primary_indexers]",pairs:{server:"10.0.0.5:9997"},
   model:"# in [tcpout]: defaultGroup = primary_indexers\n[tcpout:primary_indexers]\nserver = 10.0.0.5:9997",
   hint:"The header names the output group: [tcpout:primary_indexers]. Then server = host:port, and 9997 is the default receiving port.",
   note:"A forwarder ships events over the network to an indexer's receiving port, 9997 by default. The [tcpout:<group>] stanza lists the destination servers; a [tcpout] defaultGroup line points the forwarder at that group."}
 ],
 pro:"inputs.conf and outputs.conf run on the forwarder; whether index-time parsing runs there too depends entirely on which kind of forwarder it is. That one fact decides where every props.conf and transforms.conf rule in the next two lessons takes effect."},

/* ---------------------------------------------------------------- A3 */
{id:"A3",stage:5,data:"desk",t:"props.conf: index time vs search time",goal:"Read a sourcetype's settings and know which take effect when the data is parsed, and which when you search",
 steps:[
  {spl:"index=win | stats count by sourcetype",what:"Two sourcetypes in the Windows index. props.conf is keyed by sourcetype.",
   why:"<code>props.conf</code> configures a sourcetype (or a <code>[source::...]</code> or <code>[host::...]</code> pattern). Its <b>index-time</b> settings control parsing, and run when the data is first parsed — on a heavy forwarder or indexer, never a universal forwarder. The core ones: <code>SHOULD_LINEMERGE</code> (default <b>true</b>), <code>LINE_BREAKER</code> (default <code>([\\r\\n]+)</code>), <code>TRUNCATE</code> (default <b>10000</b> bytes), and the timestamp trio <code>TIME_PREFIX</code>, <code>TIME_FORMAT</code>, <code>MAX_TIMESTAMP_LOOKAHEAD</code> (default <b>128</b>).",
   screen:{title:"props.conf  (index-time)",kind:"code",path:"$SPLUNK_HOME/etc/system/local/props.conf",code:"[fortigate_traffic]\nSHOULD_LINEMERGE        = false\nLINE_BREAKER            = ([\\r\\n]+)\nTIME_PREFIX             = date=\nTIME_FORMAT             = %Y-%m-%d %H:%M:%S\nMAX_TIMESTAMP_LOOKAHEAD = 30\nTRUNCATE                = 10000",hl:[1,3,4,5],note:"Index-time. SHOULD_LINEMERGE=false means one line per event. TIME_PREFIX points at where the time starts; TIME_FORMAT reads it; MAX_TIMESTAMP_LOOKAHEAD limits how far to scan."}},
  {spl:"index=win sourcetype=\"WinEventLog:Security\" | stats count by EventCode\n| sort -count",what:"These settings only run once, when the event is written. They can't be changed later without re-indexing.",
   why:"Index-time parsing is permanent: it decides how an event is broken and when it happened, and it's baked into the stored event. Get <code>TIME_FORMAT</code> wrong and every event lands at the wrong time, and the only fix is to re-index. That's why index-time settings are the ones you test hardest before data flows.",
   pro:"SHOULD_LINEMERGE=true then uses LINE_BREAKER only as a hint and merges lines by timestamp — slower and easy to get wrong. For a one-line-per-event source like a firewall, SHOULD_LINEMERGE=false with a clear LINE_BREAKER is both faster and more reliable."},
  {spl:"index=fw | stats count by action",what:"The action field wasn't stored — it was pulled out when you searched. That's search time.",
   why:"<b>Search-time</b> props settings run on the search head each time you search, over the raw text, and can be changed any time with no re-indexing. The field-building family: <code>EXTRACT-&lt;class&gt;</code> (an inline regex), <code>REPORT-&lt;class&gt;</code> (points at a transforms.conf stanza), <code>FIELDALIAS-&lt;class&gt;</code>, <code>EVAL-&lt;field&gt;</code>, <code>LOOKUP-&lt;class&gt;</code>, and <code>KV_MODE</code> (default <b>auto</b>). The <code>action</code> field here comes from a search-time extraction.",
   screen:{title:"props.conf  (search-time)",kind:"code",path:"$SPLUNK_HOME/etc/system/local/props.conf",code:"[fortigate_traffic]\nEXTRACT-action = action=(?<action>\\w+)\nREPORT-kv      = fortigate_kv\nFIELDALIAS-ips = srcip AS src dstip AS dest\nKV_MODE        = none",hl:[1,2,3],note:"Search-time. EXTRACT- is an inline regex; REPORT- calls a transforms.conf stanza; FIELDALIAS- renames a field at search; all editable without re-indexing."}}
 ],
 yourturn:{goal:"List the sourcetypes across every index — the set of props.conf stanzas an admin has to maintain.",
   pieces:["index=*","| stats count by sourcetype"],
   extra:[{t:"| stats count by index",why:"props.conf is keyed by sourcetype, not index. To see which sourcetypes need parsing rules, group by sourcetype."}]},
 quiz:[
  {id:"A3q1",lv:1,type:"concept",q:"props.conf settings split into two kinds. Which is which?",
   options:["Index-time settings parse the data as it's written; search-time settings build fields when you search","Index-time runs on the search head; search-time runs on the forwarder","They're the same; the name is just a label","Index-time is for dashboards; search-time is for alerts"],a:0,
   why:"Index-time settings (line breaking, timestamps) run once when data is parsed and are permanent. Search-time settings (field extraction) run at search and can change any time."},
  {id:"A3q2",lv:2,type:"concept",q:"Which of these is a SEARCH-time props.conf setting?",
   options:["EXTRACT-action","LINE_BREAKER","TIME_FORMAT","SHOULD_LINEMERGE"],a:0,
   why:"EXTRACT- builds a field at search time from a regex. LINE_BREAKER, TIME_FORMAT and SHOULD_LINEMERGE are all index-time parsing settings."},
  {id:"A3q3",lv:2,type:"read",q:"A colleague asks the default of MAX_TIMESTAMP_LOOKAHEAD. What is it, and what does it do?",
   options:["128 — how many characters into the event Splunk scans for the timestamp","10000 — the longest line it will keep","0 — timestamp lookahead is off by default","188697600 — how long the timestamp is cached"],a:0,
   why:"MAX_TIMESTAMP_LOOKAHEAD defaults to 128 characters. It bounds how far past TIME_PREFIX Splunk looks for the time, so a time-like string deep in the event isn't picked up by mistake."},
  {id:"A3q4",lv:2,type:"fill",q:"Fill the index-time setting that tells Splunk where the timestamp begins in each event.",code:"[fortigate_traffic]\n___ = date=\nTIME_FORMAT  = %Y-%m-%d %H:%M:%S",codeOpts:true,
   options:["TIME_PREFIX","TIME_FORMAT","TIMESTAMP","MAX_TIMESTAMP_LOOKAHEAD"],a:0,
   why:"TIME_PREFIX is a pattern that marks where the timestamp starts (here, just after date=). TIME_FORMAT then reads the timestamp itself with strptime codes."},
  {id:"A3q5",lv:3,type:"bug",q:"The timestamp is `date=2017-08-24 13:10:00`, but events are landing at the wrong time. Which line is the mistake?",codeOpts:true,
   options:["[fortigate_traffic]","TIME_PREFIX = date=","TIME_FORMAT = %Y-%m-%d %H:%M:%S","MAX_TIMESTAMP_LOOKAHEAD = 10"],a:3,
   why:"MAX_TIMESTAMP_LOOKAHEAD caps how many characters after TIME_PREFIX Splunk scans for the time. The timestamp here is 19 characters, so a lookahead of 10 stops partway through and the time can't be read correctly. The default is 128; 10 is far too small for this format."},
  {id:"A3q6",lv:2,type:"stanza",q:"Write a props.conf stanza for sourcetype cisco:asa that keeps every line as its own event (don't merge lines) and scans only the first 25 characters of each event for the timestamp.",
   header:"[cisco:asa]",pairs:{SHOULD_LINEMERGE:"false",MAX_TIMESTAMP_LOOKAHEAD:"25"},
   model:"[cisco:asa]\nSHOULD_LINEMERGE = false\nMAX_TIMESTAMP_LOOKAHEAD = 25",
   hint:"The header is the sourcetype name: [cisco:asa]. SHOULD_LINEMERGE = false stops line-merging; MAX_TIMESTAMP_LOOKAHEAD = 25 limits the timestamp scan.",
   note:"Both are index-time line/timestamp settings. SHOULD_LINEMERGE = false makes each line a separate event (right for one-line-per-event logs); MAX_TIMESTAMP_LOOKAHEAD = 25 tells Splunk to look no further than 25 characters in for the time. Change either and you must re-index."}
 ],
 pro:"The quickest triage: if a setting changes how an event is stored (breaking, timestamp), it's index-time and fixing it needs a re-index; if it changes how a field appears at search, it's search-time and you can edit it live."},

/* ---------------------------------------------------------------- A4 */
{id:"A4",stage:5,data:"desk",t:"transforms.conf",goal:"Read the rules props.conf calls, and tell an index-time transform from a search-time one",
 steps:[
  {spl:"index=fw | stats count by action",what:"props.conf often doesn't hold the rule itself — it points at a stanza in transforms.conf.",
   why:"<code>transforms.conf</code> holds reusable rules that <code>props.conf</code> calls by name. A rule's core settings: <code>REGEX</code> (what to match), <code>FORMAT</code> (what to write), <code>SOURCE_KEY</code> (what to read from, default <b><code>_raw</code></b>) and <code>DEST_KEY</code> (where to write). props decides <i>when</i> it runs: <code>REPORT-&lt;class&gt;</code> calls it at <b>search time</b>; <code>TRANSFORMS-&lt;class&gt;</code> calls it at <b>index time</b>.",
   screen:{title:"props.conf → transforms.conf  (search-time)",kind:"code",path:"props.conf / transforms.conf",code:"# props.conf\n[fortigate_traffic]\nREPORT-kv = fortigate_kv\n\n# transforms.conf\n[fortigate_kv]\nREGEX  = (\\w+)=([^\\s]+)\nFORMAT = $1::$2",hl:[2,5,6,7],note:"REPORT- in props makes this a search-time transform. REGEX finds key=value pairs; FORMAT turns each into a field. Editable without re-indexing."}},
  {spl:"index=fw action=accept | stats count by app",what:"The other direction: a transform that runs at index time, as data is written.",
   why:"An index-time transform is called by <code>TRANSFORMS-&lt;class&gt;</code> and can change the stored event — route it, rewrite its metadata, or drop it. <code>DEST_KEY</code> chooses the target: <code>_raw</code> to edit the text, <code>MetaData:Sourcetype</code> to override the sourcetype, <code>_MetaData:Index</code> to send it to a different index, or <code>queue</code> with <code>FORMAT = nullQueue</code> to <b>discard</b> it. These run on the heavy forwarder or indexer that parses — never a universal forwarder.",
   screen:{title:"props.conf → transforms.conf  (index-time)",kind:"code",path:"props.conf / transforms.conf",code:"# props.conf\n[fortigate_traffic]\nTRANSFORMS-drop = drop_pings\n\n# transforms.conf\n[drop_pings]\nREGEX    = action=ping\nDEST_KEY = queue\nFORMAT   = nullQueue",hl:[2,5,6,7,8],note:"TRANSFORMS- in props makes this index-time. DEST_KEY=queue with FORMAT=nullQueue throws the matching events away before they're stored."}},
  {spl:"index=fw | stats sum(sentbyte) AS bytes by app\n| sort -bytes",what:"Dropping the noise at index time is what keeps an index like this one from filling.",
   why:"Index-time routing is a real admin lever: send chatty but low-value events to <code>nullQueue</code> and they never cost storage or licence. But like all index-time rules it's permanent — a dropped event is gone, not hidden — so you match it carefully. A search-time <code>REPORT-</code> rule, by contrast, only changes how fields appear and can be undone by editing the conf.",
   pro:"<code>SEDCMD-&lt;class&gt;</code> in props.conf is a shortcut for simple index-time edits (masking a card number, say) without a separate transforms stanza. It's index-time too, so the same permanence applies."}
 ],
 yourturn:{goal:"Weigh what an index-time drop rule would save: total firewall bytes per application, biggest first.",
   pieces:["index=fw","| stats sum(sentbyte) AS bytes by app","| sort -bytes"],
   extra:[{t:"| stats count by app",why:"Event count isn't the cost that matters for storage — bytes are. Sum sentbyte to see which app is actually filling the index."}]},
 quiz:[
  {id:"A4q1",lv:1,type:"concept",q:"How do props.conf and transforms.conf work together?",
   options:["transforms.conf holds the rule (REGEX/FORMAT); props.conf calls it by name and sets when it runs","transforms.conf calls props.conf at search time","They're alternatives; you use one or the other","props.conf holds the regex; transforms.conf schedules it"],a:0,
   why:"transforms.conf is the reusable rule. props.conf references it — REPORT- for search time, TRANSFORMS- for index time — which is what decides when it runs."},
  {id:"A4q2",lv:2,type:"concept",q:"In props.conf, which reference makes a transform run at INDEX time?",
   options:["TRANSFORMS-<class>","REPORT-<class>","EXTRACT-<class>","LOOKUP-<class>"],a:0,
   why:"TRANSFORMS- runs a transform at index time (it can route or drop events). REPORT- runs one at search time; EXTRACT- and LOOKUP- are search-time too."},
  {id:"A4q3",lv:2,type:"read",q:"A teammate asks what SOURCE_KEY a transform reads from if you don't set it. What's the default?",
   options:["_raw — the raw event text","_time","MetaData:Sourcetype","the first field alphabetically"],a:0,
   why:"SOURCE_KEY defaults to _raw, so a transform matches its REGEX against the raw event text unless you point it at another key."},
  {id:"A4q4",lv:2,type:"fill",q:"Fill the DEST_KEY value that, with FORMAT = nullQueue, discards matching events at index time.",code:"[drop_pings]\nREGEX    = action=ping\nDEST_KEY = ___\nFORMAT   = nullQueue",codeOpts:true,
   options:["queue","_raw","nullQueue","MetaData:Sourcetype"],a:0,
   why:"DEST_KEY = queue with FORMAT = nullQueue sends matching events to the null queue — dropped before indexing. nullQueue is the FORMAT value, not the DEST_KEY."},
  {id:"A4q5",lv:3,type:"bug",q:"This is meant to drop ping traffic before it's indexed, but it won't. Which line breaks it?",codeOpts:true,
   options:["# props.conf","REPORT-drop = drop_pings","# transforms.conf","[drop_pings]","REGEX = action=ping","DEST_KEY = queue","FORMAT = nullQueue"],a:1,
   why:"REPORT- runs the transform at SEARCH time, where it can't drop anything from the index. To discard events before they're stored, props must call it with TRANSFORMS-drop = drop_pings, not REPORT-."},
  {id:"A4q6",lv:3,type:"stanza",q:"Write the transforms.conf stanza named drop_debug that routes matching events to the null queue, so they're dropped at index time. Use any REGEX that matches DEBUG lines.",
   header:"[drop_debug]",pairs:{REGEX:"*",DEST_KEY:"queue",FORMAT:"nullQueue"},
   model:"[drop_debug]\nREGEX    = log_level=DEBUG\nDEST_KEY = queue\nFORMAT   = nullQueue",
   hint:"Header [drop_debug], a REGEX that matches the lines, then the drop pair: DEST_KEY = queue and FORMAT = nullQueue.",
   note:"DEST_KEY = queue plus FORMAT = nullQueue sends matching events to the null queue — discarded before indexing, saving licence and disk. It only drops at index time when props calls this with TRANSFORMS-, and only on a box that parses (heavy forwarder or indexer)."}
 ],
 pro:"Read the props reference first: REPORT- means search-time and reversible; TRANSFORMS- (and SEDCMD-) mean index-time and permanent. The transforms.conf stanza looks the same either way — props decides when it bites."},

/* ---------------------------------------------------------------- A5 */
{id:"A5",stage:5,data:"desk",t:"Roles, capabilities and permissions",goal:"Who may search which indexes, what they're allowed to do, and who can see a knowledge object",
 steps:[
  {spl:"index=* | stats dc(index) AS indexes",what:"Six indexes exist. A role decides which of them a given analyst can even search.",
   why:"Users get their access from <b>roles</b>, defined in <code>authorize.conf</code> as <code>[role_&lt;name&gt;]</code>. The access-to-data settings: <code>srchIndexesAllowed</code> (the indexes this role may search, semicolon-separated — <code>*</code> for all), <code>srchIndexesDefault</code> (which of those are searched when no <code>index=</code> is given), and <code>importRoles</code> (inherit another role's grants). A role is applied at <b>search time</b>: it silently filters what a search can return.",
   screen:{title:"authorize.conf",kind:"code",path:"$SPLUNK_HOME/etc/system/local/authorize.conf",code:"[role_soc_analyst]\nimportRoles        = user\nsrchIndexesAllowed = win;sysmon;fw;o365\nsrchIndexesDefault = win;sysmon",hl:[2,3],note:"srchIndexesAllowed lists the indexes this role can search; srchIndexesDefault is the subset searched with no index= clause. importRoles=user inherits the built-in user role."}},
  {spl:"index=win | stats count by sourcetype",what:"A role also carries capabilities and limits — what the person may do, not just see.",
   why:"Besides data, a role grants <b>capabilities</b> — named permissions written <code>&lt;capability&gt; = enabled</code>, such as <code>rtsearch</code> (run real-time searches) or <code>schedule_search</code>. It also sets resource limits: <code>srchJobsQuota</code> (concurrent searches, default <b>3</b>) and <code>srchDiskQuota</code> (search artifact disk in MB, default <b>100</b>). A <code>srchFilter</code> can even pin an extra filter onto every search the role runs.",
   screen:{title:"authorize.conf",kind:"code",path:"$SPLUNK_HOME/etc/system/local/authorize.conf",code:"[role_soc_analyst]\nimportRoles        = user\nsrchIndexesAllowed = win;sysmon;fw;o365\nrtsearch           = enabled\nschedule_search    = enabled\nsrchJobsQuota      = 10\nsrchDiskQuota      = 500",hl:[3,4,5,6],note:"rtsearch and schedule_search are capabilities (enabled/absent). srchJobsQuota (default 3) and srchDiskQuota MB (default 100) are per-role limits, raised here for a busy analyst."}},
  {spl:"index=fw OR index=o365 | stats count by index",what:"Last piece: a saved search or lookup has its own permissions, on top of the role.",
   noflow:true,
   why:"A <b>knowledge object</b> — a saved search, lookup, macro, field extraction, dashboard — has a <b>sharing level</b>: <b>Private</b> (owner only), <b>App</b> (everyone using that app), or <b>Global</b> (all apps). On top of that, each object grants <b>Read</b> and <b>Write</b> per role. You set this in Settings → the object → <b>Permissions</b>; Splunk stores it in a <code>.meta</code> file, and the roles it references come from authorize.conf. So two gates decide whether someone can use an object: their role, and the object's own permissions.",
   pro:"A classic support call: an analyst built a lookup that works for them but 'disappears' for the team. It's almost always still Private — sharing it to App, with Read for the analyst role, is the fix. Permission, not logic."}
 ],
 yourturn:{goal:"Show the indexes a scoped analyst role would be granted here — just the firewall and cloud data.",

/* ============================================================
   STATION 7 — SOAR (stage 7)
   Splunk SOAR: Security Orchestration, Automation and Response. A SEPARATE product from core
   Splunk and from Enterprise Security — it's where a security team turns a decision ("this is
   bad") into action ("do these ten things across these five tools"). Splunk acquired it from a
   company called Phantom in 2018, so you'll still meet the old name: the product was formerly
   Splunk Phantom, and the SPL command that ships a notable to it is still called sendtophantom.

   HONEST ENGINE LINE, stated in the lessons: the search engine in this app CANNOT run SOAR
   playbooks — playbooks live in SOAR, not in Splunk search. So this station teaches playbooks as
   FLOW DIAGRAMS and read-the-playbook / order questions, and keeps every SPL anchor real: the
   searches here build the IOC list (the artifacts) that a playbook would receive from the Alert
   Desk day (data:"desk"). You practise the hand-off and the judgement; you read, not run, the
   automation itself.

   Gate honoured: real SOAR vocabulary (container, artifact, event, app, asset, action, playbook,
   prompt/approval, Phantom heritage); teach before quiz; a write-it per lesson (WRITEITS); the
   ES→SOAR hand-off via adaptive response ("Run Adaptive Response Actions" → "Send to SOAR" /
   "Run Playbook in SOAR"); a judgement lesson on what to automate vs gate behind a human; never
   reuse ids; no repetition of ES/Desk answers.
   ============================================================ */

{id:"SO2",stage:7,data:"desk",t:"Apps, assets and actions",goal:"Know how SOAR reaches your tools, and what an action actually is",
 steps:[
  {spl:"index=risk risk_object_type=\"other\"\n| table risk_object risk_message",what:"Here's an artifact a playbook would act on: an external IP.",
   why:"To <i>do</i> anything, SOAR has to talk to your tools. It does that through <b>apps</b> — an app is an integration with one product (a firewall, a threat-intel service, Active Directory, an EDR). An app exposes <b>actions</b>: the verbs it can perform, like <code>geolocate ip</code>, <code>block ip</code>, <code>disable user</code> or <code>detonate file</code>. This risk event hands you the IP <code>45.77.53.176</code>; a firewall app's <code>block ip</code> action is what could actually stop it.",
   pro:"An action is always a single, named operation. Chaining actions together — geolocate, then decide, then block — is what a playbook does. One action on its own you'd run by hand from the container; a playbook strings many into a response."},
  {spl:"index=risk risk_object_type=\"user\"\n| dedup risk_object\n| table risk_object",what:"Two accounts a 'disable user' action could target.",
   why:"The same app model covers identities. An <b>Active Directory app</b> exposes a <code>disable user</code> action; the two user risk objects here — <code>svc_backup</code> and <code>abungstein</code> — are the names it would take. But an app alone can't connect to anything: it needs an <b>asset</b>. An asset is a <i>configured instance</i> of an app — your specific AD server, with its hostname and credentials filled in. App = the integration; asset = your copy of it, wired up and ready.",
   screen:{title:"App → Asset → Action",kind:"form",rows:[["App","Active Directory (the integration)"],["Asset","corp-ad-01  (your DC, with credentials)"],["Action","disable user"],["Input (artifact)","userName = svc_backup"]],hl:["Asset","Action"],note:"The app knows HOW to disable a user; the asset is WHERE (your AD, authenticated); the action is the verb; the artifact is the input."}},
  {spl:"index=risk risk_object_type=\"other\"\n| table risk_object",what:"The one input a block-ip action would receive.",noflow:true,
   why:"Read it back as a pipeline of responsibility: the <b>IP field in the artifact</b> (<code>45.77.53.176</code>) is the input, the <b>action</b> (<code>block ip</code>) is the verb, the <b>asset</b> (your firewall, configured) is where it runs, and the <b>app</b> (the firewall integration) is how SOAR speaks to it. Swap the firewall brand and only the app and asset change — the playbook and its <code>block ip</code> step stay the same. That portability is the \"orchestration\" in SOAR."}
 ],

{id:"SO3",stage:7,data:"desk",t:"Playbooks and the ES hand-off",goal:"Read a playbook as a flow, and know how a notable gets into SOAR",
 steps:[
  {spl:"`notable` urgency=critical\n| table rule_name src dest user",what:"Two critical notables — exactly what you'd push into a playbook.",
   why:"A <b>playbook</b> is an automated workflow that runs on a container, built as a <b>flow of blocks</b>: action blocks (run an action), decision/filter blocks (branch on a value), format blocks (shape data) and <b>prompt</b> blocks (stop and ask a human). You build it visually in SOAR's editor, or write it in <b>Python</b> — both produce the same runnable playbook. These two critical notables each carry the artifacts a playbook needs, so they're the obvious ones to automate first.",
   pro:"This app's search engine can't execute a playbook — playbooks live in SOAR, not in Splunk search. So you read the flow and reason about it; the SPL above is only building the artifact list the playbook would receive."},
  {spl:"`notable` urgency=critical\n| table rule_name src dest user",what:"How the notable actually crosses from ES into SOAR.",noflow:true,
   why:"From <b>Incident Review</b> in ES, an analyst opens a notable's <b>Run Adaptive Response Actions</b> and adds one of two SOAR actions: <b>Send to SOAR</b> (ships the notable as an <b>artifact</b> into a container) or <b>Run Playbook in SOAR</b> (ships it <i>and</i> launches a playbook). Adaptive response can also fire it automatically the moment a correlation search matches. Either way, the bridge is the same one you met in Station 6: adaptive response is ES's one-step hand-off, and SOAR picks up from there with the multi-step playbook.",
   screen:{title:"Enrich-and-contain playbook (read the flow)",kind:"code",code:["1. on container     ← notable arrives as artifacts","2. geolocate ip     (enrich sourceAddress)","3. ip reputation    (enrich: is 45.77.53.176 known-bad?)","4. decision         (malicious?  yes ↓   no → close)","5. PROMPT analyst   (approve block + account disable?)","6. block ip         (firewall asset)","7. disable user     (AD asset: svc_backup)","8. add note / set severity / (promote to case)"],hl:[3,4,5],note:"Enrichment (2,3) runs on its own; the decision branches; the PROMPT (5) gates the two changes that actually touch production (6,7)."}},
  {spl:"`notable` urgency=critical\n| table rule_name urgency",what:"The hand-off list, the way you'd hand it to SOAR.",
   why:"Two notables, both critical, both worth a playbook. In ES you'd select each one, choose <b>Run Playbook in SOAR</b>, and let the enrich-and-contain flow above take over. The urgency you learned to trust in Station 6 is exactly what decides which notables earn an automated response at all — you don't point a blocking playbook at a medium-urgency maybe."}

/* ---------------------------------------------------------------- SO4 */
{id:"SO4",stage:7,data:"desk",t:"What to automate, what to gate",goal:"Decide which steps run unattended and which wait for a human",
 steps:[
  {spl:"index=risk risk_object_type=\"other\"\n| table risk_object",what:"Enrichment: safe to run with nobody watching.",
   why:"The core judgement in SOAR is: <b>which steps run unattended, and which wait for a person?</b> The rule of thumb is <b>enrichment is automatic; changes are gated</b>. <b>Enrichment</b> — geolocate this IP, look up its reputation, list a user's group memberships, detonate a file in a sandbox — only <i>reads</i>. It changes nothing, so even if the alert is a false positive you've lost nothing. Run geolocate/reputation on <code>45.77.53.176</code> fully automatically.",
   pro:"Read-only automation is where SOAR pays for itself with zero risk: every analyst was going to copy that IP into a reputation site anyway. Automating the busywork frees them for the judgement calls."},
  {spl:"index=risk risk_object_type=\"user\"\n| stats sum(risk_score) AS total by risk_object\n| sort -total",what:"A destructive action's target — this one waits for a human.",
   why:"<b>Disabling an account</b> or <b>blocking an IP</b> is different: it touches production. If <code>svc_backup</code> here is a real service account and you auto-disable it on a false positive, you've caused the outage yourself. So those steps go behind a <b>prompt</b> block — the playbook pauses and asks an analyst to <b>approve</b> before it acts. That's <b>human-in-the-loop</b>: automate the gathering, but keep a person on the trigger for anything that can break things.",
   screen:{title:"Automate vs gate",kind:"table",cols:["Action","Touches?","Run it…"],rows:[["geolocate ip","read only","automatically"],["ip / file reputation","read only","automatically"],["list AD group members","read only","automatically"],["detonate file (sandbox)","read only","automatically"],["disable user","changes AD","behind a prompt"],["block ip","changes firewall","behind a prompt"],["isolate / quarantine host","changes endpoint","behind a prompt"]],hl:[4,5,6],note:"The line is read vs change. Everything that only reads can run alone; everything that changes production waits for an approval."}},
  {spl:"index=risk risk_object_type=\"user\"\n| stats sum(risk_score) AS total by risk_object\n| where total>=100",what:"Even a well-justified disable still waits for the prompt.",noflow:true,
   why:"<code>svc_backup</code> clears 100 risk — the evidence for disabling it is strong, and you'd likely approve the moment the prompt appears. But strong evidence is a reason to make approval <i>fast</i>, not to remove it: the prompt is what stops a mistuned rule from locking out a service account at 3am with no one watching. Automate the enrichment that built this score; gate the disable that acts on it."}
 ],
 yourturn:{goal:"Show the account whose summed risk has crossed 100 — the one a disable is justified on, still behind a prompt.",
   pieces:["index=risk risk_object_type=\"user\"","| stats sum(risk_score) AS total by risk_object","| where total>=100"],
   extra:[{t:"| where total>100",why:"The bar is 100 or above. svc_backup is 110 so it shows either way, but an account sitting exactly at 100 would be dropped by >100 — use >= so the boundary case counts."}]},
 quiz:[
  {id:"SO4q1",lv:1,type:"concept",q:"Which kind of SOAR action is safest to run fully automatically?",
   options:["Enrichment that only reads, like geolocate ip or a reputation lookup","Disabling a user account","Blocking an IP at the firewall","Isolating a host"],a:0,
   why:"Enrichment only reads — it changes nothing, so a false positive costs nothing. The other three change production and should be gated."},
  {id:"SO4q2",lv:1,type:"concept",q:"What does a prompt block do in a playbook?",
   options:["Pauses the playbook and asks a human to approve before it continues","Deletes the container","Runs an SPL search","Lowers the notable's urgency"],a:0,
   why:"A prompt block is human-in-the-loop: the automation stops and waits for an analyst's approval (or input) before the next, usually destructive, step runs."},
  {id:"SO4q3",lv:2,type:"read",q:"The playbook will prompt before disabling any account over 100 risk. Which account does that catch? Read the search.",code:"index=risk risk_object_type=\"user\"\n| stats sum(risk_score) AS total by risk_object\n| where total>=100",
   options:["svc_backup","abungstein","both","neither"],a:0,chk:{spl:"index=risk risk_object_type=\"user\" | stats sum(risk_score) AS total by risk_object | where total>=100",rows:1},
   why:"Only svc_backup clears 100 (it totals 110). abungstein sits at 90, below the bar, so the disable-user prompt would only raise svc_backup."},
  {id:"SO4q4",lv:2,type:"concept",q:"Why gate 'disable user' behind a prompt but not 'geolocate ip'?",
   options:["Disable changes production and a false positive causes an outage; geolocate only reads","Geolocate is slower","Disable needs no credentials","They are the same risk"],a:0,
   why:"Geolocate reads and changes nothing, so automate it. Disabling a real account on a false positive is an outage you caused — so a human approves it first."},
  {id:"SO4q5",lv:3,type:"concept",q:"The evidence for disabling svc_backup is strong (110 risk). What's the right design?",
   options:["Keep the prompt, but make approval fast — strong evidence speeds approval, it doesn't remove the human","Remove the prompt because the evidence is strong","Disable automatically for any account over 50","Never disable accounts at all"],a:0,
   why:"The lesson's point: strong evidence is a reason to approve quickly, not to drop the gate. The prompt is what stops a mistuned rule from locking out a service account unattended."}
 ],
 pro:"Carry one line out of this station: automate what only reads, gate what changes. Enrichment runs while you sleep; containment waits for your yes. That single rule keeps SOAR fast without letting it break the business."}

/* ============================================================
   WRITE-IT TASKS
   One "write the search" task per lesson. The learner gets a short mini-ticket and an empty box, writes the
   search, and it's graded on what it returns (the same lenient match as the Alert Desk), not on how it's spelled.
   Every task is lv:2 so it appears on Recruit, Analyst and Veteran alike. Each task only uses commands that the
   lesson (or an earlier one) has already taught, so "teach before quiz" holds.
     q   : the mini-ticket / mission, spoken.
     spl : how an experienced analyst writes it (shown on reveal, graded as the target).
     hint: the first nudge in words; after that Hint fills in one pipe at a time.
     note: what the result shows, spoken when the task is solved.
     need: optional list of columns that must match; any extra columns the learner adds are allowed.
   ============================================================ */
