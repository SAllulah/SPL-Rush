/* ============================================================
   ALERT DESK — the main way to practise from Station 2 on.
   A realistic alert lands. You decide what to find out, write the search yourself in an empty box, run it on the
   sample day (data:"desk"), then see how an experienced analyst would write it and why. Each answer leads to the
   next question, the way a real investigation moves.
   Each case: {id,title,tag,sit (the ticket), why (why it matters), terms:[{t,d}], tasks:[...]}.
   Each task: {ask (spoken, one line), hint (a nudge), spl (the analyst's search), note (why, spoken), lead (the
   follow-up line into the next task), free:true means "explore, any search that returns these rows is right"}.
   Grading: your search runs on the desk data; it's right when its result matches the analyst's search's result.
   ============================================================ */
const DESK_CASES=[
  {id:"bruteforce",title:"RDP brute force",tag:"Credential access",stage:2,after:"N4",opens:"Station 1",
   sit:"Ticket: the server srv-web01 logged a burst of failed Windows logons this afternoon. Find out if someone is guessing passwords, and whether any guess worked.",
   why:"A flood of failed logons from one source is classic password guessing. The danger is the one that finally succeeds.",
   terms:[{t:"Event ID 4625",d:"the Windows Security log line for a failed logon. 4624 is a successful one."},
     {t:"Logon Type 10",d:"a remote interactive logon, which is Remote Desktop (RDP). Type 3 is a network logon, type 2 is signing in at the keyboard."},
     {t:"brute force",d:"trying many passwords against an account until one works."}],
   tasks:[
     {ask:"Start wide. Count the failed logons on srv-web01 by the source address they came from, so one noisy source stands out.",
      hint:"Failed logon is EventCode 4625. Count by the src field.",
      spl:'index=win EventCode=4625 dest=srv-web01\n| stats count by src',
      note:"One address, 45.77.53.176, is far above the rest. That's your guesser.",
      lead:"One IP is hammering it. Next, see which accounts it tried, and how hard."},
     {ask:"For that source, count the failures and list the account names it tried.",
      hint:"Filter src to the bad IP, then stats count and values(user).",
      spl:'index=win EventCode=4625 dest=srv-web01 src=45.77.53.176\n| stats count values(user) AS tried_accounts',
      note:"Thirty tries across a handful of names, including service accounts. This is automated guessing, not a user fat-fingering their password.",
      lead:"Now the question that matters: did any of these guesses get in?"},
     {ask:"Check for a successful logon, Event ID 4624, on srv-web01 from that same address.",
      hint:"Same filter, but EventCode 4624 instead of 4625.",
      spl:'index=win EventCode=4624 dest=srv-web01 src=45.77.53.176\n| table _time user Logon_Type',
      note:"There it is: svc_backup logged on successfully at 13:07 over RDP. The brute force worked. That account is now your lead into everything that follows.",
      lead:"svc_backup is compromised. Hold that name. The new-admin and lateral-movement cases pick up its trail."}]},

  {id:"impossible-travel",title:"Impossible travel",tag:"Account compromise",stage:2,after:"I14",opens:"Lookups (Station 2)",
   sit:"Ticket: a cloud sign-in alert fired for the Microsoft 365 tenant. Two users signed in from far-apart countries in a short window. Find out who, from where, and whether it's really impossible.",
   why:"A single account signing in from two distant places minutes apart means one of the two isn't the real user, usually a stolen session or password.",
   terms:[{t:"o365",d:"Microsoft 365 (Office 365) cloud logs. UserLoggedIn is a successful sign-in."},
     {t:"iplocation",d:"a Splunk command that adds City, Region and Country to an event by looking up its IP address."},
     {t:"impossible travel",d:"the same account seen in two places too far apart to travel between in the time elapsed."}],
   tasks:[
     {ask:"Add a country to each successful cloud sign-in, then count how many distinct countries each user signed in from. Flag anyone with more than one.",
      hint:"Filter Operation=UserLoggedIn, pipe to iplocation on ClientIP, then stats dc(Country) by UserId and keep the ones above 1.",
      spl:'index=o365 Operation=UserLoggedIn\n| iplocation ClientIP\n| stats dc(Country) AS countries values(Country) AS seen_in by UserId\n| where countries > 1',need:["UserId","countries"],
      note:"Two accounts light up: abungstein (Sweden and Nigeria) and btun (Sweden and Netherlands).",
      lead:"Two candidates. But distance alone isn't proof. Next, measure the time between the hops."},
     {ask:"For those sign-ins, sort by time and work out the gap, in minutes, between each user's consecutive sign-ins from a different country.",
      hint:"Sort by _time, then streamstats current=f last(_time) and last(Country) by UserId, then eval the gap and keep rows where the country changed.",
      spl:'index=o365 Operation=UserLoggedIn\n| iplocation ClientIP\n| sort 0 _time\n| streamstats current=f last(Country) AS prev_country last(_time) AS prev_time by UserId\n| where Country!=prev_country\n| eval minutes=round((_time-prev_time)/60)\n| table UserId prev_country Country minutes',
      note:"abungstein jumped Sweden to Nigeria in 38 minutes, which is impossible. btun's Sweden to Netherlands took over four hours, which is just a flight. Time is what separates the two.",
      lead:"abungstein is the real alert. One more check before you call it: was the Netherlands hop actually the company VPN?"},
     {ask:"btun's other location was the Netherlands. Check it against the corporate VPN list to rule it out.",
      hint:"Look up ClientIP against corp_vpn.csv and see which sign-ins match a known VPN exit.",
      spl:'index=o365 Operation=UserLoggedIn\n| lookup corp_vpn.csv ip AS ClientIP OUTPUT vpn\n| where isnotnull(vpn)\n| table _time UserId ClientIP vpn',
      note:"btun's Amsterdam login is the Frothly VPN, so it's benign. abungstein's Lagos login matches nothing and happened 38 minutes after Stockholm. That's the one to escalate.",
      lead:"Escalate abungstein. The lookup just saved you from paging someone over a VPN."}]},

  {id:"encoded-powershell",title:"Encoded PowerShell from Office",tag:"Execution",stage:2,after:"N4",opens:"Station 1",
   sit:"Ticket: an endpoint alert flagged a hidden, encoded PowerShell command. Find what launched it and whether it reached out to the internet.",
   why:"Attackers hide PowerShell with -enc so the command is base64, not readable. When Word or Excel is the parent, a macro document just ran code.",
   terms:[{t:"Sysmon Event ID 1",d:"a Sysmon log line recording a new process: its command line, its hash, and the parent process that started it."},
     {t:"-enc / -EncodedCommand",d:"a PowerShell switch that takes a base64-encoded command, used to hide what's really being run."},
     {t:"parent process",d:"the program that started this one. WINWORD.EXE starting PowerShell means a document ran code."},
     {t:"LOLBin",d:"a living-off-the-land binary: a trusted built-in tool like powershell.exe that attackers abuse so they don't have to bring their own."}],
   tasks:[
     {ask:"Find PowerShell processes whose command line carries an encoded command.",
      hint:"Sysmon EventCode 1, Image ending in powershell.exe, and a CommandLine containing -enc or -EncodedCommand.",
      spl:'index=sysmon EventCode=1 Image=*powershell.exe (CommandLine="* -enc *" OR CommandLine="*-EncodedCommand*")\n| table _time dest User ParentImage CommandLine',
      note:"Two hits. One is on srv-file01 with a management agent as its parent, which is routine admin tooling. The other, on wrk-btun, was started by WINWORD.EXE.",
      lead:"The parent tells you everything. Next, focus on the one Word launched."},
     {ask:"Narrow to the suspicious one: the encoded PowerShell whose parent is Word, and read its full command line.",
      hint:"Add ParentImage=*WINWORD.EXE to the filter.",
      spl:'index=sysmon EventCode=1 Image=*powershell.exe ParentImage=*WINWORD.EXE\n| table _time dest User CommandLine',
      note:"btun opened a document and it spawned hidden PowerShell. That's a macro delivering a payload. The encoded blob is the command you'd decode next.",
      lead:"A document ran code on btun's PC. Did that PowerShell call out?"},
     {ask:"Check whether that PowerShell made a network connection. Look for a Sysmon network event from powershell.exe on btun's machine.",
      hint:"Sysmon EventCode 3 (a network connection), dest=wrk-btun, Image ending powershell.exe.",
      spl:'index=sysmon EventCode=3 dest=wrk-btun Image=*powershell.exe\n| table _time DestinationIp DestinationPort',
      note:"It connected straight out to 185.141.27.10 on port 80. That's the download of the next stage. btun's PC is compromised.",
      lead:"That IP and host carry into the scheduled-task and beaconing cases."}]},

  {id:"new-admin",title:"Suspicious new admin",tag:"Privilege escalation",stage:2,after:"N4",opens:"Station 1",
   sit:"Ticket: a new privileged account appeared on the domain controller. Find the new account, who created it, and which groups it landed in.",
   why:"Attackers make their own admin account so they keep access even if the first one is caught. A new account dropped straight into Domain Admins is a red flag.",
   terms:[{t:"Event ID 4720",d:"a user account was created."},
     {t:"Event ID 4728 / 4732",d:"a member was added to a security group: 4728 a global group like Domain Admins, 4732 a local group like Administrators."},
     {t:"Domain Admins",d:"the group with full control of the Windows domain. Membership should change rarely and only on purpose."}],
   tasks:[
     {ask:"List account-management events on the domain controller: accounts created and group memberships added. Group them by the new account and who made the change.",
      hint:"Filter EventCode 4720, 4728 or 4732 (parenthesise the OR). Stats values(EventCode) and values(Group_Name) by user and src_user.",
      spl:'index=win (EventCode=4720 OR EventCode=4728 OR EventCode=4732)\n| stats values(EventCode) AS what values(Group_Name) AS groups by user src_user',
      note:"Two new accounts. jsmith was made by it_admin and added to Remote Desktop Users, a normal new starter. helpdesk_tmp was made by svc_backup and dropped into Domain Admins and Administrators.",
      lead:"svc_backup, the account the brute force stole, just minted an admin. Pin down exactly when."},
     {ask:"Show the timeline for helpdesk_tmp: when it was created and when it was added to each admin group.",
      hint:"Filter to user=helpdesk_tmp, then table the time, event, and group.",
      spl:'index=win user=helpdesk_tmp\n| table _time signature Group_Name src_user',need:["_time","Group_Name"],
      note:"Created at 13:12 and in Domain Admins seconds later, all by svc_backup. That's not how real admin accounts are born. This is the attacker building persistence.",
      lead:"Contain helpdesk_tmp and svc_backup together. Next, see how far svc_backup spread."}]},

  {id:"lateral",title:"Lateral movement",tag:"Lateral movement",stage:2,after:"N4",opens:"Station 1",
   sit:"Ticket: the compromised account svc_backup may be moving between servers. Find out which machines it reached and how it ran code on them.",
   why:"Once in, an attacker hops from host to host. A service account suddenly logging on to many machines, and a remote-exec service appearing on each, is movement in progress.",
   terms:[{t:"Event ID 7045",d:"a service was installed on a Windows host. PsExec installs a service called PSEXESVC to run commands remotely."},
     {t:"Logon Type 3",d:"a network logon: reaching a machine over the network, as with a file share or remote tool, rather than sitting at it."},
     {t:"PsExec",d:"a legitimate admin tool for running commands on remote machines, heavily abused for lateral movement."}],
   tasks:[
     {ask:"Count how many distinct machines svc_backup logged on to over the network, and list them.",
      hint:"EventCode 4624, Logon_Type 3, user=svc_backup. Use dc(dest) and values(dest).",
      spl:'index=win EventCode=4624 Logon_Type=3 user=svc_backup\n| stats dc(dest) AS hosts values(dest) AS machines by src',
      note:"From srv-web01, svc_backup reached five machines, two servers and two workstations plus the DC. One stolen account is now all over the estate.",
      lead:"It got onto those hosts. Next, see how it ran code there."},
     {ask:"Look for the PsExec service being installed across the environment. Count the hosts it appeared on.",
      hint:"EventCode 7045, then look at Service_Name. PsExec's is PSEXESVC.",
      spl:'index=win EventCode=7045 Service_Name=PSEXESVC\n| stats dc(dest) AS hosts values(dest) AS installed_on by Service_File_Name',need:["hosts"],
      note:"PSEXESVC was installed on three of those machines. That confirms remote command execution, not just logons. svc_backup is actively spreading.",
      lead:"You now have the full blast radius: five hosts, three with remote exec. That's your containment list."}]},

  {id:"beaconing",title:"Beaconing to C2",tag:"Command and control",stage:2,after:"I12",opens:"streamstats (Station 2)",
   sit:"Ticket: a host may be checking in with a command-and-control server on a steady timer. Find the regular heartbeat and tell it apart from normal traffic.",
   why:"Malware phones home on a fixed interval to ask for orders. The giveaway is the rhythm: connections to one destination at an almost constant spacing.",
   terms:[{t:"C2 (command and control)",d:"the attacker's server that an implant checks in with for instructions."},
     {t:"beaconing",d:"an implant calling its C2 at a regular interval, like every five minutes."},
     {t:"jitter",d:"small random variation in the interval, added to look less robotic. Low jitter means a very steady beat."},
     {t:"stdev()",d:"standard deviation: how spread out a set of numbers is. Near zero means they're almost all the same, so a near-zero gap stdev is a very regular beat."},
     {t:"streamstats",d:"a Splunk command that calculates across rows in order, so you can get the gap from each event to the one before it."}],
   tasks:[
     {ask:"For outbound connections on port 443, measure the gap between each connection to a destination and the one before it, per source and destination.",
      hint:"Filter dstport 443, sort by _time, then streamstats current=f last(_time) by srcip and dstip, then eval the gap.",
      spl:'index=fw dstport=443\n| sort 0 _time\n| streamstats current=f last(_time) AS prev by srcip dstip\n| eval gap=_time-prev\n| table _time srcip dstip gap',
      note:"You now have the spacing of every connection. Raw gaps are hard to read, so the next step is to summarise the rhythm.",
      lead:"Gaps alone are noisy. Collapse them into an average and a steadiness per channel."},
     {ask:"Summarise each source-to-destination channel: how many connections, the average gap, and how steady it is. Keep only steady, repeated channels.",
      hint:"stats count, avg(gap) and stdev(gap) by srcip and dstip, then keep high count and low stdev.",
      spl:'index=fw dstport=443\n| sort 0 _time\n| streamstats current=f last(_time) AS prev by srcip dstip\n| eval gap=_time-prev\n| stats count avg(gap) AS avg_gap stdev(gap) AS jitter by srcip dstip\n| where count >= 8 AND jitter < 10',
      note:"One channel stands out: wrk-btun to 185.141.27.10, fourteen connections about every 300 seconds with almost no jitter. That's a 5-minute beacon. A chatty Office 365 channel has just as many connections, so a count filter alone would flag it too, but its gaps are all over the place, so the jitter test drops it. The low jitter is what proves a beacon.",
      lead:"Same IP as btun's encoded PowerShell. The macro's payload is beaconing. Contain wrk-btun."}]},

  {id:"dns-tunnel",title:"DNS tunneling",tag:"Exfiltration",stage:2,after:"I5",opens:"rex (Station 2)",
   sit:"Ticket: a host may be smuggling data out inside DNS lookups. Find the domain being abused and the process doing it.",
   why:"DNS is allowed out of almost every network, so attackers hide data in the names they look up. The tell is many long, random subdomains of one domain.",
   terms:[{t:"Sysmon Event ID 22",d:"a Sysmon log line for a DNS query: which process asked, and the name it looked up."},
     {t:"DNS tunneling",d:"hiding data inside DNS queries, encoding it into long subdomain names of a domain the attacker controls."},
     {t:"len()",d:"a Splunk eval function that returns the number of characters in a value."}],
   tasks:[
     {ask:"Look at DNS queries and flag the long ones. Count queries whose name is over 50 characters, grouped by the host and the process making them.",
      hint:"Sysmon EventCode 22, eval the length of QueryName with len(), then where it's over 50, then stats count by dest and Image.",
      spl:'index=sysmon EventCode=22\n| eval qlen=len(QueryName)\n| where qlen > 50\n| stats count by dest Image',
      note:"Every long query comes from one process on wrk-fyodor, running from a suspicious path in ProgramData. Normal lookups are short names like outlook.office365.com.",
      lead:"One process, many long names. Next, find the single domain they all hang off."},
     {ask:"Pull the parent domain (the last two labels) out of each query name and count the distinct names per domain. The tunnel is the domain with far too many.",
      hint:"Use rex to capture the last two dot-separated labels into a field, then stats dc(QueryName) by that domain.",
      spl:'index=sysmon EventCode=22\n| rex field=QueryName "(?<domain>[^.]+\\.[^.]+)$"\n| stats dc(QueryName) AS unique_names by domain\n| sort - unique_names',
      note:"cdn-telemetry.net has 24 unique names, while every real domain has one or two. That domain is the tunnel. The random subdomains are the data leaving.",
      lead:"Block cdn-telemetry.net and isolate wrk-fyodor. That host also shows up in the port-scan case."}]},

  {id:"portscan",title:"Internal port scan",tag:"Discovery",stage:2,after:"N4",opens:"Station 1",
   sit:"Ticket: a workstation may be scanning the network. Find a host touching an unusual number of ports or machines.",
   why:"Before moving, attackers map what's reachable. One source hitting many ports on a server, or one port across many hosts, is reconnaissance.",
   terms:[{t:"port scan",d:"probing many ports or many hosts to see what services answer."},
     {t:"port 445",d:"Windows file sharing (SMB). Sweeping it across a network hunts for machines to spread to."},
     {t:"dc()",d:"distinct count: how many different values a field has."}],
   tasks:[
     {ask:"For each source in the firewall logs, count how many distinct destination ports and distinct destination hosts it touched. Flag anything far above normal.",
      hint:"stats dc(dstport) and dc(dstip) and count by srcip, then where either distinct count is high.",
      spl:'index=fw\n| stats dc(dstport) AS ports dc(dstip) AS hosts count by srcip\n| where ports > 15 OR hosts > 15',need:["srcip","ports","hosts"],
      note:"wrk-fyodor touched 24 ports across 28 hosts, where a normal workstation talks to a handful. That's a scanner, and it's the same host as the DNS tunnel.",
      lead:"Now characterise it: was it fanning out across ports, hosts, or both?"},
     {ask:"Show what wrk-fyodor's scan looked like: count its firewall events by destination port, so a sweep on one port stands out.",
      hint:"Filter srcip to wrk-fyodor's address, then stats count by dstport, and sort.",
      spl:'index=fw srcip=192.168.1.24\n| stats count dc(dstip) AS hosts by dstport\n| sort - hosts',
      note:"Port 445 was tried against the most hosts: a classic SMB sweep looking for file shares to move through. The single-host port fan-out on srv-file01 is the other half, mapping one server's services.",
      lead:"wrk-fyodor is doing discovery on the network. Isolate it alongside the DNS finding."}]},

  {id:"malware",title:"Malware on an endpoint",tag:"Execution",stage:2,after:"I14",opens:"Lookups (Station 2)",
   sit:"Ticket: a user ran a file that looks like a document but isn't. Find what it did and confirm it against threat intel.",
   why:"A file named like invoice.pdf.exe is a program wearing a document's name. Once run, it usually looks around and calls home.",
   terms:[{t:"double extension",d:"a filename like invoice.pdf.exe: the real type is the last one (.exe), the first is there to fool you."},
     {t:"discovery commands",d:"built-in tools like whoami, net group and nltest an attacker runs to learn where they landed."},
     {t:"IOC",d:"an indicator of compromise: a hash, IP or domain known to be bad, used to confirm a hunch."}],
   tasks:[
     {ask:"Find the process started from a file ending in .pdf.exe, and list what it launched after.",
      hint:"Sysmon EventCode 1. Look for Image or ParentImage matching *invoice_8841.pdf.exe.",
      spl:'index=sysmon EventCode=1 (Image="*invoice_8841.pdf.exe" OR ParentImage="*invoice_8841.pdf.exe")\n| table _time Image CommandLine',
      note:"mkraeusen ran the fake invoice, and within seconds it started cmd.exe to run whoami. That's an attacker checking who they are. Follow cmd.exe's own children on that host and you also find net group \"domain admins\" and nltest: they're mapping the domain.",
      lead:"It's running discovery. Confirm the file itself is known-bad."},
     {ask:"Pull the MD5 hash out of each process event and check it against the known-bad hash list. Keep only the matches.",
      hint:"rex the hash out of the Hashes field, then lookup known_bad_hashes.csv on it, and keep rows where the malware field is set.",
      spl:'index=sysmon EventCode=1\n| rex field=Hashes "MD5=(?<md5>\\w+)"\n| lookup known_bad_hashes.csv md5 OUTPUT malware\n| where isnotnull(malware)\n| table _time dest Image malware',
      note:"Two known-bad files confirmed: the fake invoice on mkraeusen's PC and the implant on btun's. Threat intel turns a suspicion into a confirmed incident.",
      lead:"You've closed the loop: behaviour flagged it, the hash proved it. That's the pattern for every case here."}]},

  {id:"alert-tuning",title:"Tuning a noisy alert",tag:"Detection engineering",stage:4,after:"D7",opens:"Detection (Station 4)",
   sit:"Ticket: the large-upload alert pages every night on a server that's just running its scheduled cloud backup. The team wants the backup silenced — but only if that won't hide real data theft or quietly break another alert. Tune out the noise, keep the real hits, and prove you didn't lose one.",
   why:"A detection that pages on noise gets muted, and a muted detection misses the real thing. Tuning — thresholds and allowlists — is most of a detection engineer's job, and every change has to be checked against the data so it doesn't silence a true positive.",
   terms:[{t:"threshold",d:"the line in a detection that separates signal from noise, like keeping only transfers above 500 MB."},
     {t:"allowlist",d:"known-good values (a host, an IP, an asset role) you filter out so the alert ignores normal activity."},
     {t:"false positive",d:"an alert that fires on benign activity. Too many and analysts stop trusting it."}],
   tasks:[
     {ask:"Start with the large-upload alert. Total the firewall sentbyte per source and keep the big senders, over 500 MB, so you can see what it's firing on.",
      hint:"stats sum(sentbyte) AS b by srcip, then where b>500000000 (500 MB in bytes).",
      spl:'index=fw\n| stats sum(sentbyte) AS b by srcip\n| where b>500000000',
      free:true,
      note:"Two sources: 192.168.1.12 pushing about 2 GB, and 192.168.1.25 about 852 MB. One is a nightly backup, the other is data walking out the door.",
      lead:"The 2 GB is srv-backup01's scheduled S3 backup. Allowlist it without touching the real exfil."},
     {ask:"Tune it with the asset list: drop backup servers by their role, keeping the suspicious uploader.",
      hint:"lookup assets.csv ip AS srcip OUTPUT role asset, keep the big senders, then drop backup servers with search NOT role=\"backup server\".",
      spl:'index=fw\n| stats sum(sentbyte) AS b by srcip\n| lookup assets.csv ip AS srcip OUTPUT role asset\n| where b>500000000\n| search NOT role="backup server"',
      free:true,
      note:"One row left — wrk-klagerfield (192.168.1.25), the 852 MB MEGA upload. Allowlisting by asset role drops the backup server and keeps the exfiltration, and it tunes itself as new backup servers join the asset list. Use NOT role=, not role!=: NOT keeps sources missing from the asset list, while role!= would quietly drop them — and an unknown host is exactly the one you want to see.",
      lead:"A tuning change can quietly break another alert. Prove the spray detection still works."},
     {ask:"Confirm the password-spray alert still catches its target: count the distinct accounts each failed-sign-in source hit, keep sources that hit 5 or more.",
      hint:"index=o365 Operation=UserLoginFailed, then dc(user) AS users by ClientIP, then where users>=5.",
      spl:'index=o365 Operation=UserLoginFailed\n| stats dc(user) AS users by ClientIP\n| where users>=5',
      free:true,
      note:"Still one row — 198.51.100.23, 10 accounts. The spray detection is intact. Tuning is never finished until you've checked you didn't silence a real hit.",
      lead:"Both alerts fire on the attack and stay quiet on the noise, and nothing real was lost. That's the loop: tune, then verify against the data."}]},
  {id:"es-triage",title:"Working the ES queue",tag:"Enterprise Security",stage:6,after:"E5",opens:"Enterprise Security (Station 6)",
   sit:"Ticket: you're on the Incident Review desk in Enterprise Security. Two notables sit at critical. One is already owned by dsong. Work the other, decide whether it's an isolated event or part of something bigger, and gather the evidence to back your call. (The notable and risk events here are sample data shaped like ES output.)",
   why:"This is the everyday ES loop: triage by urgency, use Risk-Based Alerting to see whether a single notable is really one thread of a larger compromise, then confirm each leg against the raw events before you write it up. One notable in isolation can look minor; the risk total is what tells you it isn't.",
   terms:[{t:"notable",d:"an event a correlation search wrote into index=notable when it matched; the rows in Incident Review."},
     {t:"urgency",d:"severity × priority — how far up the queue a notable sits. You work criticals first."},
     {t:"risk incident rule",d:"a correlation search over index=risk that fires when an object's summed risk_score crosses a threshold."}],
   tasks:[
     {ask:"Find the critical notable you should pick up: urgency critical and still unowned (status New). Show its rule_name and the asset it hit.",
      hint:"Use the `notable` macro (urgency and status are store fields): `notable` urgency=critical status=New, then table rule_name dest.",
      spl:'`notable` urgency=critical status=New\n| table rule_name dest',
      free:true,
      note:"One row — \"New Privileged Account Created\" on srv-dc01. The other critical (Successful Login After Brute Force) is dsong's, so this is yours.",
      lead:"A new admin on a DC could be a one-off. Risk-Based Alerting will tell you if it's isolated."},
     {ask:"Pivot to RBA. Build svc_backup's risk timeline: list every risk event on it with its time, the rule that fired and the score.",
      hint:"index=risk risk_object=svc_backup, then table _time search_name risk_score.",
      spl:'index=risk risk_object=svc_backup\n| table _time search_name risk_score',
      free:true,
      note:"Three risk events on svc_backup — a successful brute force (+40), the privileged account creation (+40), and PsExec lateral movement (+30). Summed, that's 110, over the risk incident threshold of 100. The \"isolated\" new-admin notable is one leg of a full compromise of svc_backup.",
      lead:"Confirm the lateral-movement leg independently before you write it up."},
     {ask:"Pin down where svc_backup's compromise began: of its risk events, show the earliest one — its time, the rule, and the risk_message.",
      hint:"index=risk risk_object=svc_backup, sort _time, head 1, then table _time search_name risk_message.",
      spl:'index=risk risk_object=svc_backup\n| sort _time\n| head 1\n| table _time search_name risk_message',
      free:true,
      note:"The first risk on svc_backup is the Successful Brute Force rule at 13:08 — \"svc_backup signed in from a brute-force source.\" That's the entry point; the privileged-account creation and PsExec came after. You'd escalate svc_backup as a confirmed incident, timeline from 13:08, and route it to a SOAR playbook for containment.",
      lead:"That's the ES loop end to end: triage, let RBA join the dots, read the risk story to find the entry point, then hand off response."}]}
];
if(typeof DATASETS!=="undefined")DATASETS.deskCases=DESK_CASES;
// The glossary: every term the Alert Desk explains, plus the core words used across the stations.
const GLOSS_CORE=[
  {t:"SIEM",d:"security information and event management: a tool like Splunk that collects logs from everywhere so you can search and alert on them in one place.",g:"Security"},
  {t:"SOC",d:"security operations centre: the team that watches alerts, investigates them and responds to incidents.",g:"Security"},
  {t:"triage",d:"the first quick look at an alert to decide if it's real, how serious it is, and what to do next.",g:"Security"},
  {t:"true positive / false positive",d:"a true positive is an alert about something really bad. A false positive fired, but the activity was harmless.",g:"Security"},
  {t:"lateral movement",d:"an attacker moving from the first machine they took to other machines on the network.",g:"Security"},
  {t:"persistence",d:"anything an attacker sets up to keep access after a reboot or password change, like a scheduled task or a new account.",g:"Security"},
  {t:"exfiltration",d:"stealing data by sending it out of the network.",g:"Security"},
  {t:"MITRE ATT&CK",d:"a public catalogue of attacker techniques, grouped by goal, such as credential access or lateral movement. SOCs use it to name what they see.",g:"Security"},
  {t:"Event ID 4688",d:"Windows Security log line for a new process. Sysmon Event ID 1 records the same thing with more detail.",g:"Windows"},
  {t:"Event ID 4698",d:"a scheduled task was created. Attackers use tasks to rerun their malware on a timer.",g:"Windows"},
  {t:"Event ID 4740",d:"an account was locked out after too many wrong passwords.",g:"Windows"},
  {t:"Sysmon",d:"a free Microsoft tool that logs detailed process, network and DNS activity on Windows machines.",g:"Windows"},
  {t:"index",d:"where Splunk stores a set of data. Searches start by naming one, like index=win.",g:"Splunk"},
  {t:"sourcetype",d:"the format of the data, such as WinEventLog:Security. It tells Splunk how to read the fields.",g:"Splunk"},
  {t:"field",d:"a named value in an event, like user or src, that you can filter, count and group by.",g:"Splunk"},
  {t:"CIM",d:"the Common Information Model: shared field names, like src, dest, user and action, so different log types can be searched the same way.",g:"Splunk"},
  {t:"data model",d:"a CIM structure that groups events of one kind, such as Authentication, so tstats can search them fast.",g:"Splunk"},
  {t:"tstats",d:"a very fast Splunk command that counts from indexed fields and accelerated data models instead of reading every raw event.",g:"Splunk"},
  {t:"lookup",d:"a table, usually a CSV file, that Splunk matches against your events to add columns, like a threat list or an asset list.",g:"Splunk"},
  {t:"risk score (RBA)",d:"risk-based alerting in Enterprise Security: small suspicious findings add risk points to a user or host, and one alert fires when the total gets high.",g:"Splunk"},
  {t:"notable event",d:"an alert in Splunk Enterprise Security, the thing an analyst picks up and triages.",g:"Splunk"}];
function glossary(){const seen=new Set(),out=[];GLOSS_CORE.forEach(x=>{seen.add(x.t);out.push(x)});
  DESK_CASES.forEach(c=>c.terms.forEach(x=>{if(!seen.has(x.t)){seen.add(x.t);out.push({t:x.t,d:x.d,g:/Event ID|Logon Type|Sysmon|PsExec|LOLBin|port 445|Domain Admins|parent process|-enc/.test(x.t)?"Windows":/iplocation|streamstats|len\(\)|dc\(\)|o365/.test(x.t)?"Splunk":"Security"})}}));
  return out}

/* ============================================================
   THE FIELD MANUAL — a reference you can read any time, plus drills.
   Two halves:
   1) Command cards: the commands a SOC analyst reaches for, each with a one-line job, the shape of its syntax, and a
      worked example that runs on the sample day. Tap Listen to hear the explanation.
   2) A security query library: the everyday SOC detections, each a correct, runnable Splunk search with a line-by-line
      read and the bugs people usually make. Many carry a drill: you rebuild the query yourself against the sample data.
   Everything runs on data:"desk" (the Frothly sample day). Nothing here uses real or work data.
   ============================================================ */
const MANUAL_CARDS=[
  {cmd:"search",job:"Pick the events to work on. Every search starts here, before any pipe.",
   shape:"index=win EventCode=4625 user=admin*",
   ex:'index=win EventCode=4625 dest=srv-web01',
   note:"Name the index first, then narrow with fields. Whole words match; use * for partial, and quote a phrase with spaces. AND is implied, OR and NOT are capitals."},
  {cmd:"stats",job:"Summarise: count, sum, average or list values, grouped by one or more fields.",
   shape:"stats count dc(user) AS users values(user) by src",
   ex:'index=win EventCode=4625\n| stats count dc(user) AS accounts by src',
   note:"The workhorse. count counts rows, dc counts distinct values, values lists them. Everything after by becomes the rows of the table."},
  {cmd:"eval",job:"Make a new field, or change one, with a calculation or a condition.",
   shape:'eval mb=round(bytes/1048576,1), kind=if(port=443,"https","other")',
   ex:'index=fw action=accept\n| eval mb=round(sentbyte/1048576,1)\n| table _time srcip dstip mb',
   note:"if() and case() branch; round(), len(), lower() and coalesce() are everyday functions. eval runs per event."},
  {cmd:"where",job:"Keep only the rows that pass a test, usually after you've calculated something.",
   shape:"where count > 10 AND isnotnull(threat)",
   ex:'index=win EventCode=4625\n| stats count by src\n| where count > 10',
   note:"where compares fields to each other and to functions, unlike the bare search filter. Use it after stats to filter on a count."},
  {cmd:"rex",job:"Pull a new field out of text with a regular expression, or rewrite a field with mode=sed.",
   shape:'rex field=_raw "user=(?<user>\\w+)"',
   ex:'index=sysmon EventCode=1\n| rex field=Hashes "MD5=(?<md5>\\w+)"\n| table _time Image md5',
   note:"(?<name>...) captures into a field. mode=sed \"s/old/new/g\" rewrites in place, handy for masking. rex reads raw log lines that have no extracted field yet."},
  {cmd:"lookup",job:"Add columns to your events by matching a field against a table, like a threat or asset list.",
   shape:"lookup known_bad_ips.csv ip AS dstip OUTPUT threat",
   ex:'index=fw\n| lookup known_bad_ips.csv ip AS dstip OUTPUT threat\n| where isnotnull(threat)\n| stats count by srcip dstip threat',
   note:"Match your field (dstip) to the table's key (ip) with AS, and OUTPUT the columns you want. isnotnull after a lookup keeps only the hits."},
  {cmd:"inputlookup",job:"Read a lookup table on its own, as the start of a search.",
   shape:"| inputlookup known_bad_ips.csv",
   ex:'| inputlookup known_bad_ips.csv\n| table ip threat source',
   note:"Starts with a pipe because it generates events from the table instead of searching an index. Good for checking or feeding a subsearch."},
  {cmd:"timechart",job:"Count or measure over time, drawn as a line or column chart.",
   shape:"timechart span=1h count by action",
   ex:'index=fw\n| timechart span=30m count by action',
   note:"Always splits by _time. span sets the bucket. One series per value after by. For any other pair of fields, use chart."},
  {cmd:"eventstats",job:"Add a summary value to every event without collapsing the rows.",
   shape:"eventstats avg(bytes) AS avg_bytes by src",
   ex:'index=fw action=accept\n| eventstats avg(sentbyte) AS avg_out by srcip\n| where sentbyte > avg_out*5',
   note:"Like stats, but the result is glued back onto each row, so you can compare an event to its group's average."},
  {cmd:"streamstats",job:"Calculate across rows in order, such as the gap from each event to the one before.",
   shape:"streamstats current=f last(_time) AS prev by src dest",
   ex:'index=fw dstport=443\n| sort 0 _time\n| streamstats current=f last(_time) AS prev by srcip dstip\n| eval gap=_time-prev',
   note:"Order first with sort. current=f looks only at earlier rows. The engine for beaconing: it gives you the interval between connections."},
  {cmd:"transaction",job:"Group related events into one, by a shared field and timing.",
   shape:"transaction user maxpause=10m startswith=...",
   ex:'index=win user=svc_backup\n| transaction user maxpause=10m\n| table user duration eventcount',
   note:"Gives duration and eventcount. Powerful but heavy; a stats by the same field is usually faster when you don't need the span."},
  {cmd:"tstats",job:"Count very fast from indexed fields or an accelerated data model.",
   shape:"| tstats count where index=win by sourcetype",
   ex:'| tstats count where index=* by index sourcetype',
   note:"Starts with a pipe. Only touches indexed fields (index, sourcetype, host, source, _time) or data-model fields. The command behind fast dashboards and correlation searches."}];

  {id:"q-risk",title:"Risk-based alerting: score the account, not the event",tag:"Correlation",
   spl:'index=win (EventCode=4625 OR EventCode=4740 OR EventCode=4720 OR EventCode=4728 OR EventCode=4756)\n| eval risk_score=case(EventCode=4728 OR EventCode=4756, 80, EventCode=4720, 60, EventCode=4740, 20, EventCode=4625, 3, true(), 0)\n| eval risk_object=user\n| stats sum(risk_score) AS risk by risk_object\n| where risk >= 50\n| sort -risk',
   lines:[["index=win (EventCode=4625 OR EventCode=4740 OR EventCode=4720 OR EventCode=4728 OR EventCode=4756)","The events worth scoring: failed logons, lockouts, new accounts and group adds."],
     ["eval risk_score=case(EventCode=4728 OR EventCode=4756, 80, EventCode=4720, 60, EventCode=4740, 20, EventCode=4625, 3, true(), 0)","Give each event a weight. `case()` reads top to bottom and stops at the first true test; `true()` is the catch-all."],
     ["eval risk_object=user","What the risk attaches to: here, the account."],
     ["stats sum(risk_score) AS risk by risk_object","Add up the risk per account. Many small events can sum to a big score."],
     ["where risk >= 50","Raise one alert per risky account, not one per event. This is the idea behind risk-based alerting. In Enterprise Security it's automated: risk rules write these scores to the risk index, and a separate correlation search raises a notable when an object's total crosses a threshold. Here you do it by hand to see how it works."]],
   bugs:["A `case()` with no `true()` at the end leaves non-matching rows null, and nulls drop out of the sum. Add a `true(), 0` catch-all.",
     "Risk-based alerting is about the risk_object (the account or host) over time, so sum by risk_object; scoring single events just makes more noise."],
   drill:{ask:"Score each account (group add 80, new account 60, lockout 20, failed logon 3), total the score per account, and keep totals of 50 or more.",
     target:'index=win (EventCode=4625 OR EventCode=4740 OR EventCode=4720 OR EventCode=4728 OR EventCode=4756)\n| eval risk_score=case(EventCode=4728 OR EventCode=4756, 80, EventCode=4720, 60, EventCode=4740, 20, EventCode=4625, 3, true(), 0)\n| eval risk_object=user\n| stats sum(risk_score) AS risk by risk_object\n| where risk >= 50\n| sort -risk',

function shuffle(a,rnd){rnd=rnd||Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seeded(str){let s=parseInt(h32(str),16)||1;return ()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const Clock={paused:false,jobs:new Set(),pausedAt:0,hooks:[],
  later(fn,ms){const j={left:ms,at:performance.now(),id:0};j.run=()=>{this.jobs.delete(j);fn()};this.jobs.add(j);if(!this.paused)j.id=setTimeout(j.run,ms);return j},
  cancel(j){if(j){clearTimeout(j.id);this.jobs.delete(j)}},
  pause(){if(this.paused)return;this.paused=true;this.pausedAt=performance.now();
    this.jobs.forEach(j=>{clearTimeout(j.id);j.left=Math.max(0,j.left-(this.pausedAt-j.at))});Voice.pause();this.hooks.forEach(f=>f(true,0));paintPlayer()},
  resume(){if(!this.paused)return;this.paused=false;const d=performance.now()-this.pausedAt;
    this.jobs.forEach(j=>{j.at=performance.now();j.id=setTimeout(j.run,j.left)});this.hooks.forEach(f=>f(false,d));Voice.resume();paintPlayer()},
  toggle(){this.paused?this.resume():this.pause()},
  reset(){this.jobs.forEach(j=>clearTimeout(j.id));this.jobs.clear();this.hooks=[];this.paused=false}
};

  const k=[...AUDIO.keys()][0];
  if(!FILEPROTO){
    put("fetch audio/pack00.mp3","trying…");
    fetch("audio/pack00.mp3").then(r=>{put("fetch audio/pack00.mp3","HTTP "+r.status);return r.arrayBuffer()}).then(b=>put("pack00 bytes",b.byteLength)).catch(e=>put("fetch audio/pack00.mp3","FAILED ("+(e&&e.message||e)+")"));
    put("Web Audio clip","trying…");
    clipBuffer(k).then(buf=>{if(!actx)throw new Error("no ctx");
      const go=()=>{try{const s=actx.createBufferSource();s.buffer=buf;const g=actx.createGain();g.gain.value=.9;s.connect(g);g.connect(actx.destination);s.onended=()=>put("Web Audio clip","OK (played "+buf.duration.toFixed(2)+"s)");s.start()}catch(e){put("Web Audio clip","FAILED ("+e.name+")")}};
      if(actx.state==="running")go();else{const p=actx.resume();if(p&&p.then)p.then(()=>actx.state==="running"?go():put("Web Audio clip","context stayed suspended — tap the enable chip"));else go()}
    }).catch(e=>put("Web Audio clip","FAILED ("+(e&&(e.name||e.message)||e)+")"));
  }else put("fetch","skipped on file:// — using per-clip files");
  put("HTMLAudio clip","trying…");
  const a=Voice.audio||(Voice.audio=new Audio());
  const trySrc=url=>{a.src=url;const p=a.play();if(p&&p.then)p.then(()=>{put("HTMLAudio clip","OK");setTimeout(()=>{try{a.pause()}catch(e){}},600)}).catch(e=>put("HTMLAudio clip","FAILED ("+e.name+")"));else put("HTMLAudio clip","play() returned no promise")};
  if(FILEPROTO||HAS_CLIPS)trySrc("audio/clips/"+k+".mp3");else clipURL(k).then(trySrc).catch(e=>put("HTMLAudio clip","FAILED fetch ("+(e&&e.message||e)+")"));
  $("#scrun").onclick=()=>soundCheck();
}

/* ============================ animation ============================
   Draws the events flowing through the new pipe: kept ones pass, dropped ones fall away,

let animRaf=0;

      const names=Object.keys(groups).sort();
      const lay=g=>{const per=Math.max(1,Math.floor((A.w-16)/g));const hs=names.map(n=>Math.ceil(groups[n].length/per)*g+26);return {per,hs,tot:hs.reduce((a,b)=>a+b,0)+(names.length-1)*8}};
      let g=18,L0=lay(g);while(g>6&&L0.tot>A.h){g--;L0=lay(g)}const {per,hs,tot}=L0,d=Math.round(g*2/3);

        groups[n].forEach((r,i)=>out.push({key:"e"+r._id,row:r,x:A.x+8+(i%per)*g,y:y+22+Math.floor(i/per)*g,w:d,h:d,r:d/2,color:colorOf(r,c)}));y+=hs[gi]+8});

function runAnim(host,prev,cur,fresh,pipe){

// A plain hint at how a typed search differs from the goal: kind, columns, row count, then values or order.
function diffMsg(u,r){

// A short, varied round: every hands-on question (fill, bug, order), then log reading, then at most two concept
// questions. Questions seen least come first, so a replay doesn't feel like the same drill again.
function mixRound(qs,n){
  const seen=q=>{const x=prog.q[q.id];return x?x.s||0:0};
  const pick=a=>shuffle(a).sort((x,y)=>seen(x)-seen(y));
  const write=pick(qs.filter(q=>q.type==="write")).slice(0,1);
  const stanza=pick(qs.filter(q=>q.type==="stanza")).slice(0,1);
  const hands=pick(qs.filter(q=>q.type==="fill"||q.type==="bug"||q.type==="order")).slice(0,write.length?2:3);
  const read=pick(qs.filter(q=>q.type==="read")).slice(0,2);
  const concept=pick(qs.filter(q=>q.type==="concept")).slice(0,Math.max(1,n-write.length-stanza.length-hands.length-read.length));
  const out=write.concat(stanza,hands,read,concept).slice(0,n);
  // spread the types out so two of a kind rarely sit next to each other
  const byT={};out.forEach(q=>(byT[q.type]=byT[q.type]||[]).push(q));const keys=Object.keys(byT).sort((a,b)=>byT[b].length-byT[a].length);
  const res=[];while(res.length<out.length)keys.forEach(k=>{if(byT[k].length)res.push(byT[k].shift())});
  return res}
function pickRound(mode,id){
  if(mode==="lesson"){const l=L(id);let qs=l.quiz.filter(levelOk);if(qs.length<5)qs=l.quiz.slice();
    return {qs:mixRound(qs,6).map(q=>Object.assign({lesson:id},q)),label:`Lesson ${lessonNo(l)} · ${l.t}`}}
  if(mode==="daily"){const rnd=seeded("daily"+dayKey()),pool=watchedQuiz();
    const missed=shuffle(pool.filter(q=>{const s=prog.q[q.id];return s&&s.l===0}),rnd).slice(0,2);
    const rest=shuffle(pool.filter(q=>!missed.includes(q)&&levelOk(q)),rnd);

  const due=dueList().sort((a,b)=>((prog.q[a.id].box||1)-(prog.q[b.id].box||1)));

}

/* ---- Write the stanza: type .conf key = value lines, graded by normalized setting/value pairs, order ignored ---- */
let S2=null;
function parseStanza(txt){
  const lines=String(txt).split(/\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith("#"));
  let header=null;const pairs={};
  lines.forEach(ln=>{const h=/^\[(.+)\]$/.exec(ln);
    if(h){if(header==null)header=h[1].trim().toLowerCase();return}
    const m=/^([A-Za-z0-9_]+)\s*=\s*(.*)$/.exec(ln);
    if(m)pairs[m[1].toLowerCase()]=m[2].trim().replace(/^["']|["']$/g,"").toLowerCase()});

function capNorm(s){return String(s==null?"":s).toLowerCase().trim().replace(/^["']+|["'.]+$/g,"").replace(/\s+/g," ")}
function capGrade(f,ans){
  const a=capNorm(ans); if(!a)return false;
  if(f.num){const m=a.match(/-?\d+(\.\d+)?/);if(m&&Math.abs(+m[0]-f.num.target)<=f.num.tol)return true}
  // Reject "list everything" guesses: an answer naming 2+ distinct case principals isn't a real finding.
  const cands=(typeof CAP_CANDIDATES!=="undefined")?CAP_CANDIDATES:[];
  const toks=new Set(a.split(" "));
  let hits=0;
  for(const c of cands){const n=capNorm(c);if(!n)continue;if(n.indexOf(".")>=0?a.indexOf(n)>=0:toks.has(n))hits++;if(hits>1)return false}

function capCase(c){
  enter("cap"); useData("desk");
  CAP={c,state:c.findings.map(f=>({f,solved:false,revealed:false,tries:0}))};
  app.innerHTML=`<div class="stagebar"><div class="row"><button class="chip" id="quit" type="button">Capstones</button><span class="chip">${esc(c.title)}</span></div><button class="chip" id="gloss" type="button">Glossary</button></div>
  <div class="ticket pop"><div class="thead"><span class="sev">CASE</span><span class="eyebrow">${esc(c.tag)}</span></div>
    <div class="sayhead"><p class="what">${esc(c.brief)}</p>${talkBtn("blisten")}</div>
    <details><summary>Where to look</summary><dl class="terms">${DESK_SOURCES.map(([a,b])=>`<div><dt><code>${esc(a)}</code></dt><dd>${esc(b)}</dd></div>`).join("")}
      <div><dt>Lookups</dt><dd>${esc(DESK_LOOKUP_LIST)}</dd></div></dl></details></div>
  <div class="searchbar"><div class="lbl"><span>INVESTIGATION CONSOLE</span><span>Enter runs · Shift+Enter new line</span></div>
    <textarea class="console" id="cta" rows="4" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Investigation console" placeholder="Run any search on the day's data, e.g. index=win EventCode=4625 | stats count by src"></textarea>
    <div class="ctrl"><div class="r"><button class="btn ghost" id="cclear">Clear</button></div><div class="r"><button class="btn" id="crun">Run search</button></div></div>
    <div id="cout"></div></div>
  <div class="sec" id="finds"><div class="eyebrow" style="color:var(--ok)">Findings — answer what you can confirm</div>
    ${CAP.state.map((s,i)=>capFindHTML(s,i)).join("")}</div>
  <div id="capfoot"></div>`;
  $("#quit").onclick=capLobby;$("#gloss").onclick=glossaryPage;
  const seg=[c.brief];bindTalk("blisten",()=>seg);
  $("#cclear").onclick=()=>$("#cta").value="";
  $("#crun").onclick=capRun;
  const ta=$("#cta");ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();capRun()}};ta.focus({preventScroll:true});
  CAP.state.forEach((s,i)=>capBindFind(i));
  capFoot();
  if(Voice.ok&&set.voice)Voice.speak([c.brief]);
}
function capRun(){
  const ta=$("#cta"),out=$("#cout");let r=null,err="";
  try{r=runSPL(ta.value)}catch(e){if(!(e instanceof SplError))throw e;err=e.message}
  out.innerHTML=err?`<div class="fb badc" style="margin-top:10px"><p class="why">${esc(err)}</p></div>`:resultHTML(r);
}
function capFindHTML(s,i){
  const f=s.f,done=s.solved||s.revealed;
  return `<div class="find ${s.solved?"ok":s.revealed?"shown":""}" id="find${i}">
    <div class="findq"><span class="fn">${i+1}</span><span>${rich(f.q)}</span></div>
    ${done?`<div class="findans ${s.solved?"good":"shown"}">${s.solved?"✓ Confirmed: ":"Answer: "}${esc(f.accept[0])}</div><p class="why"><b>WHY</b> &nbsp;${rich(f.why)}</p>`:
      `<div class="findrow"><input class="finput" id="fi${i}" type="text" autocomplete="off" spellcheck="false" placeholder="Type what you found"><button class="btn sm" data-sub="${i}">Submit</button></div>
       <div id="fmsg${i}"></div>`}</div>`;
}
function capBindFind(i){
  const s=CAP.state[i];if(s.solved||s.revealed)return;
  const sub=document.querySelector(`[data-sub="${i}"]`);if(sub)sub.onclick=()=>capSubmit(i);
  const inp=$("#fi"+i);if(inp)inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();capSubmit(i)}};
}
function capReRender(i){const el=$("#find"+i);if(el){el.outerHTML=capFindHTML(CAP.state[i],i);capBindFind(i)}}
function capSubmit(i){
  const s=CAP.state[i];if(s.solved||s.revealed)return;
  const inp=$("#fi"+i),msg=$("#fmsg"+i),val=inp?inp.value:"";
  if(!val.trim())return;
  if(capGrade(s.f,val)){s.solved=true;sfx.good();capReRender(i);capAfter(i,true)}
  else{s.tries++;sfx.bad();
    msg.innerHTML=`<div class="fb badc" style="margin-top:8px"><p class="why">Not what the evidence shows. Keep investigating in the console${s.f.hint?", or take a hint":""}.</p>
      <div class="row">${s.f.hint?`<button class="btn sm ghost" data-caphint="${i}">Hint</button>`:""}${s.tries>=2?`<button class="btn sm ghost" data-caprev="${i}">Reveal answer</button>`:""}</div></div>`;
    const hb=document.querySelector(`[data-caphint="${i}"]`);if(hb)hb.onclick=()=>{msg.innerHTML=`<div class="fb" style="margin-top:8px"><p class="why"><b>HINT</b> &nbsp;${esc(s.f.hint)}</p>${s.tries>=2?`<div class="row"><button class="btn sm ghost" data-caprev="${i}">Reveal answer</button></div>`:""}</div>`;const rb2=document.querySelector(`[data-caprev="${i}"]`);if(rb2)rb2.onclick=()=>capRevealOne(i);if(Voice.ok&&set.voice)Voice.speak([s.f.hint])};
    const rb=document.querySelector(`[data-caprev="${i}"]`);if(rb)rb.onclick=()=>capRevealOne(i);
  }
}
function capRevealOne(i){const s=CAP.state[i];if(s.solved||s.revealed)return;s.revealed=true;capReRender(i);capAfter(i,false)}
function capAfter(i,clean){
  const s=CAP.state[i];
  if(s.solved&&clean)prog.xp+=300;
  const d=capInfo(CAP.c.id),found=CAP.state.filter(x=>x.solved||x.revealed).length,cln=CAP.state.filter(x=>x.solved).length;
  d.found=Math.max(d.found,found);d.clean=Math.max(d.clean,cln);if(found>=CAP.c.findings.length)d.done=true;
  capSave(CAP.c.id,d);checkBadges();
  if(Voice.ok&&set.voice)Voice.speak([s.f.why]);
  capFoot();
}
function capFoot(){
  const foot=$("#capfoot");if(!foot)return;
  const found=CAP.state.filter(x=>x.solved||x.revealed).length,n=CAP.c.findings.length,cln=CAP.state.filter(x=>x.solved).length;
  if(found<n){foot.innerHTML=`<div class="say"><div class="eyebrow">${found} of ${n} findings confirmed</div><p class="muted">Answer the rest from the logs. Each one you get without revealing is worth more.</p></div>`;return}
  foot.innerHTML=`<div class="fb good pop"><div class="head"><span class="verdict">Case closed</span><span class="pts">${cln}/${n} without the answer</span></div>
    <p class="why"><b>DEBRIEF</b> &nbsp;${rich(CAP.c.debrief)}</p>
    <div class="ctrl"><span></span><button class="btn" id="capback">Back to capstones</button></div></div>`;
  $("#capback").onclick=capLobby;$("#capback").focus({preventScroll:true});
  if(!CAP._debriefed){CAP._debriefed=true;if(Voice.ok&&set.voice)Voice.speak([CAP.c.debrief])}
}
function capSegs(c){const g=[c.brief];c.findings.forEach(f=>{g.push(f.q);if(f.hint)g.push(f.hint);g.push(f.why)});g.push(c.debrief);return g}

/* ============================ Power User mock exam ============================
   A timed, blueprint-mapped practice exam. One overall timer, no hints, no
   per-question feedback — the whole thing is graded at the end, with a per-domain
   breakdown and a lesson link on every miss. Questions are drawn only from topics
   the lessons teach (gate rule 1); any untaught blueprint domain would show as
   "not covered yet", never as a weak score. */
let EX=null;
function examStop(){if(EX){EX.done=true;cancelAnimationFrame(EX.raf)}}
function examIntro(){
  enter("exam"); EX=null;
  const n=Math.min(EXAM.draw,EXAM_BANK.length);
  app.innerHTML=`<div class="stagebar"><button class="chip" id="quit" type="button">Home</button><span class="chip">Mock exam</span></div>
  <header class="hero">${logo(64)}<div><div class="eyebrow">Certification practice</div><h1>Power User mock exam</h1>
    <p class="muted">A timed, blueprint-mapped practice run for the Splunk Core Certified Power User exam (SPLK-1002). Multiple choice, one overall timer, no hints — like the real thing. You get your score and a topic-by-topic breakdown at the end.</p></div></header>
  <div class="card pop">
    <div class="exfacts"><div><b>${n}</b><span>questions</span></div><div><b>${EXAM.mins}:00</b><span>one timer</span></div><div><b>~${Math.round(EXAM.passApprox*100)}%</b><span>target (approx.)</span></div></div>
    <p class="muted" style="font-size:.9rem">The real exam is <b>65 questions in 60 minutes</b>, verified from <a href="${EXAM.src}" target="_blank" rel="noopener">Splunk's own exam blueprint</a>. Splunk does not publish an official pass mark or per-domain weights, so the target above is a practice figure, approximate — use it as a guide, not a guarantee.</p>
    <p class="muted" style="font-size:.9rem">Move back and forth freely and change answers; nothing is graded until you finish, and the timer submits for you at zero. Every question comes from a topic the lessons already teach.</p>
    <div class="row"><button class="btn big" id="start">Start the exam</button></div>
  </div>
  <section class="sec"><div class="eyebrow">What it covers · ${EXAM.domains.length} blueprint domains</div>
    <div class="exdoms">${EXAM.domains.map(d=>{const c=EXAM_BANK.filter(q=>q.dom===d.k).length;return `<div class="exdom"><b>${esc(d.t)}</b><span>${c?c+" in the bank":"not covered yet"}</span></div>`}).join("")}</div></section>`;
  $("#quit").onclick=renderHome; $("#start").onclick=examStart;
  if(Voice.ok&&set.voice)Voice.speak([UI.examIntro]);
}
function examStart(){
  enter("exam");
  const n=Math.min(EXAM.draw,EXAM_BANK.length);
  const qs=shuffle(EXAM_BANK).slice(0,n).map(src=>{const order=shuffle(src.options.map((_,i)=>i));return {src,order,correct:order.indexOf(src.a),pick:null}});
  EX={qs,i:0,end:performance.now()+EXAM.mins*60000,done:false,raf:0};
  EX.hook=(paused,d)=>{if(!paused&&EX)EX.end+=d}; Clock.hooks.push(EX.hook);
  examRender(); EX.raf=requestAnimationFrame(examTick);
}
function examTick(){
  if(!EX||EX.done)return;
  if(Clock.paused){EX.raf=requestAnimationFrame(examTick);return}
  const left=Math.max(0,(EX.end-performance.now())/1000), el=$("#extime");
  if(el){const m=Math.floor(left/60),s=Math.floor(left%60);el.textContent=`${m}:${String(s).padStart(2,"0")}`;const w=el.closest(".extimer");if(w)w.classList.toggle("low",left<=60)}
  if(left<=0){examFinish();return}
  EX.raf=requestAnimationFrame(examTick);
}
function examRender(){
  const it=EX.qs[EX.i], q=it.src, answered=EX.qs.filter(x=>x.pick!==null).length, last=EX.i===EX.qs.length-1;
  const dots=EX.qs.map((x,k)=>`<button class="exdot ${x.pick!==null?"on":""} ${k===EX.i?"cur":""}" data-k="${k}" type="button" aria-label="Question ${k+1}${x.pick!==null?", answered":""}">${k+1}</button>`).join("");
  app.innerHTML=`
  <div class="top extop"><div class="left"><button class="chip" id="quit" type="button">Quit</button><span class="chip">Mock exam</span><span class="chip">${EX.i+1} / ${EX.qs.length}</span></div>
    <div class="extimer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 13V8M9 2h6"/></svg><span id="extime">${EXAM.mins}:00</span></div></div>
  <div class="card pop">
    <div class="qtype"><span class="chip">Question ${EX.i+1}</span><span class="chip lv">${esc(domName(q.dom))}</span></div>
    <div class="sayhead"><div class="prompt">${rich(q.q)}</div>${talkBtn("qlisten")}</div>
    <div class="opts" id="opts">${it.order.map((oi,k)=>`<button class="opt o${k%4} ${it.pick===k?"sel":""}" data-k="${k}" aria-pressed="${it.pick===k}" aria-label="Answer ${k+1}">
      <span class="sh" aria-hidden="true">${SHAPES[k%4]}</span><span class="tx">${esc(q.options[oi])}</span><span class="key">${k+1}</span></button>`).join("")}</div>
  </div>
  <div class="exgrid" aria-label="Jump to question">${dots}</div>
  <div class="ctrl exnav"><div class="r"><button class="btn ghost" id="prev" ${EX.i===0?"disabled":""}>Previous</button></div>
    <div class="r"><span class="muted" style="align-self:center;font-size:.86rem">${answered} of ${EX.qs.length} answered</span>
      <button class="btn ghost" id="finish">Finish exam</button>
      <button class="btn" id="nextq" ${last?"disabled":""}>Next</button></div></div>`;
  $("#quit").onclick=()=>{examStop();renderHome()};
  app.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{it.pick=+b.dataset.k;examRender()});
  app.querySelectorAll(".exdot").forEach(b=>b.onclick=()=>{EX.i=+b.dataset.k;examRender()});
  const pv=$("#prev"); if(pv)pv.onclick=()=>{if(EX.i>0){EX.i--;examRender()}};
  const nx=$("#nextq"); if(nx)nx.onclick=()=>{if(EX.i<EX.qs.length-1){EX.i++;examRender()}};
  $("#finish").onclick=examConfirmFinish;
  bindTalk("qlisten",()=>[q.q]);
}
function examConfirmFinish(){
  const left=EX.qs.filter(x=>x.pick===null).length;
  const b=$("#finish"); if(!b)return;
  if(left>0&&b.dataset.armed!=="1"){b.dataset.armed="1";b.classList.add("warn");b.textContent=`${left} unanswered — finish anyway?`;return}
  examFinish();
}
function examFinish(){
  examStop();
  enter("exam");
  const per={}; EXAM.domains.forEach(d=>per[d.k]={right:0,total:0});
  EX.qs.forEach(x=>{const d=x.src.dom;if(per[d]){per[d].total++;if(x.pick===x.correct)per[d].right++}});
  const right=EX.qs.filter(x=>x.pick===x.correct).length, n=EX.qs.length, acc=n?right/n:0, pass=acc>=EXAM.passApprox;
  const missed=EX.qs.filter(x=>x.pick!==x.correct);
  const prev=(prog.exam&&prog.exam.best)||0;
  prog.exam={best:Math.max(prev,Math.round(acc*100)),attempts:((prog.exam&&prog.exam.attempts)||0)+1,last:{pct:Math.round(acc*100),right,n,at:Date.now()}};
  save();
  const bars=EXAM.domains.map(d=>{const p=per[d.k],has=p.total>0,pc=has?Math.round(p.right/p.total*100):0;
    return `<div class="exbar ${has?(pc>=Math.round(EXAM.passApprox*100)?"ok":"low"):"na"}">
      <div class="exbl"><span>${esc(d.t)}</span><b>${has?`${p.right}/${p.total}`:"not covered yet"}</b></div>
      <div class="extrk"><i style="width:${has?pc:0}%"></i></div></div>`}).join("");
  app.innerHTML=`
  <div class="stagebar"><button class="chip" id="home" type="button">Home</button><span class="chip">Mock exam · result</span></div>
  <div class="eyebrow">Practice exam complete</div>
  <h1 style="font-size:clamp(2rem,5vw,3rem)">${pass?"Above the practice target":"Below the practice target"}</h1>
  <div class="big"><div><span>Score</span><b>${Math.round(acc*100)}%</b></div><div><span>Correct</span><b>${right}/${n}</b></div><div><span>Target (approx.)</span><b>${Math.round(EXAM.passApprox*100)}%</b></div><div><span>Your best</span><b>${prog.exam.best}%</b></div></div>
  <p class="muted" style="font-size:.9rem">The real exam is scored pass/fail and Splunk doesn't publish the cut score, so treat ${Math.round(EXAM.passApprox*100)}% as a practice benchmark, not an official line. The breakdown below shows where to put your next hour.</p>
  <section class="sec"><div class="eyebrow">By blueprint domain</div><div class="exbars">${bars}</div></section>
  <div class="actions"><button class="btn" id="again">Take it again</button><button class="btn ghost" id="home2">Home</button></div>
  ${missed.length?`<section class="missed"><div class="eyebrow">Review what you missed · ${missed.length}</div>
    ${missed.map(x=>{const q=x.src,yours=x.pick===null?"— (left blank)":q.options[x.order[x.pick]];
      return `<details><summary>${rich(q.q)}</summary><div>
        <div class="exans"><span class="bad">Your answer: ${esc(yours)}</span><span class="good">Correct: ${esc(q.options[q.a])}</span></div>
        <p class="why"><b>WHY</b> &nbsp;${rich(q.why)}</p>
        <div class="row"><span class="chip">${esc(domName(q.dom))}</span>${L(q.lesson)?`<button class="btn sm" data-les="${q.lesson}">Review lesson ${lessonNo(L(q.lesson))}: ${esc(L(q.lesson).t)}</button>`:""}</div>
      </div></details>`}).join("")}</section>`:`<div class="banner">Every question correct. Strong run.</div>`}`;
  $("#home").onclick=renderHome; $("#home2").onclick=renderHome; $("#again").onclick=examStart;
  app.querySelectorAll("[data-les]").forEach(b=>b.onclick=()=>watch(b.dataset.les));
  if(Voice.ok&&set.voice)Voice.speak([pass?UI.examPass:UI.examFail]);
}
function domName(k){const d=EXAM.domains.find(x=>x.k===k);return d?d.t:k}

// Every segment the game can say, for recording the audio files.
function allSegs(){const out=new Set();const add=g=>g.forEach(t=>{const s=sayable(t);if(s)out.add(s)});
  LESSONS.forEach(l=>{l.steps.forEach((st,i)=>{const last=i===l.steps.length-1;add([st.what,st.why]);if(st.pro)add(["Veteran note. "+st.pro]);if(last)add([UI.toTurn])});
    l.quiz.forEach(q=>{if(q.type==="write"||q.type==="stanza"){add([q.q,q.note,q.hint]);return}add(qSegs(q,q.type==="order"?q.items:q.options.map((_,i)=>i)));add(fbSegs(q,true,false));add(fbSegs(q,false,false));add(fbSegs(q,false,true))});
    add([l.yourturn.goal]);l.yourturn.extra.forEach(x=>add([x.why]))});
  [1,2,3,4].forEach(n=>add(["Option "+n+".","Line "+n+"."]));
  add(Object.values(UI)); add(BADGES.map(badgeLine)); add(RANKS.map(r=>"Promoted. You're now "+r[1]+"."));
  add(["Put these pieces in order."]);
  glossary().forEach(x=>add([x.t+": "+x.d]));
  MANUAL_CARDS.forEach(c=>add([c.cmd+". "+c.job,c.note]));
  MANUAL_QUERIES.forEach(q=>{add([q.title+"."]);if(q.drill)add([q.drill.ask,q.drill.hint])});
  DESK_CASES.forEach(c=>{c.tasks.forEach((t,i)=>{add(deskSegs(c,i));add([t.hint,t.note,t.lead])})});
  if(typeof EXAM_BANK!=="undefined")EXAM_BANK.forEach(q=>add([q.q]));
  if(typeof CAPSTONES!=="undefined")CAPSTONES.forEach(c=>add(capSegs(c)));
  return [...out].map(t=>({k:h32(t),t}))}

/* ============================ keys ============================ */
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const typing=/^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement&&document.activeElement.tagName);
  if(!typing&&e.key===" "&&!(document.activeElement&&document.activeElement.tagName==="BUTTON"&&!Clock.paused)){e.preventDefault();Clock.toggle();return}
  if(typing)return;
  if(e.key==="r"||e.key==="R"){Voice.replayLine();return}
  if(Clock.paused)return;
  if(view==="watch"&&e.key==="ArrowRight"){const f=$("#fwd"),a=$("#after");if(f&&a&&!a.hidden){e.preventDefault();f.click()}}
  if(view==="exam"&&EX&&!EX.done){
    if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`#opts .opt[data-k="${+e.key-1}"]`);if(b){e.preventDefault();b.click()}return}
    if(e.key==="ArrowRight"){const b=$("#nextq");if(b&&!b.disabled){e.preventDefault();b.click()}return}
    if(e.key==="ArrowLeft"){const b=$("#prev");if(b&&!b.disabled){e.preventDefault();b.click()}return}
    return;
  }
  if(view!=="play")return;
  if(!answered&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-k="${+e.key-1}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}}
  else if(answered&&(e.key==="Enter"||e.key==="ArrowRight")&&document.activeElement&&document.activeElement.id!=="next"){const n=$("#next");if(n){e.preventDefault();n.click()}}
});
mountPlayer();
renderHome();
