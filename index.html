/* Each item: {id, dom, q, options, a (index of the correct option), why, lesson}.
   Options are authored in a fixed order; the exam shuffles them at run time. */
const EXAM_BANK=[

/* ================= Transforming commands & visualizations ================= */
{id:"X-tr1",dom:"transform",lesson:"L4",
 q:"A shift lead asks for the number of events from each sourcetype in the last hour. Which command turns the raw events into that per-sourcetype table?",
 options:["stats count by sourcetype","dedup sourcetype","fields sourcetype","sort sourcetype"],a:0,
 why:"stats count by sourcetype aggregates events into one row per sourcetype with a count — a transforming command that turns events into a results table."},
{id:"X-tr2",dom:"transform",lesson:"I3",
 q:"You want a line chart of failed logins over the night, one point per hour. Which command builds a time series on its own?",
 options:["timechart count span=1h","stats count by _time","chart count over host","top _time"],a:0,
 why:"timechart buckets events by _time automatically (here span=1h) and returns a series ready to plot over time. stats count by _time would not produce even hourly bins."},
{id:"X-tr3",dom:"transform",lesson:"I4",
 q:"You run: ... | chart count over host by action. What does the output look like?",
 options:["One row per host, one column per action value","One row per event","A single number","One row per host only, with no action split"],a:0,
 why:"chart ... over X by Y makes X the rows and each distinct Y value its own column — here a host-by-action matrix of counts."},
{id:"X-tr4",dom:"transform",lesson:"N3",
 q:"An alert needs the count of DISTINCT source IPs per destination, not the raw event count. Which function does that?",
 options:["dc(src_ip)","count(src_ip)","values(src_ip)","sum(src_ip)"],a:0,
 why:"dc() is distinct_count — it counts unique values. count() counts every event; values() lists them rather than counting the distinct ones."},
{id:"X-tr5",dom:"transform",lesson:"N3",
 q:"You want each destination's row to also show the actual list of usernames seen, with duplicates removed. Which function returns that de-duplicated list?",
 options:["values(user)","list(user)","count(user)","latest(user)"],a:0,
 why:"values() returns the set of distinct values (sorted, de-duplicated). list() keeps duplicates and order — the one to avoid when you want a clean set."},
{id:"X-tr6",dom:"transform",lesson:"N3",
 q:"Which stats expression counts only the events where action is \"failure\", in the same row as the total count?",
 options:["count(eval(action=\"failure\")) AS fails","count(action=\"failure\")","where action=\"failure\"","dc(action) AS fails"],a:0,
 why:"count(eval(<condition>)) counts only the rows the condition is true for, and the AS clause is required. A bare count(action=...) is not valid SPL."},
{id:"X-tr7",dom:"transform",lesson:"L4",
 q:"Why is stats called a \"transforming\" command?",
 options:["It transforms events into a results table of statistics","It transforms field names","It transforms the time range","It transforms raw text into JSON"],a:0,
 why:"Transforming commands (stats, chart, timechart, top, rare) turn the stream of events into a summary table — the form a report or visualization is built from."},
{id:"X-tr8",dom:"transform",lesson:"L4",
 q:"A ticket wants the single busiest source address and how many events it sent. Which command is the most direct?",
 options:["top limit=1 src_ip","rare src_ip","dedup src_ip","sort src_ip"],a:0,
 why:"top ranks values by frequency and returns count and percent; limit=1 gives just the busiest. rare returns the least common — the opposite."},
{id:"X-tr9",dom:"transform",lesson:"I3",
 q:"In timechart, what does the span argument control?",
 options:["The width of each time bucket","The total time range of the search","The number of series drawn","The chart's colour palette"],a:0,
 why:"span sets the size of each time bin (span=1h, span=5m, …). The overall range comes from the time picker, not from span."},
{id:"X-tr10",dom:"transform",lesson:"I3",
 q:"You want failed logins over time, drawn as one line per host. Which clause splits the series?",
 options:["timechart count by host","timechart count over host","timechart count span=host","stats count by host"],a:0,
 why:"In timechart, _time is always the x-axis; the by clause splits into one series (column/line) per value of that field. timechart has no over clause."},
{id:"X-tr11",dom:"transform",lesson:"I4",
 q:"What is the key difference between chart and timechart?",
 options:["timechart always uses _time as the x-axis; chart lets you choose any field with over","They are identical","chart only works on numbers","timechart cannot split by a field"],a:0,
 why:"timechart is chart specialised for time: _time is fixed as the x-axis. chart lets you set the x-axis to any field with over."},
{id:"X-tr12",dom:"transform",lesson:"N3",
 q:"A report needs the average response time per host. Which stats function?",
 options:["avg(response_time) by host","mean(host)","sum(response_time)","dc(response_time)"],a:0,
 why:"avg() computes the mean of a numeric field; grouping with by host gives one average per host. sum would total it, dc would count distinct values."},
{id:"X-tr13",dom:"transform",lesson:"L4",
 q:"After ... | top limit=5 user, which columns does top add to the results?",
 options:["count and percent","only count","only percent","sum and avg"],a:0,
 why:"top returns the most common values with both a count and a percent column. rare does the same for the least common."},
{id:"X-tr14",dom:"transform",lesson:"N2",
 q:"You want the rarest user agents in the proxy logs, to spot odd tooling. Which command?",
 options:["rare useragent","top useragent","dedup useragent","sort useragent"],a:0,
 why:"rare returns the least common values — useful for finding the unusual. top would surface the most common instead."},
{id:"X-tr15",dom:"transform",lesson:"N3",
 q:"What is the difference between count and sum(bytes) in stats?",
 options:["count tallies the number of events; sum(bytes) adds up the bytes field's values","They are the same","count adds the bytes; sum counts events","sum only works on strings"],a:0,
 why:"count is how many events; sum(field) totals a numeric field across them. Mixing them up is a classic stats mistake."},

/* ================= Filtering & formatting results ================= */
{id:"X-fi1",dom:"filter",lesson:"L8",
 q:"You have computed a field named duration with eval and want to keep only rows where duration is over 300. Which command filters on that computed field?",
 options:["where duration>300","regex duration>300","dedup duration","fields duration"],a:0,
 why:"where evaluates an expression against fields, including ones you just calculated — the right tool for comparing a computed numeric field."},
{id:"X-fi2",dom:"filter",lesson:"N2",
 q:"The results have many rows per user and you want just the first row for each user. Which command does that?",
 options:["dedup user","dedup user keep=first","nodup user","unique user"],a:0,
 why:"dedup <field> keeps the first event for each distinct value and drops the rest. dedup has no keep option, and nodup/unique are not SPL commands."},
{id:"X-fi3",dom:"filter",lesson:"L5",
 q:"You want the ten events with the largest bytes value, biggest first. Which clause does that?",
 options:["sort - bytes | head 10","sort bytes | head 10","sort - bytes | tail 10","head 10 | sort - bytes"],a:0,
 why:"sort - bytes orders descending (largest first); head 10 then takes the top ten. A leading - means descending; without it sort is ascending."},
{id:"X-fi4",dom:"filter",lesson:"N4",
 q:"To make a search faster and the table tidier, you keep only the three fields you need early. Which command, and which sign keeps fields?",
 options:["fields src_ip, dest_ip, action (keeps them)","fields - src_ip, dest_ip, action (keeps them)","table removes the listed fields","rename keeps the listed fields"],a:0,
 why:"fields <list> keeps only those fields; fields - <list> removes them. Trimming early reduces the data carried down the pipeline."},
{id:"X-fi5",dom:"filter",lesson:"L6",
 q:"What is the practical difference between the table and fields commands?",
 options:["fields keeps/removes fields in the pipeline and keeps internal fields like _time and _raw unless removed; table builds the final display table with only the listed columns, in that order","They are identical","table changes the indexed data","fields cannot remove fields"],a:0,
 why:"fields controls what travels through the pipeline (and keeps internal fields like _time/_raw unless you drop them). table sets the exact display columns and their order. Note: after | table a b, later commands only see a and b."},
{id:"X-fi6",dom:"filter",lesson:"L6",
 q:"A column is named user but the dashboard needs the header to read \"Account\". Which command relabels it in the results?",
 options:["rename user AS Account","eval Account=user","fields Account","table Account"],a:0,
 why:"rename changes a field's name in the result set, including the displayed header. eval=user would copy the value into a second field, not rename the one you have."},
{id:"X-fi7",dom:"filter",lesson:"W1",
 q:"You want events mentioning powershell OR cmd but NOT any from host \"test01\". Which search does that?",
 options:["(powershell OR cmd) NOT host=test01","powershell cmd NOT host=test01","powershell AND cmd AND host!=test01","powershell OR cmd host=test01"],a:0,
 why:"Boolean operators are upper-case; OR between terms, parentheses to group, NOT (or host!=) to exclude. A space between terms means AND, which would wrongly require both words."},
{id:"X-fi8",dom:"filter",lesson:"L3",
 q:"Why is narrowing the time range first such a big help?",
 options:["It is usually the single biggest speed-up, because Splunk reads far fewer events","It only changes the chart, not the speed","It has no effect on performance","It only matters for real-time searches"],a:0,
 why:"Time is the primary index in Splunk. A tight time range is usually the biggest performance win because it limits how many events are scanned at all."},
{id:"X-fi9",dom:"filter",lesson:"I8",
 q:"You want a new field status set to \"error\" when code is 400 or more, otherwise \"ok\". Which eval function?",
 options:["eval status=if(code>=400,\"error\",\"ok\")","eval status=case(code>=400)","eval status=match(code,400)","eval status=coalesce(code,\"error\")"],a:0,
 why:"if(condition, value-if-true, value-if-false) is the two-way branch. case() needs condition/value pairs; it is the choice when there are more than two outcomes."},
{id:"X-fi10",dom:"filter",lesson:"L7",
 q:"You need to map an HTTP code to a band: <300 \"ok\", <400 \"redirect\", else \"error\". Which eval function fits best?",
 options:["case(code<300,\"ok\", code<400,\"redirect\", true(),\"error\")","if(code<300,\"ok\")","coalesce(code)","round(code)"],a:0,
 why:"case() takes condition/value pairs and returns the first match; true() (or 1==1) is the catch-all default. if() handles only a single two-way split."},
{id:"X-fi11",dom:"filter",lesson:"I9",
 q:"A latency field is 0.83742 seconds and the report should show two decimals. Which eval function?",
 options:["round(latency,2)","tostring(latency)","floor(latency)","len(latency)"],a:0,
 why:"round(x, n) rounds to n decimal places. floor would drop the decimals entirely, and tostring only changes the type, not the precision."},
{id:"X-fi12",dom:"filter",lesson:"I2",
 q:"_time is an epoch number and you want a readable \"2016-08-10 21:45\" string. Which eval function?",
 options:["strftime(_time,\"%Y-%m-%d %H:%M\")","strptime(_time,\"%Y-%m-%d\")","tostring(_time,\"duration\")","round(_time)"],a:0,
 why:"strftime turns an epoch number into a formatted string. strptime does the reverse — it parses a string INTO an epoch."},
{id:"X-fi13",dom:"filter",lesson:"I9",
 q:"After stats, some hosts have no value in the fails column and show blank. You want those to read 0. Which command?",
 options:["fillnull value=0 fails","eval fails=0","dedup fails","fields fails"],a:0,
 why:"fillnull replaces null/blank values; value=0 fails sets just that field to 0. Without a field list it fills every field."},
{id:"X-fi14",dom:"filter",lesson:"L8",
 q:"You need rows where the bytes_out field is greater than the bytes_in field — a field compared to another field. Which command can express that?",
 options:["where bytes_out > bytes_in","search bytes_out > bytes_in","search bytes_out=bytes_in","dedup bytes_out"],a:0,
 why:"where compares expressions, so it can compare two fields to each other. The search command matches values and keywords and cannot compare one field against another field."},
{id:"X-fi15",dom:"filter",lesson:"I8",
 q:"You want a field holding the number of characters in the url field. Which eval function?",
 options:["len(url)","mvcount(url)","lower(url)","substr(url,1)"],a:0,
 why:"len() returns the character length of a string. mvcount() counts the values in a multivalue field — a different measure."},
{id:"X-fi16",dom:"filter",lesson:"I8",
 q:"A src_user field has several values in one event (a multivalue field) and you want how many. Which eval function?",
 options:["mvcount(src_user)","len(src_user)","dc(src_user)","mvindex(src_user,0)"],a:0,
 why:"mvcount() returns the number of values in a multivalue field. len() would give a character length, and mvindex() picks one value by position."},

/* ================= Correlating events ================= */
{id:"X-co1",dom:"correlate",lesson:"I11",
 q:"You need each event to show the per-host total next to it, WITHOUT collapsing events into one row per host. Which command adds the aggregate as a new column and keeps every event?",
 options:["eventstats count by host","stats count by host","dedup host","fields host"],a:0,
 why:"eventstats computes the aggregate and writes it back onto every event, so the rows survive. stats would collapse them to one row per host."},
{id:"X-co2",dom:"correlate",lesson:"I12",
 q:"You want a running count that increases event by event in time order (a cumulative total). Which command?",
 options:["streamstats count","eventstats count","stats count","timechart count"],a:0,
 why:"streamstats computes running/cumulative statistics as it walks the events in order. eventstats gives one aggregate for the whole set, not a running value."},
{id:"X-co3",dom:"correlate",lesson:"I13",
 q:"You want to group a user's events into sessions, ending a session after 30 minutes of silence. Which command and option?",
 options:["transaction user maxpause=30m","transaction user maxspan=30m","stats by user","streamstats user"],a:0,
 why:"transaction groups related events; maxpause limits the gap allowed BETWEEN events in a group. maxspan instead caps the total length of the whole group."},
{id:"X-co4",dom:"correlate",lesson:"I15",
 q:"A subsearch is written inside the main search, in square brackets. When does it run and what does it hand back?",
 options:["It runs first, and its results are turned into a filter for the outer search","It runs last, after the outer search","It returns raw events unchanged","It runs once per outer event"],a:0,
 why:"The subsearch executes first; Splunk formats its output (as field=value terms by default) and injects it into the outer search as a filter. That is why subsearches are kept small."},
{id:"X-co5",dom:"correlate",lesson:"I15",
 q:"You already have web results and want to ADD rows from a second search to the bottom, not match them side by side. Which command?",
 options:["append","join","lookup","eventstats"],a:0,
 why:"append tacks a second search's results onto the end as extra rows. join merges on a common field, side by side — a different operation."},
{id:"X-co6",dom:"correlate",lesson:"I16",
 q:"eventstats is ideal when you compare each event against an aggregate of the whole set. Which task fits best?",
 options:["Flag each event whose bytes is above the average bytes for its host","Return one summary row per host","List the ten newest events","Rename a field"],a:0,
 why:"eventstats avg(bytes) by host attaches the per-host average to every event, so a following where bytes>avg keeps the outliers — comparing each event to its group's aggregate."},
{id:"X-co7",dom:"correlate",lesson:"I13",
 q:"transaction with startswith=\"login\" and endswith=\"logout\" does what?",
 options:["Opens a group on a login event and closes it on a logout event","Keeps only login and logout events","Sorts events by login time","Counts logins and logouts"],a:0,
 why:"startswith/endswith define the events that begin and end each transaction, so each group spans one login-to-logout session."},
{id:"X-co8",dom:"correlate",lesson:"I15",
 q:"When joining two datasets on a shared field, which join keeps outer rows that have no match in the second set?",
 options:["join type=left","join type=inner","join type=right","append type=left"],a:0,
 why:"A left join keeps every row from the left (outer) search. An inner join drops unmatched outer rows. (In Splunk type=outer is the same as type=left, and type=right is not supported.)"},
{id:"X-co9",dom:"correlate",lesson:"I12",
 q:"streamstats is given window=5. What does that mean?",
 options:["Each event's statistic is computed over itself and the previous 4 events","It keeps only 5 events","It waits 5 seconds","It splits the data into 5 groups"],a:0,
 why:"window=N limits streamstats to a sliding window of the last N events, so you get moving statistics (e.g. a 5-event moving average) rather than a full running total."},
{id:"X-co10",dom:"correlate",lesson:"I11",
 q:"What is the core difference between eventstats and streamstats?",
 options:["eventstats gives the same whole-set aggregate on every event; streamstats accumulates as it streams, so each event sees only events up to it","They are identical","streamstats collapses rows; eventstats keeps them","eventstats only works on _time"],a:0,
 why:"Both keep every event, but eventstats is order-independent (one aggregate for the whole set), while streamstats is cumulative/windowed in event order."},
{id:"X-co11",dom:"correlate",lesson:"I13",
 q:"transaction has maxspan=1h. What does maxspan limit?",
 options:["The total time from a group's first event to its last","The pause allowed between two events","The number of events per group","The search's time range"],a:0,
 why:"maxspan caps how long one whole transaction may last end to end. maxpause caps the gap between consecutive events — a different limit."},
{id:"X-co12",dom:"correlate",lesson:"I15",
 q:"Two searches return one row each with different columns and you want them side by side in a single row. Which command?",
 options:["appendcols","append","join","stats"],a:0,
 why:"appendcols adds a subsearch's columns to existing rows by position. append would stack them as separate rows instead."},
{id:"X-co13",dom:"correlate",lesson:"I16",
 q:"A junior writes a join to correlate two sourcetypes, but it is slow and drops rows past the join limit. What is the usual better approach when both sets share a key?",
 options:["Search both sourcetypes together and use stats by the shared key","Add more joins","Use dedup instead","Use fillnull"],a:0,
 why:"When events share a key, one search over both sourcetypes with stats ... by <key> correlates them without join's row cap or performance cost — the idiomatic Splunk pattern."},
{id:"X-co14",dom:"correlate",lesson:"I15",
 q:"By default, what does a subsearch hand to the outer search?",
 options:["Its results formatted as field=value terms, OR-ed together, as a filter","The raw events","A single number","Nothing until the outer search finishes"],a:0,
 why:"By default a subsearch's rows are turned into (field=value AND …) OR (…) terms and injected into the outer search. return or format can change that output."},

/* ================= Creating & managing fields ================= */
{id:"X-fd1",dom:"fields",lesson:"I5",
 q:"A log line ends with user=rsmith and you need user as its own field for this search only. Which command extracts it with a named capture?",
 options:["rex \"user=(?<user>\\w+)\"","spath user","eval user=_raw","lookup user"],a:0,
 why:"rex with a named capture group (?<name>...) pulls a value out of text into a field at search time. spath is for structured JSON/XML, not a flat log line."},
{id:"X-fd2",dom:"fields",lesson:"K1",
 q:"What is the key difference between a search-time field extraction and an index-time one?",
 options:["Search-time extractions apply when you search and don't change what's stored; index-time changes the indexed data permanently","They are the same","Search-time is faster to change but cannot be reused","Index-time runs only in Pivot"],a:0,
 why:"Splunk favours search-time extraction: the raw data is untouched and the extraction can be edited any time. Index-time changes are permanent and far harder to adjust — used sparingly."},
{id:"X-fd3",dom:"fields",lesson:"I7",
 q:"An event's _raw is JSON like {\"src\":{\"ip\":\"10.0.0.5\"}}. Which command pulls the nested ip into a field?",
 options:["spath path=src.ip","rex \"ip\"","eval ip=src","dedup ip"],a:0,
 why:"spath parses structured JSON/XML and addresses nested values with dotted paths like src.ip. rex would be the clumsy choice for well-formed JSON."},
{id:"X-fd4",dom:"fields",lesson:"I6",
 q:"If you write rex without field=..., which field does it run against by default?",
 options:["_raw","_time","source","the first extracted field"],a:0,
 why:"rex runs on _raw unless you point it at another field with field=<name>. That is why rex on raw log lines needs no field= clause."},
{id:"X-fd5",dom:"fields",lesson:"K1",
 q:"The Field Extractor can build an extraction from a delimiter. When is the delimiter method the right fit?",
 options:["When values are separated by a consistent character, like CSV columns","When the data is free-form prose","When fields are already JSON","When you need an index-time change"],a:0,
 why:"Delimiter-based extraction splits on a repeated separator (comma, tab, pipe). For structured-but-irregular text you'd use a regex extraction instead."},
{id:"X-fd6",dom:"fields",lesson:"I6",
 q:"A single event contains several id=... pairs and you want ALL of them captured, not just the first. Which rex option?",
 options:["max_match=0","mode=sed","max_match=1","offset_field"],a:0,
 why:"max_match controls how many matches rex keeps; max_match=0 means unlimited, producing a multivalue field of every match. The default is 1 (first only)."},
{id:"X-fd7",dom:"fields",lesson:"I5",
 q:"rex with mode=sed is used to do what?",
 options:["Substitute or mask text in a field (like s/old/new/)","Create a lookup","Sort events","Join two searches"],a:0,
 why:"mode=sed makes rex behave like sed — s/pattern/replacement/ to rewrite or redact a field's value (handy for masking tokens)."},
{id:"X-fd8",dom:"fields",lesson:"K1",
 q:"A teammate asks why their new field extraction isn't visible to others. What is the most likely cause?",
 options:["Its permissions are private (owner only), not shared to the app or all users","The regex is invalid","The index is wrong","Search-time extractions can't be shared"],a:0,
 why:"An extraction is a knowledge object with permissions. Created private, only its owner sees it until it is shared to the app or globally."},
{id:"X-fd9",dom:"fields",lesson:"K1",
 q:"You have a few example values of a token but don't want to write regex by hand. Which tool builds the extraction from your examples?",
 options:["erex","rex mode=sed","spath","multikv"],a:0,
 why:"erex takes example values (examples=\"...\") and generates the regex for you — the example-based alternative to writing the pattern by hand."},
{id:"X-fd10",dom:"fields",lesson:"I5",
 q:"What is the difference between a named and an unnamed capture group in rex?",
 options:["A named group (?<name>...) creates a field called name; an unnamed group (...) just groups without creating a field","They both create fields","Unnamed groups are faster fields","Named groups only work at index time"],a:0,
 why:"Only named groups (?<field>...) produce fields. Plain parentheses group the pattern (for alternation or quantifiers) without extracting anything."},
{id:"X-fd11",dom:"fields",lesson:"K1",
 q:"Events are plain key=value text like src=10.0.0.5 action=blocked. What usually extracts these fields automatically, with no rex?",
 options:["Automatic key-value (KV) field discovery at search time","A lookup","A data model","A workflow action"],a:0,
 why:"Splunk auto-extracts obvious key=value pairs at search time (KV_MODE), so well-formed key=value logs give you fields with no explicit extraction."},
{id:"X-fd12",dom:"fields",lesson:"K9",
 q:"In the fields sidebar, what is the difference between \"selected\" and \"interesting\" fields?",
 options:["Selected fields show under every event; interesting fields appear in most events but aren't shown by default","Interesting fields are index-time only","Selected fields are faster","They are the same list"],a:0,
 why:"Selected fields are the ones pinned below each event; interesting fields are those Splunk found in a large share of events but doesn't display until you select them."},
{id:"X-fd13",dom:"fields",lesson:"I7",
 q:"Which command is purpose-built to parse structured XML or JSON, as opposed to arbitrary text?",
 options:["spath","rex","erex","regex"],a:0,
 why:"spath understands the structure of XML/JSON and lets you address nested paths. rex/erex/regex operate on raw text patterns, which is clumsy for structured data."},
{id:"X-fd14",dom:"fields",lesson:"K1",
 q:"Why does Splunk recommend search-time extraction over index-time extraction in most cases?",
 options:["It keeps the raw data intact and the extraction can be changed any time without re-indexing","It is the only kind that produces fields","Index-time extraction is not supported","Search-time fields can't be shared"],a:0,
 why:"Search-time extractions are flexible — edit or add them any time, no re-indexing, raw data untouched. Index-time changes are permanent and costly, so they're reserved for special cases."},

/* ================= Field aliases & calculated fields ================= */
{id:"X-ca1",dom:"calc",lesson:"K2",
 q:"One sourcetype calls the user field user_name and another calls it username. You want both to answer to a single CIM name, user, automatically. Which knowledge object?",
 options:["A field alias","A calculated field","A search-time rename","A lookup"],a:0,
 why:"A field alias maps an existing field to another name automatically at search time — the standard way to normalise differing field names to a CIM field like user. rename only works inside one search."},
{id:"X-ca2",dom:"calc",lesson:"K2",
 q:"You want a field that is ALWAYS present, computed from an eval expression, without typing eval in every search. Which knowledge object?",
 options:["A calculated field","A field alias","A tag","An event type"],a:0,
 why:"A calculated field stores an eval expression that Splunk applies automatically, so the derived field appears in every search without re-typing the eval."},
{id:"X-ca3",dom:"calc",lesson:"K2",
 q:"How does a field alias differ from the rename command?",
 options:["An alias is a saved knowledge object applied automatically to every matching search; rename only affects the single search it's in","They are identical","rename is permanent; an alias is temporary","An alias changes the indexed data"],a:0,
 why:"A field alias is configured once and applies to every matching search automatically. rename is a one-off command whose effect ends with that search."},
{id:"X-ca4",dom:"calc",lesson:"K2",
 q:"A calculated field bytes_total should be bytes_in + bytes_out, but some events lack bytes_out. Which eval expression defines it robustly?",
 options:["coalesce(bytes_in,0) + coalesce(bytes_out,0)","bytes_in + bytes_out","bytes_in","tostring(bytes_in)"],a:0,
 why:"A calculated field is defined by the eval expression alone (no leading eval name=). coalesce substitutes 0 for a missing side, so a null doesn't make the whole sum null."},
{id:"X-ca5",dom:"calc",lesson:"K2",
 q:"An automatic lookup does what?",
 options:["Applies a lookup table to every search automatically, enriching events without a lookup command","Runs a search on a schedule","Replaces field extraction","Builds a dashboard"],a:0,
 why:"An automatic lookup is a lookup configured to fire on every search for a sourcetype, so enrichment fields (like a category for an IP) appear without typing | lookup."},
{id:"X-ca6",dom:"calc",lesson:"K2",
 q:"After you alias src_ip to src, what happens to the original field name?",
 options:["Both src_ip and src work; the alias adds the new name, it doesn't remove the old","src_ip disappears","Only src_ip works","The raw data is rewritten"],a:0,
 why:"A field alias is additive — the original field still works and the new name is available too. Nothing is removed or rewritten."},
{id:"X-ca7",dom:"calc",lesson:"K2",
 q:"When is a calculated field evaluated?",
 options:["At search time, automatically, after fields are extracted","At index time, once","Only when you type eval","Only inside Pivot"],a:0,
 why:"Calculated fields run at search time on every search, after extraction, so the derived field is ready without an explicit eval."},
{id:"X-ca8",dom:"calc",lesson:"K2",
 q:"You keep typing the same eval in dozens of searches to derive a field. What should you create instead?",
 options:["A calculated field, so the derived field is always present","A dashboard","A workflow action","A new index"],a:0,
 why:"A calculated field turns a repeated inline eval into a knowledge object — define it once and the field appears automatically everywhere."},
{id:"X-ca9",dom:"calc",lesson:"K2",
 q:"To make varied sources fit the CIM, which pair of knowledge objects most directly normalises field NAMES and VALUES?",
 options:["Field aliases (rename fields to CIM names) and calculated/eval fields (derive CIM values)","Dashboards and reports","Macros and workflow actions","Indexes and sourcetypes"],a:0,
 why:"CIM normalisation leans on aliases to give fields the standard names (src, dest, user) and calculated fields/evals to produce standard values — the groundwork for data models."},
{id:"X-ca10",dom:"calc",lesson:"K2",
 q:"In what order does Splunk apply these at search time: field aliases and calculated fields?",
 options:["Aliases first, then calculated fields — so a calculated field can reference an aliased field","Calculated fields first, then aliases","They apply at the same moment","Neither applies automatically"],a:0,
 why:"The search-time order is extractions, then aliases, then calculated fields, then lookups. So a calculated field can use an alias, but an alias cannot use a calculated field."},
{id:"X-ca11",dom:"calc",lesson:"K2",
 q:"A calculated field severity is defined from an existing field code. What must be true about code?",
 options:["code must already be available (extracted or aliased) when the calculated field runs","code must be index-time only","code must be a lookup","code must be in _raw as JSON"],a:0,
 why:"Calculated fields run after extraction and aliasing, so any field they reference (like code) must already exist by then. They can't use fields created later in the order."},

/* ================= Tags & event types ================= */
{id:"X-tg1",dom:"tags",lesson:"K3",
 q:"An analyst wants to label many firewall-block values (deny, drop, reject) so one search term finds them all. Which knowledge object fits?",
 options:["A tag","A calculated field","A macro","A data model"],a:0,
 why:"A tag is a label on a field=value pair; tagging deny, drop and reject as \"blocked\" lets you search tag=blocked across them all."},
{id:"X-tg2",dom:"tags",lesson:"K3",
 q:"What exactly is an event type?",
 options:["A saved search definition that categorises every event matching it","A label on one field value","A visualization","A lookup table"],a:0,
 why:"An event type is a category defined by a search string. Any event matching that search gets eventtype=<name>, so you can reuse the classification everywhere."},
{id:"X-tg3",dom:"tags",lesson:"K3",
 q:"You tagged several values as \"authentication\". Which search uses that tag?",
 options:["tag=authentication","eventtype=authentication","authentication=true","is authentication"],a:0,
 why:"Tags are searched with tag=<name> (or tag::<field>=<name> to scope to a field). eventtype= is for event types, a different object."},
{id:"X-tg4",dom:"tags",lesson:"K3",
 q:"How do event types and tags often work together?",
 options:["Events are classified by an event type, and the event type is then tagged so broad tag searches find it","Tags replace event types","Event types can't be tagged","They are unrelated"],a:0,
 why:"A common pattern (and how the CIM is built) is to define event types, then tag them — e.g. tag an \"auth success\" event type with authentication and success."},
{id:"X-tg5",dom:"tags",lesson:"K3",
 q:"Why are tags and event types central to the Common Information Model?",
 options:["CIM data models constrain on tags/event types, so normalised tagging makes data fit the models","They make dashboards colourful","They speed up indexing","They are required for lookups"],a:0,
 why:"CIM data models select their events using constraints like tag=authentication. Consistent tagging is what lets varied sources populate a shared model."},
{id:"X-tg6",dom:"tags",lesson:"K3",
 q:"A tag is best described as applying to what?",
 options:["A specific field=value pair","An entire index","A time range","A whole sourcetype only"],a:0,
 why:"A tag attaches to a field/value pair (e.g. action=blocked). That precision is what makes tag-based searching meaningful."},
{id:"X-tg7",dom:"tags",lesson:"K3",
 q:"You want to find events tagged \"privileged\" but only when it's the user field that carries the tag. Which syntax scopes a tag to a field?",
 options:["tag::user=privileged","tag=user:privileged","user.tag=privileged","tag(user)=privileged"],a:0,
 why:"tag::<field>=<value> restricts the tag search to a specific field, so you match only where the tag is on that field, not any field."},
{id:"X-tg8",dom:"tags",lesson:"K3",
 q:"Can an event type definition contain a transforming command, such as | stats count?",
 options:["No — an event type is a base search only; it can't contain a pipe to a command","Yes, any search is allowed","Only timechart is allowed","Only if it is accelerated"],a:0,
 why:"Event types classify events, so they are search terms without transforming commands. You can't define one as a search that aggregates with stats, chart, etc."},
{id:"X-tg9",dom:"tags",lesson:"K3",
 q:"Once an event type named failed_login exists, how do you search for those events?",
 options:["eventtype=failed_login","tag=failed_login","failed_login()","type::failed_login"],a:0,
 why:"Event types are matched with eventtype=<name>. tag= is for tags; the other forms aren't valid SPL."},
{id:"X-tg10",dom:"tags",lesson:"K3",
 q:"What is the main benefit of classifying events with event types rather than retyping the search each time?",
 options:["The classification is reusable everywhere and stays consistent as the underlying search evolves in one place","It indexes data faster","It replaces field extraction","It encrypts the events"],a:0,
 why:"An event type is a single, named definition. Reuse it across searches, dashboards and models, and update the logic in one place."},
{id:"X-tg11",dom:"tags",lesson:"K3",
 q:"Several products log authentication differently. How do tags help a single detection cover them all?",
 options:["Tagging each product's auth events with the same tag lets one tag=... search span every product","Tags rename the index","Tags change the sourcetype","Tags accelerate the search"],a:0,
 why:"A shared tag is a common label across sources. One tag-based search (or a CIM model constrained on the tag) then covers every product without per-product logic."},

/* ================= Macros ================= */
{id:"X-ma1",dom:"macros",lesson:"K4",
 q:"The team re-types the same long eval-and-stats fragment in dozens of searches. Which knowledge object lets them define it once and reuse it?",
 options:["A search macro","An event type","A field alias","A workflow action"],a:0,
 why:"A macro stores a reusable chunk of SPL under a name. Change the macro once and every search that calls it updates — the DRY tool for SPL."},
{id:"X-ma2",dom:"macros",lesson:"K4",
 q:"How do you call a macro named daily_auth inside a search?",
 options:["`daily_auth`","$daily_auth$","{daily_auth}","daily_auth()"],a:0,
 why:"Macros are invoked inside backticks: `daily_auth`. The $...$ form is for tokens/workflow variables, not macro calls."},
{id:"X-ma3",dom:"macros",lesson:"K4",
 q:"A macro takes one argument. How is it defined and called?",
 options:["Defined as mymacro(1); called `mymacro(600)`","Defined as mymacro; called `mymacro 600`","Defined as mymacro[1]; called `mymacro=600`","Arguments are not supported"],a:0,
 why:"The number of arguments is part of the macro's name, e.g. mymacro(1). You call it with the value in parentheses inside backticks: `mymacro(600)`."},
{id:"X-ma4",dom:"macros",lesson:"K4",
 q:"Inside a macro you can add an eval-style validation on an argument. What is that for?",
 options:["Checking arguments are valid (e.g. numeric) before the macro expands, with a clear error if not","Scheduling the macro","Giving the macro a colour","Turning the macro into a lookup"],a:0,
 why:"Validation expressions let a macro reject bad arguments with a message, so a mistyped parameter fails clearly instead of producing a broken search."},
{id:"X-ma5",dom:"macros",lesson:"K4",
 q:"Where are search macros created in Splunk Web?",
 options:["Settings > Advanced search > Search macros","Settings > Lookups","The Pivot editor","The time range picker"],a:0,
 why:"Macros live under Settings > Advanced search > Search macros (backed by macros.conf). Knowing where to manage them is part of the Power User blueprint."},
{id:"X-ma6",dom:"macros",lesson:"K4",
 q:"What is the main benefit of pushing a complex detection into a macro?",
 options:["One edit updates every search and dashboard that uses it","It always runs faster than inline SPL","It hides the SPL from auditors","It removes the need for field extractions"],a:0,
 why:"A macro is a single source of truth — consistency and one-place maintenance are the point. It does not change search performance by itself."},
{id:"X-ma7",dom:"macros",lesson:"K4",
 q:"When does Splunk substitute a macro's definition into your search?",
 options:["Before the search runs — the macro text is expanded into the search at parse time","After the results come back","Only in scheduled searches","Never; macros run as a separate job"],a:0,
 why:"Macros are expanded at parse time: the backticked call is replaced by its SPL before execution, so a macro is just a text substitution, not a separate run."},
{id:"X-ma8",dom:"macros",lesson:"K4",
 q:"How is a macro different from a saved search (report)?",
 options:["A macro is a reusable fragment you paste into other searches; a saved search is a complete search you run or schedule on its own","They are the same","A macro can be scheduled; a report cannot","A report cannot be shared"],a:0,
 why:"A macro is a building block inserted into other searches. A saved search/report is a whole search that runs by itself and can be scheduled or alerted on."},
{id:"X-ma9",dom:"macros",lesson:"K4",
 q:"In a macro's definition, how do you reference an argument named threshold?",
 options:["$threshold$","`threshold`","{threshold}","@threshold"],a:0,
 why:"Inside the macro definition, arguments are written as $argname$. The backtick form is how you call a macro, not how you use its argument."},
{id:"X-ma10",dom:"macros",lesson:"K4",
 q:"A macro named base_index takes no arguments. How is it called?",
 options:["`base_index`","`base_index()`","`base_index(0)`","base_index"],a:0,
 why:"A zero-argument macro is called by name in backticks with no parentheses: `base_index`. Parentheses are only for passing arguments."},
{id:"X-ma11",dom:"macros",lesson:"K4",
 q:"Can a macro contain an entire multi-command search, including pipes to stats or eval?",
 options:["Yes — a macro can hold any SPL, including pipes and transforming commands","No, macros are single terms only","No, macros can't contain eval","Only if it has no arguments"],a:0,
 why:"Unlike an event type (which is a base search only), a macro can hold any stretch of SPL, pipes and transforming commands included."},

/* ================= Workflow actions ================= */
{id:"X-wf1",dom:"workflow",lesson:"K4",
 q:"You want analysts to click a src_ip in an event and jump to an external reputation site for that IP. Which knowledge object provides that click action?",
 options:["A workflow action","A macro","A tag","A calculated field"],a:0,
 why:"Workflow actions add links to the event/field menu — opening a URL or launching a secondary search using the clicked field's value."},
{id:"X-wf2",dom:"workflow",lesson:"K4",
 q:"In a workflow action's target, how do you insert the clicked field's value, e.g. the IP?",
 options:["$src_ip$","`src_ip`","%src_ip%","&src_ip"],a:0,
 why:"Workflow actions use $fieldname$ tokens. When the analyst clicks, Splunk substitutes the event's value for that field into the URL or search."},
{id:"X-wf3",dom:"workflow",lesson:"K4",
 q:"Which of these is a valid type of workflow action?",
 options:["A secondary search that runs using the field value","A scheduled report","A data model acceleration","A field alias"],a:0,
 why:"Workflow actions come in two kinds: link actions (GET/POST to a URL) and search actions (run a secondary search built from the field value)."},
{id:"X-wf4",dom:"workflow",lesson:"K4",
 q:"You want a workflow action to appear only on events that have a src_ip field. How is that controlled?",
 options:["By scoping the action to that field (and/or event type)","It always appears on every event","By the time range","By a macro argument"],a:0,
 why:"Workflow actions can be restricted to apply only when a given field (or event type) is present, so the menu item shows up only where it makes sense."},
{id:"X-wf5",dom:"workflow",lesson:"K4",
 q:"A link-type workflow action can open a URL using which HTTP methods?",
 options:["GET or POST","Only GET","Only POST","FTP"],a:0,
 why:"Link workflow actions support GET and POST, letting you append the field value to a URL (GET) or send it in a POST body to another system."},
{id:"X-wf6",dom:"workflow",lesson:"K4",
 q:"A search-type workflow action is clicked on a field. What does it do?",
 options:["Runs a new secondary search built from the clicked field's value","Exports the event to CSV","Deletes the event","Edits the field alias"],a:0,
 why:"A search workflow action launches another search, inserting the clicked field's value (via $field$), so an analyst can pivot from one event into related events."},
{id:"X-wf7",dom:"workflow",lesson:"K4",
 q:"Where can a workflow action be made to appear?",
 options:["In the action menu of an event and/or specific fields in search results","Only on the home page","Only in Settings","Only inside dashboards' source code"],a:0,
 why:"Workflow actions surface in the drop-down for an event or for particular fields in the events list, which is how analysts trigger them while reading results."},
{id:"X-wf8",dom:"workflow",lesson:"K4",
 q:"For a GET link workflow action, how is the field value typically used?",
 options:["It is placed into the URL via a $field$ token, e.g. https://rep.example/ip?q=$src_ip$","It is emailed to the analyst","It is written back to the index","It becomes a new sourcetype"],a:0,
 why:"A GET link builds a URL with $field$ tokens substituted, so clicking opens that site with the event's value already filled in as a parameter."},
{id:"X-wf9",dom:"workflow",lesson:"K4",
 q:"Besides a field, what else can a workflow action's scope be limited by?",
 options:["An event type","The time of day","The user's rank","The index size"],a:0,
 why:"Scope can be narrowed by field name and by event type, so an action only appears on the events it's relevant to."},
{id:"X-wf10",dom:"workflow",lesson:"K4",
 q:"Why use a workflow action instead of telling analysts to copy a value and paste it elsewhere?",
 options:["It is one click, consistent, and carries the value automatically, reducing error","It indexes faster","It changes the raw data","It replaces the need for lookups"],a:0,
 why:"A workflow action standardises a common pivot into a single click with the value pre-filled — fewer mistakes and a faster, repeatable triage step."},
{id:"X-wf11",dom:"workflow",lesson:"K4",
 q:"A workflow action and a calculated field are often confused. Which statement is correct?",
 options:["A workflow action is an interactive link/search triggered by a click; a calculated field silently derives a field value at search time","They are the same thing","A workflow action derives field values","A calculated field opens external URLs"],a:0,
 why:"They solve different problems: a workflow action is a user-triggered pivot (link or search), while a calculated field automatically computes a field. Neither does the other's job."},

/* ================= Data models & Pivot ================= */
{id:"X-dm1",dom:"datamodel",lesson:"K7",
 q:"A non-SPL manager wants to build their own reports by picking fields from menus. Which Splunk feature, backed by a data model, lets them do that?",
 options:["Pivot","The search bar","A macro","A workflow action"],a:0,
 why:"Pivot provides a point-and-click report builder on top of a data model, so users who don't write SPL can still produce tables and charts."},
{id:"X-dm2",dom:"datamodel",lesson:"K7",
 q:"What is a data model, in one line?",
 options:["A hierarchical, structured mapping of your data into datasets that Pivot and tstats can use","A saved search","A dashboard panel","A lookup table"],a:0,
 why:"A data model organises data into a tree of datasets (objects) with fields and constraints — the schema Pivot explores and tstats accelerates against."},
{id:"X-dm3",dom:"datamodel",lesson:"K7",
 q:"Why would you accelerate a data model?",
 options:["To build a summary so tstats/Pivot searches over it run far faster","To change the raw events","To share it with other apps","To add new fields automatically"],a:0,
 why:"Acceleration builds a high-performance summary of the model's fields. tstats (and Pivot) then read the summary instead of raw events — much faster over large data."},
{id:"X-dm4",dom:"datamodel",lesson:"K7",
 q:"A data model dataset has a constraint tag=authentication. What does the constraint do?",
 options:["Defines which events belong to that dataset","Renames the dataset","Sets the acceleration period","Adds a calculated field"],a:0,
 why:"A constraint is the search that selects the events in a dataset — here, everything tagged authentication. Child datasets add further constraints to narrow it."},
{id:"X-dm5",dom:"datamodel",lesson:"K7",
 q:"In a data model tree, how do root (parent) and child datasets relate?",
 options:["A child inherits the parent's constraints and fields, then narrows further, so it is always a subset","They are unrelated","A child is always faster than its root","Children cannot add constraints"],a:0,
 why:"Datasets are hierarchical: a child starts from the parent's events and fields and adds its own constraints, so it is always a subset of the parent."},
{id:"X-dm6",dom:"datamodel",lesson:"K7",
 q:"Why ship with Splunk's prebuilt CIM data models rather than always building your own?",
 options:["They give a ready, standard schema (Authentication, Network Traffic, …) that normalised data drops straight into","They index data faster","They replace lookups","They are the only models tstats can read"],a:0,
 why:"The CIM add-on provides vetted, standard models. If your data is CIM-normalised (right tags and field names), it populates them immediately — no modelling from scratch."},
{id:"X-dm7",dom:"datamodel",lesson:"K7",
 q:"Which is one of the dataset (object) types you can add to a data model?",
 options:["An event dataset (defined by a constraint search)","A dashboard dataset","A macro dataset","A workflow dataset"],a:0,
 why:"Data model datasets come as event, search, and transaction types. There are no dashboard/macro/workflow dataset types."},
{id:"X-dm8",dom:"datamodel",lesson:"K7",
 q:"In Pivot, what do \"split rows / split columns\" and the cell value correspond to in SPL terms?",
 options:["Split rows/columns are the by fields and the cell value is the stats function","They are the index and sourcetype","They set the time range","They are field extractions"],a:0,
 why:"Pivot is a GUI over stats-style aggregation: splits map to the grouping (by) fields and the cell value is the aggregation (count, sum, avg …)."},
{id:"X-dm9",dom:"datamodel",lesson:"K7",
 q:"When you accelerate a data model, what do you also set?",
 options:["A summary range — how far back the acceleration summary is built and kept","The index's retention","The number of Pivot users","The dashboard refresh rate"],a:0,
 why:"Acceleration has a summary range (e.g. 7 days, 1 month). Searches within that range hit the fast summary; beyond it they fall back to raw data."},
{id:"X-dm10",dom:"datamodel",lesson:"K8",
 q:"Besides tstats and Pivot, which command runs a search directly against a data model's datasets?",
 options:["| datamodel","| pivot only","| lookup","| rex"],a:0,
 why:"The datamodel command (| datamodel <model> <dataset> search) queries a model's events directly, without acceleration. tstats is the accelerated, faster path."},
{id:"X-dm11",dom:"datamodel",lesson:"K7",
 q:"A data model field can be auto-extracted, or defined as which other kinds?",
 options:["eval, lookup, regular-expression, and geo-IP fields","index and sourcetype fields","dashboard and report fields","macro and tag fields"],a:0,
 why:"Model fields can be auto-extracted or built from eval expressions, lookups, regex, or geo-IP — giving the model richer attributes than the raw events alone."},
{id:"X-dm12",dom:"datamodel",lesson:"K7",
 q:"Who most benefits from Pivot?",
 options:["People who need reports and dashboards but don't write SPL","Only Splunk admins","Only the indexing tier","Only REST API users"],a:0,
 why:"Pivot's whole purpose is to let non-SPL users build reports and visualizations from a curated data model, widening who can self-serve analytics."},
{id:"X-dm13",dom:"datamodel",lesson:"K10",
 q:"Your data model's Authentication dataset returns nothing for a new log source you just onboarded. What is the most likely reason?",
 options:["That source isn't normalised yet — missing the tags/field names the model's constraints require","The model is accelerated","Pivot is disabled","The time picker is set to All time"],a:0,
 why:"A model only includes events that satisfy its constraints (e.g. tag=authentication with CIM fields). Un-normalised data simply doesn't match, so it's absent until you normalise it."},

/* ================= CIM & tstats ================= */
{id:"X-ci1",dom:"cim",lesson:"K10",
 q:"Firewall, proxy and DNS logs all name the source address differently. Your correlation search needs one field across all three. What makes that possible?",
 options:["The Common Information Model normalises them to a shared field name like src","A bigger time range","A faster index","A workflow action"],a:0,
 why:"The CIM defines standard field names (src, dest, user, action, …). Once each source is normalised to the CIM, one search spans them all."},
{id:"X-ci2",dom:"cim",lesson:"K8",
 q:"Why is tstats so much faster than stats for big searches over an accelerated data model?",
 options:["It reads precomputed indexed/summary values instead of scanning raw events","It uses more CPU","It skips the time range","It only works on small data"],a:0,
 why:"tstats operates on indexed fields and data-model acceleration summaries (tsidx), so it answers from compact precomputed data rather than reading every raw event."},
{id:"X-ci3",dom:"cim",lesson:"K8",
 q:"Which is a correctly shaped tstats search over an accelerated model?",
 options:["| tstats count from datamodel=Authentication by Authentication.action","tstats count datamodel=Authentication","| stats count from datamodel=Authentication","| tstats datamodel=Authentication | count"],a:0,
 why:"tstats leads the search (a generating command, so it starts with the pipe) and takes from datamodel=<name>; model fields are referenced as <Dataset>.<field>."},
{id:"X-ci4",dom:"cim",lesson:"K8",
 q:"A tstats search returns nothing, but the raw data clearly exists. You used summariesonly=t. What is the likely cause?",
 options:["The data model isn't accelerated (or the summary hasn't built), so there is no summary to read","tstats can't count","The time range is wrong by definition","summariesonly has no effect"],a:0,
 why:"summariesonly=t restricts tstats to the acceleration summary only. If the model isn't accelerated (or hasn't backfilled), there is nothing to return."},
{id:"X-ci5",dom:"cim",lesson:"K10",
 q:"What has to be true about your data before a CIM data model will return it?",
 options:["It must be normalised — correct tags/event types and CIM field names","It must be in a single index","It must be JSON","It must be real-time"],a:0,
 why:"CIM models constrain on tags/event types and expect CIM field names. Un-normalised data won't satisfy the constraints, so the model stays empty for it."},
{id:"X-ci6",dom:"cim",lesson:"K10",
 q:"Your SOC wants one authentication dashboard that works no matter which product sent the logs. Which approach is the CIM way?",
 options:["Normalise each source to the Authentication model, then build on that model","Write a separate search per product","Rename fields in every dashboard panel","Use top on raw events"],a:0,
 why:"Normalise once to the CIM Authentication model; every dashboard and detection then reads the model and automatically covers any onboarded source."},
{id:"X-ci7",dom:"cim",lesson:"K8",
 q:"tstats can run against which kinds of data?",
 options:["Indexed fields and accelerated data-model summaries","Only lookups","Only raw _raw text","Only real-time searches"],a:0,
 why:"tstats works over indexed fields (like sourcetype, host, source) and over data-model acceleration summaries — both stored in the time-series index files."},
{id:"X-ci8",dom:"cim",lesson:"K10",
 q:"Which of these is a standard CIM field name you'd expect across normalised sources?",
 options:["action (e.g. success, failure, allowed, blocked)","act_result_code_final","the_action_taken","a1"],a:0,
 why:"The CIM uses short, standard names like src, dest, user, action, bytes. Vendor-specific names are aliased to these so searches are portable."},
{id:"X-ci9",dom:"cim",lesson:"K8",
 q:"In tstats, what does the by clause do?",
 options:["Groups the counts by the listed fields, like stats' by","Filters events","Sets the time span","Renames the model"],a:0,
 why:"Just like stats, tstats ... by <fields> groups the results. where in tstats filters on indexed/model fields; by groups them."},
{id:"X-ci10",dom:"cim",lesson:"K8",
 q:"You want tstats results to feed a following timechart. Which option prepares the partial statistics for that?",
 options:["prestats=t","summariesonly=t","append=t","allow_old_summaries only"],a:0,
 why:"prestats=t makes tstats emit partial-stats output that a following chart/timechart/stats can finish — the pattern for charting accelerated data."},
{id:"X-ci11",dom:"cim",lesson:"K10",
 q:"What does the CIM add-on actually provide?",
 options:["Prebuilt data models plus the tags/event types and field definitions used to normalise data to them","A faster indexer","A new search language","A replacement for lookups"],a:0,
 why:"The Splunk CIM add-on ships the standard data models and the supporting knowledge objects (tags, event types, field definitions) that data is normalised against."},
{id:"X-ci12",dom:"cim",lesson:"K8",
 q:"Why do Enterprise Security correlation searches lean on tstats over accelerated models?",
 options:["They must scan huge volumes quickly, and tstats over summaries is far faster than raw stats","tstats is the only command ES allows","tstats changes the raw data","raw searches can't use by clauses"],a:0,
 why:"ES runs many detections over large data on a schedule. tstats against accelerated CIM models gives the speed that raw-event stats searches couldn't sustain."},
{id:"X-ci13",dom:"cim",lesson:"K8",
 q:"What is the trade-off between the tstats and datamodel commands?",
 options:["tstats over an accelerated model is fast but summary-bound; | datamodel searches raw model events (slower, but not limited to the summary)","They are identical","datamodel is always faster","tstats cannot use data models"],a:0,
 why:"tstats reads acceleration summaries for speed; the datamodel command runs against the model's raw events, which is slower but not confined to what the summary covers."}

];

/* ============================ Capstone investigations ============================
   Graduation exercises on the Alert Desk's day of data (DATASETS.desk). Unlike the
   Alert Desk drills, these are graded on FINDINGS, not on SPL: the learner investigates
   however they like and answers questions a real incident raises. Any search path that
   reaches the answer counts; nothing checks how the search is written.

   Gate rules honoured:
   - Every finding is reachable with taught commands (search, stats count/dc/sum/values,
     eval round/strftime, where, dedup, sort, table, top, lookup). No iplocation is needed
     (it isn't taught), so geo-only answers are avoided.
   - Findings are FRESH: they don't repeat values the Alert Desk hands out or names in its
     task text, and every case has at least one "rule this out" finding (the SOC skill of
     telling an attack from noise). Graded on value, lenient, with a why and a hint each.
   - Situational briefs; firewall fields are srcip / dstip / dstport.
   Unlocks after the Station 3 boss (I16), so lookups (I14) and the beacon/streamstats
   skills (I12) have all been taught. */

/* finding: {id, q, accept:[canonical, ...variants], why, hint, num?:{target,tol}} */
const CAPSTONES=[
{id:"capA",title:"Who broke into the web server?",tag:"Server intrusion",after:"I16",
 brief:"06:00 handover: overnight, the public web server srv-web01 lit up with a wall of failed Remote Desktop logons, then went quiet. Day shift wants to know whether anyone actually got in, how fast they moved, and what's noise versus attack. Work it from the Windows logs (index=win): logon events 4625/4624 (Logon_Type 10 is RDP), account and group changes 4720/4728/4732/4756, and services 7045.",
 findings:[
  {id:"a1",q:"A second external address, 103.85.24.9, was also failing RDP logons on srv-web01 all afternoon. How many successful logons (4624) did it ever get?",
   accept:["0","none","zero"],num:{target:0,tol:0},
   why:"103.85.24.9 has 4 failed logons and zero successes (no 4624 from it). It's a noisy failure, not a breach — telling a real compromise from background guessing is the first triage call.",
   hint:"Count the 4624 (successful logon) events from 103.85.24.9, not just its 4625 failures."},
  {id:"a2",q:"For the address that DID break in, about how many minutes passed between its first failed attempt and the successful logon?",
   accept:["6","5","6 minutes","5 minutes","about 6","~6","under 6"],num:{target:6,tol:2},
   why:"The first failure from 45.77.53.176 is at 13:02:05 and the one success is at 13:07:44 — under six minutes of guessing before svc_backup fell.",
   hint:"Subtract the first 4625 time on srv-web01 from the single 4624 success time."},
  {id:"a3",q:"After the break-in, about how many minutes until the attacker made their first privileged-group change on the domain controller?",
   accept:["5","6","5 minutes","6 minutes","about 5","~5"],num:{target:5,tol:2},
   why:"The successful logon is 13:07:44; the first group add (4728, Domain Admins) is 13:13:05 — roughly five minutes from foothold to domain admin. Speed like that is the tell of a hands-on intruder.",
   hint:"Time from the svc_backup 4624 to the first 4728/4732/4756 event."},
  {id:"a4",q:"The lateral-movement tool installed its service on several machines. Which host did it reach first?",
   accept:["srv-file01","file01","192.168.1.10"],
   why:"The earliest 7045 PSEXESVC install is on srv-file01 at 13:15:06 — the attacker's first hop off the web server. Sorting the service installs by time shows the direction of travel.",
   hint:"Sort the PSEXESVC 7045 events by _time and take the first host."},
  {id:"a5",q:"A service called GoogleUpdaterService was installed on srv-file01 earlier that day, well before the break-in. About how many hours before the successful logon (13:07) was it installed?",
   accept:["4","about 4","~4","4 hours","3","3.8","nearly 4"],num:{target:4,tol:1},
   why:"It was installed at 09:20 — roughly four hours before svc_backup fell at 13:07. A legitimate auto-updater running as LocalSystem on auto-start, nothing to do with PsExec. Not every 7045 service install is malicious.",
   hint:"Compare the GoogleUpdaterService 7045 install time (09:20) with the svc_backup 4624 success at 13:07."},
  {id:"a6",q:"A new account, jsmith, was created on the DC at 09:40 that day. Which account created it?",
   accept:["it_admin","itadmin","it admin"],
   why:"jsmith was created by it_admin and added only to Remote Desktop Users — an ordinary new starter, hours before svc_backup was compromised. The malicious account is helpdesk_tmp, created by svc_backup. Reading the creator tells the two apart.",
   hint:"Read the src_user (creator) field on the jsmith 4720 account-creation event."}
 ],
 debrief:"Chain: brute force from 45.77.53.176, in within six minutes as svc_backup, domain admin five minutes later, PsExec onto srv-file01 first. The 103.85.24.9 failures and the morning GoogleUpdaterService and jsmith were noise. Isolate srv-web01, disable svc_backup and helpdesk_tmp, and hunt every host PSEXESVC touched."},

{id:"capB",title:"The invoice that called home",tag:"Phishing to C2",after:"I16",
 brief:"A user half-opened a 'shipping invoice' this afternoon and their machine started making odd outbound connections. Reconstruct what the document did, how it persists, and sort the real command-and-control from ordinary cloud chatter. Processes are in Sysmon (index=sysmon EventCode=1, and 3 for network); the scheduled task is in index=win (4698); outbound traffic is the firewall (index=fw, fields srcip/dstip/dstport/app); threat intel is in known_bad_ips.csv.",
 findings:[
  {id:"b1",q:"What is the file name of the document that started it all?",
   accept:["shipping_invoice_8841.docm","shipping invoice 8841.docm","shipping_invoice_8841","shipping invoice 8841"],
   why:"WINWORD opened C:\\Users\\btun\\Downloads\\Shipping_Invoice_8841.docm — the lure. The .docm extension (a macro-enabled document) is itself a flag.",
   hint:"Find the WINWORD process (Sysmon EventCode=1) and read the document path on its command line."},
  {id:"b2",q:"The persistence scheduled task runs a dropped executable every 30 minutes. What is that file's name?",
   accept:["upd.exe","upd"],
   why:"The \\OneDrive Update task (4698) runs C:\\Users\\btun\\AppData\\Roaming\\upd.exe — the implant disguised as an updater. The familiar-sounding name is camouflage.",
   hint:"Read the Task_Command on the 4698 scheduled-task-created event."},
  {id:"b3",q:"About how many minutes passed between the document being opened and the first C2 beacon leaving the machine?",
   accept:["32","30","33","about 32","~32","half an hour"],num:{target:32,tol:4},
   why:"The document opened at 14:21 and the first beacon left at 14:53 — about half an hour from click to call-home, while the task and implant were set up.",
   hint:"Compare the WINWORD open time with the first firewall connection to the C2 address."},
  {id:"b4",q:"Another workstation, 192.168.1.23, made 14 connections to 13.107.42.14 on port 443 — the same count and port as the beacon. What does the firewall's app field say most of that traffic is?",
   accept:["microsoft teams","teams","microsoft.teams","office 365","microsoft","office365"],
   why:"The firewall's app field shows Microsoft Teams (plus Office 365 and OneDrive) at irregular gaps — ordinary chatty SaaS, not a beacon. Connection count and port alone don't make C2; the regular timing and a bad destination do.",
   hint:"Read the app field on those 192.168.1.23 → 13.107.42.14 connections, and note the irregular gaps between them."},
  {id:"b5",q:"Enrich the C2 address against threat intel. What does the known_bad_ips lookup label 185.141.27.10 as?",
   accept:["c2 server","c2","command and control","command-and-control","sample ioc: c2 server","c2 server (sample ioc)"],
   why:"A lookup against known_bad_ips.csv tags 185.141.27.10 as a C2 server — enrichment turns a raw IP into a verdict you can act on.",
   hint:"Join the firewall's destination IPs to known_bad_ips.csv with the lookup command."},
  {id:"b6",q:"The hidden PowerShell was launched with a window-style flag so nothing showed on screen. What is that flag's value?",
   accept:["hidden","-w hidden","w hidden","windowstyle hidden","-windowstyle hidden"],
   why:"powershell.exe was run with -w hidden (WindowStyle Hidden) — no visible window, a standard evasion. Reading the process command line is how you catch it.",
   hint:"Read the encoded powershell.exe command line and look at the -w flag's value."}
 ],
 debrief:"Kill chain: btun opened Shipping_Invoice_8841.docm, Word ran a hidden encoded PowerShell, which set the \\OneDrive Update task running upd.exe, and about half an hour later the implant began beaconing to 185.141.27.10 (flagged C2). The 14 connections from 192.168.1.23 to 13.107.42.14 were just Teams/Office 365 — the decoy. Contain btun's host, remove the task and upd.exe, block the C2, and check who else opened the document."},

{id:"capC",title:"Accounts and data leaving the building",tag:"Account abuse & exfil",after:"I16",
 brief:"Two separate SIEM flags this evening: a run of failed cloud sign-ins, and some large outbound transfers. Sort out what's an attack on the accounts, what's data walking out the door, and what's just big-but-normal. Cloud sign-ins are in index=o365 (Operation, user, ClientIP, ResultStatus); transfers are the firewall (index=fw, fields srcip/dstip/app/sentbyte); DNS is Sysmon (index=sysmon EventCode=22).",
 findings:[
  {id:"c1",q:"One external address tried to sign in to many different accounts, once each — a password spray built to dodge lockouts. What is its IP?",
   accept:["198.51.100.23"],
   why:"Among failed o365 sign-ins, 198.51.100.23 hits many distinct accounts a single time each — the low-and-slow spray pattern. stats dc(user) by ClientIP surfaces it.",
   hint:"Among failed o365 sign-ins, group by the client IP and count distinct users."},
  {id:"c2",q:"How many distinct accounts did that spraying address target?",
   accept:["10","ten"],num:{target:10,tol:0},
   why:"That IP attempted 10 distinct accounts, one try each — breadth across users with no repeats is the spray signature, and it's why lockout thresholds never trip.",
   hint:"dc(user) for ClientIP 198.51.100.23 among the failed sign-ins."},
  {id:"c3",q:"One account successfully signed in from two different external IPs within an hour. Which account is the likely takeover?",
   accept:["abungstein"],
   why:"abungstein signed in from two IPs minutes apart, with three failed attempts from the second just before it worked. (btun also shows two IPs in dc(src_ip) by user, but they're over four hours apart and one is the corporate VPN — that's how you rule btun out.)",
   hint:"Count distinct sign-in IPs per user; two users show two, so check the timing and whether one IP is the known VPN."},
  {id:"c4",q:"What is the IP of that account's suspicious second sign-in?",
   accept:["41.58.112.30"],
   why:"abungstein's usual address is 81.229.10.9; the takeover IP is 41.58.112.30, which also produced three failed attempts right before it succeeded — the password being tried until it worked.",
   hint:"List abungstein's sign-in IPs; the odd one out had failed attempts just before it."},
  {id:"c5",q:"A workstation uploaded a large volume to the file-sharing site MEGA. Which workstation (name or IP)?",
   accept:["wrk-klagerfield","klagerfield","192.168.1.25"],
   why:"In the firewall, app=MEGA shows wrk-klagerfield (192.168.1.25) sending hundreds of megabytes out — far more than browsing. sum(sentbyte) by srcip makes it obvious.",
   hint:"Filter the firewall to app=MEGA and total sentbyte by srcip."},
  {id:"c6",q:"About how many megabytes did it send to MEGA? (within about 50 MB)",
   accept:["852","850","about 850","about 852","~850"],num:{target:852,tol:50},
   why:"The MEGA transfers sum to roughly 852 MB (sum(sentbyte)/1048576) — nearly a gigabyte to a personal file-share is a textbook exfiltration signal.",
   hint:"sum(sentbyte) for app=MEGA, then divide by 1048576 for megabytes."},
  {id:"c7",q:"Sort the day's outbound traffic by bytes and the biggest single transfer is about 2 GB to Amazon S3 from srv-backup01 (192.168.1.12). At what time of day does that transfer run?",
   accept:["02:00","2:00","2am","2 am","0200","02.00","2:00 am","2 o'clock","02:00 utc"],
   why:"It runs at 02:00 — srv-backup01's scheduled nightly cloud backup, from a server, to a known provider. The biggest number isn't always the threat; context (host, 02:00 timing, destination) rules it out.",
   hint:"Look at the _time of that S3 transfer — the hour of day tells you what it is."},
  {id:"c8",q:"A workstation was quietly tunnelling data out inside DNS queries. What is the odd domain it kept querying?",
   accept:["cdn-telemetry.net","cdn-telemetry"],
   why:"A burst of 24 Sysmon DNS queries (EventCode=22) went to long random subdomains of cdn-telemetry.net — the shape of DNS tunnelling. Counting EventCode=22 by host, and eyeballing the domains, points to wrk-fyodor and this domain.",
   hint:"In EventCode=22 DNS queries, look for an unfamiliar domain with very long subdomains."}
 ],
 debrief:"Three findings, three responses: block the spraying IP 198.51.100.23 and force resets; treat abungstein's 41.58.112.30 sign-in as a takeover (reset, revoke sessions, check MFA) while leaving btun's VPN logon alone; and investigate klagerfield's ~852 MB MEGA upload and fyodor's cdn-telemetry.net DNS tunnel as exfiltration. The 2 GB to Amazon S3 was srv-backup01's nightly backup, not a threat — the biggest transfer of the day was the benign one."}
];
