{id:"I5",stage:2,data:"night",t:"rex: cut a field out of text",goal:"Pull out the value nobody extracted for you",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http http_method=POST\n| table _time src_ip form_data",what:"The passwords are buried inside one long field.",
   why:"<code>form_data</code> holds what the browser sent, as name=value pairs joined by &amp;. The password is in there after passwd=, but there's no field for it yet."},
  {spl:"index=botsv1 sourcetype=stream:http http_method=POST\n| rex field=form_data \"passwd=(?<passwd>[^&]+)\"\n| table _time src_ip passwd",what:"rex cuts a new field out of text.",mark:"batman",
   why:"<code>rex</code> uses a regular expression, which is a text pattern. It finds passwd=, then the part in brackets with ?&lt;passwd&gt; captures what follows into a new field called passwd. [^&amp;]+ means one or more characters that aren't &amp;, so it stops at the next pair. The upload at 21:51:10 has no password, so its passwd is empty.",
   pro:"Without field=, rex reads _raw. Pointing it at one field is faster and safer, because the pattern can't match somewhere you didn't expect."},
  {spl:"index=botsv1 sourcetype=stream:http http_method=POST\n| rex field=form_data \"passwd=(?<passwd>[^&]+)\"\n| stats count dc(passwd) AS tried by src_ip",what:"Now use the new field like any other.",
   why:"23.22.63.114 tried 12 different passwords. 40.80.148.42 needed only one, batman: the password that worked, sent two minutes after the guessing stopped. rex can also rewrite a field instead of reading from it: <code>rex field=user mode=sed \"s/[0-9]+$//g\"</code> edits or masks the value in place, the way the Unix sed tool does."}
 ],
 yourturn:{goal:"Pull the username out of form_data into a field called user, then count each user.",spl:"index=botsv1 sourcetype=stream:http http_method=POST\n| rex field=form_data \"username=(?<user>[^&]+)\"\n| stats count by user",
   pieces:["index=botsv1 sourcetype=stream:http http_method=POST","| rex field=form_data \"username=(?<user>[^&]+)\"","| stats count by user"],
   extra:[{t:"| stats count by username",why:"There's no username field yet. rex has to cut it out first, and the goal names it user."}]},
 quiz:[
  {id:"I5q1",lv:1,type:"concept",q:"What does rex do?",
   options:["Pulls a new field out of text, using a pattern","Renames a field","Removes events that match a pattern","Counts matching events"],a:0,
   why:"rex runs a regular expression and turns each named capture into a field."},
  {id:"I5q2",lv:1,type:"concept",q:"In `(?<passwd>[^&]+)`, what is passwd?",
   options:["The name of the new field","The text to search for","A function","The sourcetype"],a:0,
   why:"The name between the angle brackets becomes the field name. What the rest matches becomes its value."},
  {id:"I5q3",lv:2,type:"concept",q:"What does `[^&]+` match?",
   options:["One or more characters that aren't &","Only the & sign","Any text including &","Nothing"],a:0,
   why:"Square brackets with ^ mean any character except these. The + means one or more. So it stops right before the next &."},
  {id:"I5q4",lv:2,type:"read",q:"What's the output of this search?",code:"index=botsv1 sourcetype=stream:http http_method=POST\n| rex field=form_data \"passwd=(?<passwd>[^&]+)\"\n| stats count dc(passwd) AS tried by src_ip",
   options:["23.22.63.114: count 12, tried 12; 40.80.148.42: count 2, tried 1","One row: tried 13","23.22.63.114: tried 1","Nothing: rex can't feed stats"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http http_method=POST | rex field=form_data \"passwd=(?<passwd>[^&]+)\" | stats count dc(passwd) AS tried by src_ip",cell:[0,"tried",12]},
   why:"The guesser sent 12 POSTs with 12 different passwords. The intruder sent 2 POSTs, a login and an upload, but only the login had a password."},
  {id:"I5q5",lv:2,type:"read",q:"Read the log. What does `rex field=form_data \"passwd=(?<passwd>[^&]+)\"` put in passwd?",logs:[38],hl:["passwd=batman"],
   options:["batman","batman&option=com_login","passwd=batman","admin"],a:0,
   why:"The capture starts after passwd= and stops before the next &, so it's just batman."},
  {id:"I5q6",lv:1,type:"fill",q:"Fill the gap so rex reads only form_data.",code:"| rex ____=form_data \"passwd=(?<passwd>[^&]+)\"",codeOpts:true,
   options:["field","input","from","source"],a:0,
   why:"field= tells rex which field to read. Leave it out and rex reads _raw."},
  {id:"I5q7",lv:2,type:"concept",q:"Which field does rex read if you leave out field=?",codeOpts:true,
   options:["_raw","_time","form_data","The first field"],a:0,
   why:"By default rex reads the whole raw event."},
  {id:"I5q8",lv:3,type:"concept",q:"The upload at 21:51:10 has no passwd= in its form_data. What does it get in passwd?",
   options:["Nothing: the field is missing on that event","An empty string","The word null","An error stops the search"],a:0,
   why:"When the pattern doesn't match, rex adds nothing. The field is simply missing, which is why that row's passwd is blank."},
  {id:"I5q9",lv:2,type:"bug",q:"This finds no passwords at all. Which line is wrong?",codeOpts:true,
   options:["index=botsv1 sourcetype=stream:http http_method=POST","| rex field=uri \"passwd=(?<passwd>[^&]+)\"","| stats dc(passwd) AS tried by src_ip"],a:1,
   why:"The password is in form_data, not uri. rex reads only the field you point it at."},
  {id:"I5q10",lv:3,type:"concept",q:"Why point rex at one field instead of letting it read _raw?",
   options:["It's faster, and the pattern can't match somewhere unexpected","_raw can't be read by rex","It makes the field permanent","It's required for named captures"],a:0,
   why:"A smaller input is less work, and you know exactly where the match came from."}
 ]},

{id:"I6",stage:2,data:"night",t:"rex on raw log lines",goal:"Make fields from logs that have none",
 steps:[
  {spl:"index=linux sourcetype=linux_secure",what:"Some logs arrive as plain text, with no fields.",
   why:"These SSH lines from web02 have no field for the user or the source address: only the raw text. That's normal for logs Splunk has no add-on for, and rex is how you work with them."},
  {spl:"index=linux sourcetype=linux_secure \"Failed password\"\n| rex \"from (?<src>\\S+) port\"\n| stats count by src",what:"Cut out the source address.",
   why:"The quotes make Failed password one phrase. The pattern finds the word from, captures a run of non-space characters, and stops at port. There's no field=, so rex reads _raw. \\S means any character that isn't a space."},
  {spl:"index=linux sourcetype=linux_secure \"Failed password\"\n| rex \"for (invalid user )?(?<user>\\S+) from (?<src>\\S+)\"\n| stats count by src user",what:"Two captures in one pattern.",
   why:"Some lines say for root, others say for invalid user oracle. The question mark after the brackets makes invalid user optional, so the name is captured either way. One rex can make several fields. By default rex keeps only the first match on each event; add <code>max_match=0</code> to capture every match into a multivalue field (any other number caps how many it keeps).",
   pro:"Regex basics worth knowing: \\d is a digit, \\s a space, \\S anything but a space, + means one or more, and ? means optional. In Splunk Web, the field extractor can write these patterns for you; it's in Station 3."},
  {spl:"index=linux sourcetype=linux_secure\n| regex _raw=\"Failed password\"\n| stats count",what:"Sometimes you don't want a new field — you want to keep only the lines that match.",
   why:"<code>regex</code> is rex's filtering cousin. Where <code>rex</code> <i>extracts</i> a field from text, <code>regex</code> <i>keeps or drops whole events</i> by whether a field matches a pattern, and it makes no new field. <code>regex _raw=\"Failed password\"</code> keeps only the five failed-login lines. Leave out <code>_raw=</code> and it still tests the raw text; write <code>field!=\"...\"</code> to keep the lines that <i>don't</i> match; and start the pattern with <code>(?i)</code> to ignore case.",
   pro:"Reach for regex when a plain search term isn't precise enough — a specific address range, or \"four or more digits in a row\". A bare search matches whole words and can't express a pattern like that; regex can."}
 ],
 yourturn:{goal:"Label every SSH line Failed or Accepted, in a field called result, and count each.",spl:"index=linux sourcetype=linux_secure\n| rex \"(?<result>Failed|Accepted) password\"\n| stats count by result",
   pieces:["index=linux sourcetype=linux_secure","| rex \"(?<result>Failed|Accepted) password\"","| stats count by result"],
   extra:[{t:"| stats count by Failed",why:"There's no field called Failed. rex has to make the result field first."}]},
 quiz:[
  {id:"I6q1",lv:1,type:"concept",q:"Why do these SSH logs need rex?",
   options:["They have no fields, only raw text","rex makes them load faster","They're in JSON","stats doesn't work on linux logs"],a:0,
   why:"Without an add-on, Splunk only knows the raw text and the default fields. rex turns parts of the text into fields."},
  {id:"I6q2",lv:1,type:"concept",q:"In a rex pattern, what does `\\S+` match?",
   options:["A run of characters that aren't spaces","Only spaces","Only digits","The letter S"],a:0,
   why:"\\S is any character except a space. + means one or more, so it grabs a whole word or address."},
  {id:"I6q3",lv:2,type:"read",q:"Read the log. What does `rex \"for (invalid user )?(?<user>\\S+) from\"` put in user?",logs:[99],hl:["invalid user oracle"],
   options:["oracle","invalid","user","10.0.0.9"],a:0,
   why:"invalid user is the optional part, so the capture starts after it and grabs oracle."},
  {id:"I6q4",lv:2,type:"read",q:"Run it. What do you get back?",code:"index=linux sourcetype=linux_secure \"Failed password\"\n| rex \"from (?<src>\\S+) port\"\n| stats count by src",
   options:["10.0.0.9: 3, 185.220.101.4: 2","10.0.0.9: 5","3 rows","192.168.250.100: 1"],a:0,
   chk:{spl:"index=linux sourcetype=linux_secure \"Failed password\" | rex \"from (?<src>\\S+) port\" | stats count by src",cell:[0,"count",3]},
   why:"Five failed lines, from two addresses. The accepted login from 192.168.250.100 doesn't contain Failed password, so it's left out."},
  {id:"I6q5",lv:2,type:"concept",q:"What does the `?` after `(invalid user )` mean?",
   options:["That part is optional","It's a capture","Match a question mark","Any one character"],a:0,
   why:"? after something makes it optional: zero or one of it."},
  {id:"I6q6",lv:1,type:"fill",q:"Fill the gap to capture the port number's digits.",code:"| rex \"port (?<port>____)\"",codeOpts:true,
   options:["\\d+","\\s+","port","\\S"],a:0,
   why:"\\d is a digit and + means one or more, so \\d+ captures the whole number."},
  {id:"I6q7",lv:2,type:"read",q:"What does this search produce?",code:"index=linux sourcetype=linux_secure\n| rex \"(?<result>Failed|Accepted) password\"\n| stats count by result",
   options:["Accepted 1, Failed 5","Failed 6","Accepted 5, Failed 1","2 events"],a:0,
   chk:{spl:"index=linux sourcetype=linux_secure | rex \"(?<result>Failed|Accepted) password\" | stats count by result",cell:[1,"count",5]},
   why:"The bar | inside the pattern means or. Five lines failed and one, the deploy user, was accepted."},
  {id:"I6q8",lv:2,type:"bug",q:"This returns nothing. Which line is wrong?",codeOpts:true,
   options:["index=linux sourcetype=linux_secure \"Failed password\"","| rex \"from (?<src>\\S+) port\"","| stats count by source_ip"],a:2,
   why:"rex named the field src. There's no source_ip field, so stats has nothing to group by."},
  {id:"I6q9",lv:3,type:"concept",q:"Which tool in Splunk Web can write rex patterns for you?",
   options:["The field extractor","The Search app's time picker","The dashboard editor","The lookup editor"],a:0,
   why:"The field extractor lets you highlight a value in an event, and it writes the pattern. It's in Station 3."},
  {id:"I6q10",lv:3,type:"concept",q:"In a pattern, what does `\\d` mean?",
   options:["One digit","A space","Any character","The letter d"],a:0,
   why:"\\d is a digit, 0 to 9. \\s is a space and \\S is anything but a space."},
  {id:"I6q11",lv:2,type:"concept",q:"How does `regex` differ from `rex`?",
   options:["regex keeps or drops whole events by a pattern and makes no field; rex extracts a field from text","They are the same command","regex renames fields; rex deletes them","regex only works on JSON"],a:0,
   why:"rex cuts a named field out of text. regex is a filter: it keeps the events whose field matches the pattern (or, with !=, those that don't) and adds nothing."},
  {id:"I6q12",lv:2,type:"read",q:"Run it. How many events come back?",code:"index=linux sourcetype=linux_secure\n| regex _raw=\"Failed password\"\n| stats count",
   options:["5","6","1","0"],a:0,
   chk:{spl:"index=linux sourcetype=linux_secure | regex _raw=\"Failed password\" | stats count",cell:[0,"count",5]},
   why:"regex keeps only the lines whose raw text matches Failed password — the five failed logons. The one accepted login is dropped, and no new field is created."},
  {id:"I6q13",lv:2,type:"fill",q:"Fill the gap so you keep only the lines that do NOT contain Failed.",code:"index=linux sourcetype=linux_secure\n| regex _raw____\"Failed\"",codeOpts:true,
   options:["!=","=","==","NOT"],a:0,
   why:"field!=\"pattern\" inverts the match, keeping the events whose field does not match. Here that leaves the single Accepted line."}
 ]},

{id:"I7",stage:2,data:"night",t:"JSON fields and spath",goal:"Read nested data and lists",
 steps:[
  {spl:"index=botsv1 sourcetype=suricata\n| table _time src_ip alert.signature alert.severity",what:"JSON events come with their fields ready.",
   why:"The IDS writes JSON, and Splunk turns each key into a field by itself. A key inside another key gets a dot: <code>alert.signature</code> is the signature inside alert."},
  {spl:"index=botsv1 sourcetype=stream:dns\n| rename \"query{}\" AS query \"answer{}\" AS answer\n| table _time src_ip query answer",what:"Curly brackets mean a list.",
   why:"In the DNS JSON, query is a list, so Splunk names the field <code>query{}</code>. Brackets are awkward in later pipes, so analysts rename them. Look at 22:08:40: the web server looked up prankglassinebracket.jumpingcrab.com, and the answer was the attacker's address, 23.22.63.114."},
  {spl:"index=botsv1 sourcetype=suricata\n| spath path=alert.signature output=sig\n| stats count by sig",what:"spath reads JSON on demand.",
   why:"<code>spath</code> pulls a value out of JSON by its path. path= says which key and output= names the new field. Use it when the JSON wasn't extracted for you, for example JSON stored inside another field, which you point at with input=.",
   pro:"spath with no options extracts every key. On busy searches, name the path: it's less work."}
 ],
 yourturn:{goal:"Count the IDS alerts in each category, using spath to make a field called cat.",spl:"index=botsv1 sourcetype=suricata\n| spath path=alert.category output=cat\n| stats count by cat",
   pieces:["index=botsv1 sourcetype=suricata","| spath path=alert.category output=cat","| stats count by cat"],
   extra:[{t:"| stats count by category",why:"There's no field called category. The key sits inside alert, so its path is alert.category."}]},
 quiz:[
  {id:"I7q1",lv:1,type:"concept",q:"What does the dot in `alert.signature` mean?",
   options:["signature is a key inside alert","It's a decimal number","It joins two fields","It's a typo"],a:0,
   why:"In JSON fields, a dot marks one level of nesting."},
  {id:"I7q2",lv:1,type:"concept",q:"What do the curly brackets in `query{}` mean?",
   options:["In the JSON, query is a list","The field is empty","It's a subsearch","It's a comment"],a:0,

  {id:"I7q4",lv:1,type:"fill",q:"Fill the gap to say which JSON key to read.",code:"| spath ____=alert.signature output=sig",codeOpts:true,
   options:["path","field","input","key"],a:0,

  {id:"I7q5",lv:2,type:"read",q:"How many rows does this return?",code:"index=botsv1 sourcetype=suricata\n| spath path=alert.signature output=sig\n| stats count by sig",
   options:["6","1","3","0"],a:0,chk:{spl:"index=botsv1 sourcetype=suricata | spath path=alert.signature output=sig | stats count by sig",rows:6},

  {id:"I7q6",lv:2,type:"concept",q:"Why do analysts rename `query{}` to `query`?",
   options:["The brackets are awkward to type in later pipes","Splunk can't search fields with brackets","It removes duplicate values","It's needed for stats to work"],a:0,

  {id:"I7q7",lv:2,type:"read",q:"Read this search. What comes back?",code:"index=botsv1 sourcetype=suricata\n| stats count by alert.severity",
   options:["2 rows: severity 1 has 3, severity 2 has 3","1 row: 6","6 rows","Nothing: dots aren't allowed"],a:0,
   chk:{spl:"index=botsv1 sourcetype=suricata | stats count by alert.severity",cell:[1,"count",3]},
   why:"The nested field works like any other. Three alerts are severity 1 and three are severity 2."},
  {id:"I7q8",lv:3,type:"concept",q:"What does spath do with no options at all?",
   options:["Extracts every key in the JSON","Nothing","Deletes the JSON","Extracts only the first key"],a:0,
   why:"It pulls out everything. Naming the path is less work on busy searches."},
  {id:"I7q9",lv:3,type:"concept",q:"Which option tells spath to read JSON from a field instead of _raw?",codeOpts:true,
   options:["input","output","path","field"],a:0,
   why:"input= names the field that holds the JSON. Careful: rex uses field= for the same idea."},
  {id:"I7q10",lv:2,type:"bug",q:"This gives no rows. Which line is wrong?",codeOpts:true,

   chk:{spl:"index=botsv1 sourcetype=stream:dns | stats count by query | sort -count",rows:0},

{id:"I8",stage:2,data:"night",t:"The eval toolkit",goal:"IP ranges, decoding, lists and fallbacks",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n| eval zone=if(cidrmatch(\"192.168.0.0/16\", src_ip), \"internal\", \"external\")\n| stats count by zone",what:"Is this address one of ours?",
   why:"<code>cidrmatch()</code> checks whether an IP is inside a network range. 192.168.0.0/16 covers every address that starts with 192.168. Six requests came from inside, and 33 from the internet."},
  {spl:"index=botsv1 sourcetype=stream:http uri=\"*script*\"\n| eval clean=urldecode(uri)\n| table src_ip clean",what:"Decode what the attacker sent.",
   why:"Web addresses hide special characters as codes that start with a percent sign. <code>urldecode()</code> turns them back, and the attack appears in plain sight: a script tag that pops up an alert box. That's a cross-site scripting test."},
  {spl:"index=botsv1 sourcetype=stream:dns\n| rename \"query{}\" AS query\n| eval domain=mvjoin(mvindex(split(query,\".\"),-2,-1),\".\")\n| stats count by domain",what:"Cut a long name down to its domain.",
   why:"<code>split()</code> breaks the name at each dot into a list. <code>mvindex()</code> picks items from the list: -2 to -1 means the last two. <code>mvjoin()</code> glues them back together with dots. The odd name becomes jumpingcrab.com, a free dynamic DNS service.",
   pro:"A field holding a list is called a multivalue field; that's the mv in mvindex. Endings with two parts, like co.uk, break this trick, so treat it as a quick look."},
  {spl:"index=botsv1 (sourcetype=stream:http OR sourcetype=fgt_traffic)\n| eval ip=coalesce(src_ip, srcip)\n| stats dc(sourcetype) AS types by ip\n| sort -types",what:"One name for the same thing.",
   why:"<code>coalesce()</code> returns the first of its fields that has a value. The web logs say src_ip and the firewall says srcip, so ip now works for both, and you can see which sources show up in both kinds of log. Two more everyday eval functions worth knowing: <code>len(field)</code> returns a string's character count, and <code>mvcount(field)</code> returns how many values a multivalue field holds."}
 ],
 yourturn:{goal:"Label each firewall connection internal or external by its srcip, then count each label.",spl:"index=botsv1 sourcetype=fgt_traffic\n| eval zone=if(cidrmatch(\"192.168.0.0/16\", srcip), \"internal\", \"external\")\n| stats count by zone",
   pieces:["index=botsv1 sourcetype=fgt_traffic","| eval zone=if(cidrmatch(\"192.168.0.0/16\", srcip), \"internal\", \"external\")","| stats count by zone"],
   extra:[{t:"| eval zone=if(srcip=\"192.168.*\", \"internal\", \"external\")",why:"In eval, = compares exact text and a star is just a star. cidrmatch() is how you test a network range."}]},
 quiz:[
  {id:"I8q1",lv:1,type:"concept",q:"What does `cidrmatch(\"192.168.0.0/16\", src_ip)` check?",
   options:["Whether src_ip is inside that network range","Whether src_ip is exactly 192.168.0.0","How many addresses are in the range","Whether src_ip is valid"],a:0,
   why:"It's true when the address falls inside the range. /16 means the first two numbers must match."},
  {id:"I8q2",lv:1,type:"concept",q:"What does urldecode() do?",
   options:["Turns percent codes back into normal characters","Removes the web address","Looks up the site's owner","Checks if a URL is safe"],a:0,
   why:"Web addresses encode special characters, like a space as %20. urldecode makes them readable."},
  {id:"I8q3",lv:2,type:"read",q:"You run this one. What's the result?",code:"index=botsv1 sourcetype=stream:http\n| eval zone=if(cidrmatch(\"192.168.0.0/16\", src_ip), \"internal\", \"external\")\n| stats count by zone",
   options:["external 33, internal 6","internal 39","external 6, internal 33","2 events"],a:0,
   chk:{spl:"index=botsv1 sourcetype=stream:http | eval zone=if(cidrmatch(\"192.168.0.0/16\", src_ip), \"internal\", \"external\") | stats count by zone",cell:[0,"count",33]},
   why:"Most web requests came from the internet. The six internal ones are a staff visitor and the server itself."},
  {id:"I8q4",lv:2,type:"concept",q:"What does `coalesce(src_ip, srcip)` return?",
   options:["The first of the two that has a value","Both, joined together","Whichever is bigger","True if they match"],a:0,
   why:"coalesce goes left to right and returns the first value that exists. It's how you give one name to differently named fields."},
  {id:"I8q5",lv:2,type:"concept",q:"What does `mvindex(split(\"www.google.com\",\".\"),-2,-1)` give?",
   options:["google and com, as a list","www and google","www.google.com","com"],a:0,
   why:"split makes the list www, google, com. -2 to -1 picks the last two items."},
  {id:"I8q6",lv:1,type:"fill",q:"Fill the gap to use whichever field has a value.",code:"| eval ip=____(src_ip, srcip)",codeOpts:true,
   options:["coalesce","if","mvjoin","split"],a:0,
   why:"coalesce returns its first argument that has a value."},
  {id:"I8q7",lv:2,type:"read",q:"Read the log. Which function makes this request readable?",logs:[15],hl:["%3Cscript%3E"],codeOpts:true,
   options:["urldecode","cidrmatch","split","coalesce"],a:0,
   why:"%3C and %3E are the codes for the angle brackets of a script tag. urldecode turns them back."},
  {id:"I8q8",lv:3,type:"read",q:"Which source comes first, and what's its types value?",code:"index=botsv1 (sourcetype=stream:http OR sourcetype=fgt_traffic)\n| eval ip=coalesce(src_ip, srcip)\n| stats dc(sourcetype) AS types by ip\n| sort -types",
   options:["192.168.250.70, with types 2","40.80.148.42, with types 3","23.22.63.114, with types 1","192.168.2.50, with types 2"],a:0,
   chk:{spl:"index=botsv1 (sourcetype=stream:http OR sourcetype=fgt_traffic) | eval ip=coalesce(src_ip, srcip) | stats dc(sourcetype) AS types by ip | sort -types",cell:[0,"ip","192.168.250.70"]},
   why:"Three addresses tie at 2. sort keeps tied rows in the order stats made them, sorted by ip, and 192.168.250.70 sorts first as text."},
  {id:"I8q9",lv:3,type:"concept",q:"What does the mv in mvindex stand for?",
   options:["Multivalue: a field that holds a list","Move","Maximum value","Most visited"],a:0,
   why:"Multivalue functions all start with mv: mvindex, mvjoin, mvcount and more."},
  {id:"I8q10",lv:2,type:"bug",q:"Every connection comes out external. Which line is wrong?",codeOpts:true,
   options:["index=botsv1 sourcetype=fgt_traffic","| eval zone=if(srcip=\"192.168.*\", \"internal\", \"external\")","| stats count by zone"],a:1,
   chk:{spl:"index=botsv1 sourcetype=fgt_traffic | eval zone=if(srcip=\"192.168.*\", \"internal\", \"external\") | stats count by zone",rows:1},
   why:"In eval the star isn't a wildcard, so no address equals the text 192.168.*. Use cidrmatch for ranges."}
 ]},

{id:"I9",stage:2,data:"night",t:"Conditional counts and gaps",goal:"Count only what matters, and fill the blanks",

  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| eventstats avg(count) AS avg_count",what:"Add the average to every row.",
   why:"<code>eventstats</code> calculates like stats, but instead of replacing the rows, it adds its answer as a new field on every row. Each source now carries avg_count, 6.5, next to its own count."},
  {spl:"index=botsv1 sourcetype=stream:http\n| stats count by src_ip\n| eventstats avg(count) AS avg_count\n| where count > avg_count",what:"Keep the sources busier than average.",
   why:"Because the average sits on each row, where can compare every source with it. Two sources are above average: the scanner and the password guesser. This is how you find outliers without knowing a threshold in advance."},
  {spl:"index=botsv1 sourcetype=stream:http\n| eventstats count AS total\n| stats count first(total) AS total by src_ip\n| eval pct=round(count/total*100,1)",what:"Each source's share of all traffic.",
   why:"<code>eventstats count AS total</code> puts the grand total, 39, on every event before stats groups them, and first(total) carries it through. The scanner sent 41 percent of all web requests.",
   pro:"eventstats keeps every event in memory, so on big data it costs more than stats. Use it when you need a group's number beside the detail. With by, it works per group: eventstats avg(bytes) by src_ip."}

{id:"I12",stage:2,data:"night",t:"streamstats",goal:"Running counts and the gap since last time",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http src_ip=23.22.63.114\n| sort 0 _time\n| streamstats count AS attempt\n| table _time attempt",what:"Number each attempt in order.",
   why:"<code>streamstats</code> calculates as the events go past, one at a time, so each event gets a running total. Sorting oldest first makes attempt 1 the first guess and attempt 12 the last.",
   pro:"sort 0 removes the 10,000 row limit. Use it whenever later steps depend on the order being complete."},
  {spl:"index=botsv1 sourcetype=fgt_traffic dstport=1337\n| sort 0 _time\n| streamstats current=f last(_time) AS prev\n| eval gap=_time-prev\n| table _time gap",what:"Measure the gap between beacons.",
   why:"<code>current=f</code> means: leave this event out and only look at the ones before it. So last(_time) is the previous event's time, and subtracting gives the seconds between connections: 60, again and again. The first event has no gap, because nothing came before it."},
  {spl:"index=botsv1 sourcetype=fgt_traffic dstport=1337\n| sort 0 _time\n| streamstats current=f last(_time) AS prev\n| eval gap=_time-prev\n| stats count avg(gap) AS avg_gap range(gap) AS spread by dstip",what:"Sum up the rhythm.",
   why:"The average gap is 60 seconds, and the gaps never differ by more than 2 seconds. People are never that regular. A steady gap like this is the fingerprint of a beacon.",
   pro:"window=5 makes streamstats look only at the last 5 events, which gives a moving average. With by, the running count restarts for each group."}
 ],

{id:"I13",stage:2,data:"night",t:"transaction",goal:"Turn scattered events into sessions",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n| transaction src_ip maxpause=5m\n| table _time src_ip duration eventcount",what:"Group events into sessions.",
   why:"<code>transaction</code> joins events with the same src_ip into one, as long as no gap between them is longer than <code>maxpause</code>, here 5 minutes. Each session gets <code>duration</code>, the seconds from first to last event, and <code>eventcount</code>."},
  {spl:"index=botsv1 sourcetype=stream:http src_ip=40.80.148.42\n| transaction src_ip maxpause=2m\n| table _time duration eventcount",what:"The intruder's three visits.",
   why:"With a 2-minute limit, 40.80.148.42 splits into three sessions: the scan at 21:42 with 12 requests, the login at 21:47, and the upload at 21:51. Choosing maxpause is choosing what counts as one visit."},
  {spl:"index=botsv1 sourcetype=stream:http src_ip=40.80.148.42\n| transaction src_ip startswith=\"batman\" endswith=\"3791.exe\"\n| table _time duration eventcount",what:"From the stolen login to the upload.",
   why:"<code>startswith</code> and <code>endswith</code> mark where a session begins and ends. This one starts at the request carrying the password batman and ends at the upload of 3791.exe: 3 events in 210 seconds.",

 ],

 quiz:[

   options:["Joins related events into one, like a session","Deletes events","Counts events per field","Sends events to a ticket"],a:0,
   why:"Events that share a field value, and are close enough in time, become one result."},

  {id:"I13q3",lv:2,type:"concept",q:"What does `maxpause=2m` mean?",

   why:"maxpause is the longest allowed gap between events in the same session."},
  {id:"I13q4",lv:2,type:"read",q:"How many sessions does this give?",code:"index=botsv1 sourcetype=stream:http src_ip=40.80.148.42\n| transaction src_ip maxpause=2m",

  {id:"I13q5",lv:2,type:"read",q:"What does this show?",code:"index=botsv1 sourcetype=WinEventLog:Security EventCode=4625\n| transaction Source_Network_Address maxpause=1m\n| table Source_Network_Address duration eventcount",
   options:["91.240.118.172: duration 11, eventcount 6","6 rows","duration 0, eventcount 1","91.240.118.172: duration 6, eventcount 11"],a:0,

  {id:"I13q6",lv:1,type:"fill",q:"Fill the gap to set the longest allowed gap.",code:"| transaction src_ip ____=5m",codeOpts:true,
   options:["maxpause","span","maxspan","window"],a:0,

  {id:"I13q7",lv:2,type:"read",q:"Read the logs. They go into `| transaction src_ip startswith=\"batman\" endswith=\"3791.exe\"`. What duration comes out?",logs:[40,39,38],hl:["batman","3791.exe"],
   options:["210","15","2","3"],a:0,

  {id:"I13q8",lv:3,type:"concept",q:"When should you use stats instead of transaction?",
   options:["Whenever stats can answer, because it's much faster","Never","Only on Windows logs","When you need maxpause"],a:0,
   why:"transaction is slow and memory hungry. Use it for what only it does: pause limits and start and end markers."},
  {id:"I13q9",lv:3,type:"concept",q:"Which stats line gives first seen, last seen and a count per source, like a cheap transaction?",codeOpts:true,

  {id:"I13q10",lv:2,type:"bug",q:"This joins the scanner's whole night into one session. Which line should change?",codeOpts:true,

{id:"I14",stage:2,data:"night",t:"Lookups",goal:"Add context from a table",
 steps:[
  {spl:"| inputlookup known_bad_ips.csv",what:"A lookup is a table you add to Splunk.",
   why:"<code>inputlookup</code> shows a lookup's rows. This one is a threat list: addresses known to be bad, what they are and where the tip came from. It starts with a pipe because it reads a table, not events."},
  {spl:"index=botsv1 sourcetype=fgt_traffic\n| lookup known_bad_ips.csv ip AS dstip OUTPUT threat\n| where isnotnull(threat)\n| stats count by dstip threat",what:"Check traffic against the threat list.",
   why:"<code>lookup</code> matches each event against the table. ip AS dstip says: the table's ip column matches the event's dstip field. OUTPUT copies threat into the event. Events without a match get no threat, so <code>isnotnull(threat)</code> keeps only the hits: 10 connections to attacker infrastructure."},
  {spl:"index=botsv1 sourcetype=WinEventLog:Security\n| lookup windows_events.csv EventCode OUTPUT description\n| stats count by EventCode description",what:"Turn codes into words.",
   why:"When the field has the same name in the table and the events, you name it once. Now nobody has to remember that 4732 means a member was added to a group.",
   pro:"OUTPUT overwrites a field that already exists; OUTPUTNEW only fills it when it's empty. An admin can make a lookup automatic, so it runs on every search without a lookup command. That's in Station 3."}
 ],

 quiz:[
  {id:"I14q1",lv:1,type:"concept",q:"What is a lookup in Splunk?",
   options:["A table, like a CSV file, used to add fields to events","A saved search","A type of index","A dashboard"],a:0,
   why:"Lookups hold context, like threat lists, asset owners or code meanings, and add it to events."},
  {id:"I14q2",lv:1,type:"concept",q:"Why does `| inputlookup known_bad_ips.csv` start with a pipe?",
   options:["It reads a table, not events, so there's no event search before it","It's a mistake","Every search starts with a pipe","To make it faster"],a:0,

  {id:"I14q3",lv:2,type:"concept",q:"In `lookup known_bad_ips.csv ip AS dstip OUTPUT threat`, what does `ip AS dstip` mean?",
   options:["Match the table's ip column against the event's dstip","Rename dstip to ip in the results","Only look up IP addresses","Copy ip into dstip"],a:0,

  {id:"I14q4",lv:2,type:"read",q:"What's the output of this search?",code:"index=botsv1 sourcetype=fgt_traffic\n| lookup known_bad_ips.csv ip AS dstip OUTPUT threat\n| where isnotnull(threat)\n| stats count by dstip threat",

   why:"Only one listed address is ever a destination in the firewall logs: the beacon and the image fetch went to 23.22.63.114."},
  {id:"I14q5",lv:1,type:"fill",q:"Fill the gap to copy the threat column into the events.",code:"| lookup known_bad_ips.csv ip AS dstip ____ threat",codeOpts:true,
   options:["OUTPUT","AS","BY","INTO"],a:0,
   why:"OUTPUT names the table columns to add to each event."},
  {id:"I14q6",lv:2,type:"concept",q:"An event's dstip isn't in the threat list. What does it get in threat?",
   options:["Nothing: the field stays missing","The word none","0","The event is deleted"],a:0,
   why:"No match, no field. That's why isnotnull(threat) is a clean way to keep only the hits."},
  {id:"I14q7",lv:2,type:"read",q:"Run it. What do you get back?",code:"index=botsv1 sourcetype=fgt_traffic\n| lookup assets.csv ip AS srcip OUTPUT asset\n| stats count by asset",
   options:["we1149srv 10, we8105desk 2","we1149srv 22","3 rows","Nothing: assets.csv has no srcip column"],a:0,
   chk:{spl:"index=botsv1 sourcetype=fgt_traffic | lookup assets.csv ip AS srcip OUTPUT asset | stats count by asset",cell:[0,"count",10]},
   why:"Only connections from our own machines match the asset table. stats by asset skips events with no asset."},
  {id:"I14q8",lv:3,type:"concept",q:"What's the difference between OUTPUT and OUTPUTNEW?",
   options:["OUTPUTNEW only fills the field when it's empty","OUTPUTNEW makes a new lookup table","OUTPUT is faster","There's no difference"],a:0,
   why:"OUTPUT overwrites what's there. OUTPUTNEW keeps an existing value."},
  {id:"I14q9",lv:3,type:"concept",q:"How can a lookup run on every search without a lookup command?",
   options:["An admin makes it an automatic lookup","Put it in the index","Name it default.csv","It can't"],a:0,
   why:"Automatic lookups are set per sourcetype by an admin. Station 3 covers them."},
  {id:"I14q10",lv:2,type:"read",q:"Read the log. After `| lookup windows_events.csv EventCode OUTPUT description`, what's its description?",logs:[65],hl:["4732"],
   options:["Member added to security-enabled local group","Failed logon","User account created","New process created"],a:0,

 ]},

{id:"I15",stage:2,data:"night",t:"Subsearches",goal:"Let one search feed another",
 steps:[
  {spl:"index=botsv1 sourcetype=stream:http\n    [search index=botsv1 sourcetype=suricata | fields src_ip]\n| stats count by src_ip",what:"The search in square brackets runs first.",
   why:"The subsearch finds every source the IDS alerted on and hands back a filter: src_ip equals this one OR that one. The outer search then keeps only web requests from those sources. One question answers the next."},
  {spl:"index=botsv1\n    [search index=botsv1 sourcetype=stream:dns jumpingcrab.com | rename \"answer{}\" AS dstip | return dstip]\n| stats count by sourcetype dstport",what:"From a DNS answer straight to the firewall.",
   why:"The DNS lookup for jumpingcrab.com answered 23.22.63.114. <code>return dstip</code> hands back dstip=\"23.22.63.114\", so the outer search finds the firewall lines to that address: 9 beacons on port 1337 and the image download on port 80. The rename makes the field name match the firewall's."},
  {spl:"index=botsv1 sourcetype=fgt_traffic\n    [| inputlookup known_bad_ips.csv | rename ip AS srcip | fields srcip]\n| stats count by srcip action",what:"A lookup as the list of things to find.",
   why:"The subsearch reads the threat list and renames ip to srcip, so the filter fits the firewall's field. The RDP guesser shows up: 4 connections accepted, 3 denied. A watchlist search like this is a classic SOC pattern. There are other ways to bring searches together. <code>append</code> adds a second search's rows to the bottom of the results, and <code>appendcols</code> adds its columns beside the existing rows, matched by position. To line rows up on a shared field instead, <code>join</code> puts them side by side: <code>type=inner</code> (the default) drops rows that have no match, while <code>type=left</code> keeps every row from the first search. A join's subsearch is capped at 50,000 rows, so it is for small lookups, not big correlations.",
   pro:"Subsearches have limits: by default at most 10,000 results and 60 seconds, and they cut off quietly. Keep them small, and prefer a lookup command when the list is big."},
  {spl:"index=botsv1 sourcetype=fgt_traffic\n| stats count by action\n| appendcols\n    [search index=botsv1 sourcetype=fgt_traffic | stats count AS total]",what:"appendcols bolts a second search's columns on by position.",noflow:true,
   why:"<code>appendcols</code> runs the bracketed search and lays its columns beside the existing rows, matched by <b>row position</b> — not by any shared field. The grand total, 22, lands on the <i>first</i> row only, next to accept; the deny row gets nothing, because the subsearch returned a single row and there's no second one to pair with it. That positional match is the catch: appendcols is for pinning one summary beside the first result, not for lining data up on a key. For that, use <code>join</code> or a <code>stats by</code> that key.",
   pro:"The safe shape is appendcols with a one-row aggregate, then <code>eval</code> a share from it — but only when the rows already line up, which usually means one row on each side."}
 ],

   pieces:["index=botsv1","[search index=botsv1 sourcetype=stream:dns jumpingcrab.com | rename \"answer{}\" AS dstip | return dstip]","| stats count by sourcetype dstport"],

  {id:"I15q6",lv:2,type:"read",q:"Read this search. What comes back?",code:"index=botsv1 sourcetype=fgt_traffic\n    [| inputlookup known_bad_ips.csv | rename ip AS srcip | fields srcip]\n| stats count by srcip action",

   chk:{spl:"index=botsv1 sourcetype=fgt_traffic [| inputlookup known_bad_ips.csv | rename ip AS srcip | fields srcip] | stats count by srcip action",rows:3},
   why:"Two listed addresses appear as a source. The Tor address never touched the firewall."},
  {id:"I15q7",lv:1,type:"fill",q:"Fill the gap that starts a subsearch.",code:"index=botsv1 sourcetype=stream:http\n    ____search index=botsv1 sourcetype=suricata | fields src_ip]",codeOpts:true,
   options:["[","(","{","|"],a:0,
   why:"Subsearches go in square brackets, and start with search, or with a pipe for commands like inputlookup."},
  {id:"I15q8",lv:3,type:"concept",q:"What are a subsearch's default limits?",
   options:["10,000 results and 60 seconds","100 results and 1 second","No limits","1 million results"],a:0,
   why:"Past those limits it cuts off quietly, so keep subsearches small."},
  {id:"I15q9",lv:3,type:"concept",q:"Your watchlist has 500,000 addresses. Subsearch or lookup command?",
   options:["Lookup command: the list is too big for a subsearch","Subsearch: it's always better","Neither works","Use transaction"],a:0,
   why:"A big list breaks the subsearch limits. `| lookup` then `where isnotnull` scales much better."},
  {id:"I15q10",lv:2,type:"bug",q:"This finds nothing. Which line is wrong?",codeOpts:true,
   options:["index=botsv1 sourcetype=fgt_traffic","    [| inputlookup known_bad_ips.csv | fields ip]","| stats count by srcip action"],a:1,
   chk:{spl:"index=botsv1 sourcetype=fgt_traffic [| inputlookup known_bad_ips.csv | fields ip] | stats count by srcip action",rows:0},
   why:"The subsearch hands back ip=..., but the firewall has no field called ip. Rename it to srcip first."},
  {id:"I15q11",lv:3,type:"read",q:"Run the appendcols search. Where does the total of 22 appear?",code:"index=botsv1 sourcetype=fgt_traffic\n| stats count by action\n| appendcols\n    [search index=botsv1 sourcetype=fgt_traffic | stats count AS total]",
   options:["On the accept row only — appendcols matches by position, and the subsearch returned one row","On both rows","On the deny row only","Nowhere: appendcols fails"],a:0,
   chk:{spl:"index=botsv1 sourcetype=fgt_traffic | stats count by action | appendcols [search index=botsv1 sourcetype=fgt_traffic | stats count AS total]",cell:[0,"total",22]},
   why:"appendcols pairs columns by row position. The one-row subsearch lines up with the first row (accept), so only that row gets total=22; deny is left blank."}
 ]},

{id:"I16",stage:2,data:"night",t:"Boss: correlate the night",goal:"Join every clue into one picture",
 steps:[
  {spl:"index=botsv1 (sourcetype=fgt_traffic OR sourcetype=stream:http)\n| eval ip=coalesce(srcip, src_ip)\n| lookup known_bad_ips.csv ip OUTPUT threat\n| where isnotnull(threat)\n| stats count values(sourcetype) AS seen_in by ip threat",what:"Which known-bad sources reached us?",
   why:"One name for both sourcetypes with coalesce, then the threat list, then keep the hits. 23.22.63.114 shows up in the firewall and the web logs, and the RDP guesser only in the firewall."},
  {spl:"index=botsv1 sourcetype=fgt_traffic dstport=3389\n| sort 0 _time\n| streamstats count AS n by action\n| table _time srcip action n",what:"When did the firewall start blocking?",
   why:"A running count per action, oldest first. The first 4 Remote Desktop connections were accepted, then the firewall started denying them at 22:15:10. Accepted connections are why Windows saw 6 failed logons."},
  {spl:"index=botsv1 sourcetype=WinEventLog:Security\n| lookup windows_events.csv EventCode OUTPUT description\n| eventstats count AS total\n| stats count first(total) AS total by description\n| eval pct=round(count/total*100)",what:"Sum up the Windows side in words.",
   why:"The lookup turns codes into words, and eventstats gives each row the total. Over half the night's Windows security events were failed logons, and the three single events, a process, a new account and a group change, are the attacker settling in. When two sourcetypes share a key, prefer one search over both of them with <code>stats by</code> that key rather than a <code>join</code>: it has no row cap, runs faster, and keeps every event."}
 ],

{id:"K2",stage:3,data:"soc",t:"Aliases, calculated fields, automatic lookups",goal:"One name for the same thing, everywhere",

   screen:{title:"Field aliases",path:"Settings › Fields › Field aliases",kind:"table",cols:["Applies to","Field","Alias"],
     rows:[["sourcetype fgt_traffic","srcip","src"],["sourcetype fgt_traffic","dstip","dest"],["sourcetype fgt_traffic","dstport","dest_port"],["sourcetype stream:http","src_ip","src"],["sourcetype XmlWinEventLog:…Sysmon…","DestinationIp","dest"]],hl:[0,1]},
   why:"The firewall still has srcip and dstip, and now also src and dest. An alias is set per sourcetype, host or source."},
  {spl:"index=botsv1 sourcetype=fgt_traffic\n| stats count sum(bytes) AS bytes by action",what:"Calculated fields: an eval that's always on.",
   screen:{title:"Calculated fields",path:"Settings › Fields › Calculated fields",kind:"table",cols:["Applies to","Name","Eval expression"],

   why:"A calculated field is an eval expression saved for a sourcetype. Here bytes adds sent and received bytes, and action is rewritten from accept and deny to the CIM's values, allowed and blocked.",

   why:"The name ends with the number of arguments: bad_ip(1) takes one. Inside the definition, $ip$ is replaced by the value you put in the brackets."},
  {spl:"`web_traffic`\n| stats count earliest(_time) AS first by src\n| `hms(first)`",what:"A macro can be a whole pipe.",
   why:"hms(1) expands to an eval with strftime, so a long, fiddly piece of SPL becomes one short word. Macros can hold any part of a search, even several pipes.",
   pro:"In the search bar, Ctrl+Shift+E opens the search with every macro expanded. Real detections are full of macros, so expanding them is the first step to reading one."},
  {spl:"index=botsv1 sourcetype=suricata\n| table _time src signature",what:"Workflow actions: from a value to more.",noflow:true,

   why:"A workflow action adds an item to the event or field menu. A link action opens a web page with the field's value filled in, like a threat-intel page for this address. A search action runs another search with it. A workflow action can be scoped to appear only for a given field or a given event type, so it shows up only where it fits. Macros have a matching safety net: a validation expression checks a macro's arguments (say, that a value is numeric) and shows your error message if they're wrong, so a mistyped argument fails clearly instead of building a broken search."}

{id:"K7",stage:3,data:"soc",t:"Data models, the CIM and Pivot",goal:"A map of the data that anyone can use",
 steps:[

   screen:{title:"Data model: Network Traffic",path:"Settings › Data models › Network_Traffic",kind:"form",rows:[["Root dataset","All_Traffic"],["Constraint","tag=network tag=communicate"],["Fields","src, dest, dest_port, src_port, action, bytes, bytes_in, bytes_out, process"],["Acceleration","On, summary range 7 days"]],hl:["Root dataset","Constraint"]},
   why:"A data model has datasets. Each one has a constraint, a search that picks its events, and a list of fields. Network_Traffic takes everything tagged network and communicate: here the firewall and Sysmon's connection events."},
  {spl:"index=botsv1 tag=network tag=communicate\n| chart count over src by action",what:"Pivot: tables and charts without SPL.",

   why:"Pivot lets someone build a table or chart from a data model by choosing split rows, split columns and a value, with no SPL. This Pivot gives the same grid as this chart search.",
   pro:"Pivot only works on data models, or on datasets you can open in it. Its results can be saved as reports or dashboard panels."},
  {spl:"index=* tag=authentication\n| stats count by action src user",what:"The CIM: shared models and names.",
   why:"The Common Information Model is a set of standard data models, like Authentication, Network_Traffic, Web and Intrusion_Detection, with standard field names. Because every logon source here says action is success or failure, with src and user, one search works on Windows and Linux alike. A data model is a tree of datasets: a child dataset inherits its parent's constraints and fields and then narrows further, so it is always a subset of the parent. Datasets come in three types — event, search and transaction — and their fields can be auto-extracted or defined as eval, lookup, regular-expression or geo-IP fields.",
   pro:"The CIM comes as the Splunk Common Information Model add-on. Accelerating a model builds summaries on disk, so searches over it are fast. Splunk Enterprise Security's detections are written against CIM models."}
 ],

{id:"K8",stage:3,data:"soc",t:"tstats",goal:"The fastest search in Splunk",
 steps:[
  {spl:"| tstats count where index=botsv1 by sourcetype",what:"tstats reads summaries, not raw events.",
   why:"<code>tstats</code> starts with a pipe and counts from index summaries instead of opening every event, so it's extremely fast. Without a data model it only sees indexed fields: index, sourcetype, host, source and _time."},
  {spl:"| tstats count from datamodel=Network_Traffic where All_Traffic.dest_port=1337 by All_Traffic.src All_Traffic.dest",what:"With a data model, every CIM field is available.",
   why:"<code>from datamodel=</code> names the model, and fields are written root dataset, dot, field: All_Traffic.dest_port. 18 connections to port 1337: nine seen by the firewall and nine by Sysmon, because both are in the model."},
  {spl:"| tstats count from datamodel=Authentication where Authentication.action=failure by Authentication.src\n| where count >= 3",what:"After tstats, it's normal SPL.",
   why:"tstats gives a table, and the pipes after it work as usual. This is a password-guessing detection over every system that feeds the Authentication model."},
  {spl:"| tstats count from datamodel=Web by _time span=10m",what:"Time slots, straight from the summaries.",
   why:"by _time span= makes time slots like timechart. This is how big dashboards stay fast over months of data. Two more tstats notes. Add <code>prestats=t</code> to hand the partial results straight into a following <code>timechart</code> or <code>stats</code>. And when you need the model's raw events rather than the fast summary, the <code>| datamodel</code> command (for example <code>| datamodel Network_Traffic All_Traffic search</code>) searches the model directly: slower than tstats, but not limited to what the acceleration summary covers.",
   pro:"summariesonly=true uses only the accelerated summaries: fastest, but it misses data not yet summarised. Most Enterprise Security detections are tstats over CIM models, usually with summariesonly."}
 ],

{id:"D3",stage:4,data:"desk",t:"Scheduling, the window and indexing lag",goal:"Pick a schedule and a search window that tile without gaps, and know why real-time costs",
 steps:[
  {spl:"index=win EventCode=4625 Logon_Type=10\n| stats count by src dest\n| where count>=20",what:"The alert should catch a brute force within minutes. How often, and over what window?",
   why:"A credential-attack alert usually runs on a <b>cron schedule</b> every five minutes: <code>*/5 * * * *</code>. Each run must search the slice of time since the last run — if the schedule and the window don't line up, you get gaps (missed events) or overlaps (double alerts).",
   screen:{title:"Edit Alert",kind:"form",path:"Edit › Edit Alert",rows:[["Run on Cron Schedule","(selected)"],["Cron Expression","*/5 * * * *"],["Time Range: Earliest","-6m@m"],["Time Range: Latest","-1m@m"]],hl:["Cron Expression","Time Range: Earliest","Time Range: Latest"]}},
  {spl:"index=win EventCode=4625 Logon_Type=10",what:"Why the window is -6m@m to -1m@m and not simply the last 5 minutes.",
   why:"Two reasons. <b>Indexing lag</b>: events take a minute or two to travel from the host and land on the indexer, so a window ending at <code>now</code> misses the freshest events — ending at <code>-1m@m</code> lets them arrive. <b>Snap to the minute</b> (<code>@m</code>): earliest <code>-6m@m</code> and latest <code>-1m@m</code> both land on minute boundaries, so a 5-minute run covers exactly five whole minutes and consecutive runs tile edge-to-edge with no gap and no overlap. A plain <code>-5m</code> to <code>now</code> drifts by seconds each run and leaks events.",
   pro:"The extra minute (6 back, not 5) is the lag cushion; the snap is what makes the windows tile. Widen the cushion on a noisy forwarder, but then de-duplicate so the overlap doesn't double-alert."},
  {spl:"index=win EventCode=4625 Logon_Type=10\n| stats count by src dest\n| where count>=20",what:"Scheduled or real-time?",
   why:"A <b>real-time</b> alert watches the incoming stream continuously. It holds a search slot the whole time and keeps load on the indexers, so a handful of real-time alerts can starve everything else. A <b>scheduled</b> alert runs, finishes, frees its resources, and runs again. The guidance is simple: schedule by default, and reserve real-time for the rare case that genuinely cannot wait five minutes.",
   screen:{title:"Alert type",kind:"form",rows:[["Scheduled","runs on a cron/interval, then stops — cheap, the default"],["Real-time","watches continuously — holds a search slot, expensive"]],hl:["Scheduled","Real-time"]}}

   why:"The field defines what \"the same thing\" means. Suppressing per ClientIP holds the one noisy IP but lets a new source trigger immediately. Blank would mute the whole alert and hide the second attacker."},
  {id:"D4q3",lv:2,type:"concept",q:"How is alert Throttle different from `dedup` in the search?",
   options:["dedup trims rows within one run; throttle silences repeat firings across runs","They are the same feature","dedup is only for real-time alerts","throttle removes fields from events"],a:0,
   why:"dedup works inside a single search result; throttle works between scheduled runs. One cleans the rows you see, the other stops the same alert firing again and again over time."},
  {id:"D4q4",lv:3,type:"concept",q:"With \"For each result\" and no throttle, a sprayer that stays over threshold for an hour on a 5-minute alert produces roughly how many tickets?",
   options:["About a dozen — one per run it stays over threshold","Exactly one","None, because For each result needs throttle","One per account sprayed"],a:0,
   why:"The why line set it out: every 5-minute run re-finds the same IP and For each result raises another ticket, so an hour of spraying is about twelve tickets for one situation. Throttle collapses them."},
  {id:"D4q5",lv:2,type:"read",q:"On the day's data, how many sources does this spray alert fire on (before any throttle)?",code:"index=o365 Operation=UserLoginFailed\n| stats dc(user) AS users by ClientIP\n| where users>=5",
   options:["1","10","3","0"],a:0,chk:{spl:"index=o365 Operation=UserLoginFailed | stats dc(user) AS users by ClientIP | where users>=5",rows:1},
   why:"One source, 198.51.100.23, failed against 10 distinct accounts and clears the threshold of 5. It's the single spray in the data — the throttle question is how often it would re-fire, not how many sources there are."}
 ]},

{id:"D5",stage:4,data:"desk",t:"Tuning out false positives: allowlists",goal:"Silence known-good activity with an allowlist, and move it into a lookup so it scales",
 steps:[
  {spl:"index=win EventCode=7045\n| stats count by Service_Name dest",what:"A service-install detection (lateral movement often installs a service). But one of these is benign.",
   why:"<code>EventCode=7045</code> is a Windows service install — the signature of PsExec-style lateral movement (PSEXESVC). But the results also show <b>GoogleUpdaterService</b>, a legitimate auto-updater that installs on patch day. Left alone, the alert cries wolf every time the updater runs.",
   noflow:true},
  {spl:"index=win EventCode=7045\n| search NOT Service_Name=GoogleUpdaterService\n| stats count by Service_Name dest",what:"The quick fix: an inline allowlist.",
   why:"<code>NOT Service_Name=GoogleUpdaterService</code> drops the known-good updater and leaves only the suspicious installs (the three PSEXESVC hosts). This works, but it doesn't scale: every new exception means editing the search, and ten searches with the same exception means ten edits.",
   noflow:true},
  {spl:"index=o365 Operation=UserLoggedIn\n| lookup corp_vpn.csv ip AS ClientIP OUTPUT vpn\n| search NOT vpn=*\n| stats dc(ClientIP) AS ips by user\n| where ips>=2",what:"The real fix: keep the exceptions in a lookup. Here, an impossible-travel detection tuned by a VPN allowlist.",
   why:"<code>corp_vpn.csv</code> lists the company's sanctioned VPN exit addresses. The <code>lookup</code> tags any sign-in from one of them with a <code>vpn</code> label, and <code>NOT vpn=*</code> drops those. Now the detection flags users seen from two or more <i>non-VPN</i> addresses. btun's second login was the Amsterdam VPN, so btun falls away — and only the genuine account takeover, abungstein, is left. To tune it next time, you add a row to the CSV, never touch the SPL.",
   pro:"An allowlist suppresses known-good so the real thing stands out; a blocklist (like known_bad_ips.csv) matches known-bad to raise fidelity. Detections often use both — subtract the noise, add weight to the obvious."}
 ],
 yourturn:{goal:"Tune the service-install alert: list the 7045 installs but drop the benign GoogleUpdaterService, leaving the suspicious ones.",
   pieces:["index=win EventCode=7045","| search NOT Service_Name=GoogleUpdaterService","| stats count by Service_Name dest"],
   extra:[{t:"| search Service_Name=GoogleUpdaterService",why:"That keeps only the updater — the exact opposite. An allowlist drops the known-good with NOT, it doesn't keep it."}]},
 quiz:[
  {id:"D5q1",lv:1,type:"concept",q:"What is an allowlist in a detection?",
   options:["A set of known-good values you drop so they don't trigger the alert","A list of attacker IPs to match","A schedule for the alert","A field Splunk adds automatically"],a:0,
   why:"An allowlist is the known-good exceptions — a service, an IP, a user — that you filter out so the detection stays quiet on normal activity and only the unexpected survives."},
  {id:"D5q2",lv:2,type:"concept",q:"Why move the allowlist from `NOT Service_Name=GoogleUpdaterService` in the search into a lookup table?",
   options:["So exceptions are edited in one CSV instead of in every search, and the SPL never changes","Lookups run faster than NOT","NOT is not valid in alerts","It converts the alert to real-time"],a:0,
   why:"An inline NOT means editing every search for every new exception. A lookup keeps the exceptions in one table that many detections share, so tuning is adding a row, not rewriting SPL."},
  {id:"D5q3",lv:2,type:"read",q:"After allowlisting the updater, how many suspicious service installs remain for the day?",code:"index=win EventCode=7045\n| search NOT Service_Name=GoogleUpdaterService\n| stats count by Service_Name dest",
   options:["3","1","4","0"],a:0,chk:{spl:"index=win EventCode=7045 | search NOT Service_Name=GoogleUpdaterService | stats count by Service_Name dest",rows:3},
   why:"Three rows remain — PSEXESVC on srv-backup01, srv-file01 and wrk-mkraeusen — the PsExec lateral movement. Only the single benign GoogleUpdaterService row was dropped."},
  {id:"D5q4",lv:2,type:"read",q:"The impossible-travel detection is tuned with the VPN allowlist. Which user is left after the company VPN is dropped?",code:"index=o365 Operation=UserLoggedIn\n| lookup corp_vpn.csv ip AS ClientIP OUTPUT vpn\n| search NOT vpn=*\n| stats dc(ClientIP) AS ips by user\n| where ips>=2",
   options:["abungstein — a genuine account takeover","btun — the VPN user","both of them","neither"],a:0,chk:{spl:"index=o365 Operation=UserLoggedIn | lookup corp_vpn.csv ip AS ClientIP OUTPUT vpn | search NOT vpn=* | stats dc(ClientIP) AS ips by user | where ips>=2",rows:1},
   why:"btun's second address was the sanctioned Amsterdam VPN, so the allowlist removes it and btun drops below two distinct addresses. Only abungstein, seen from two non-VPN IPs, survives — the real takeover."},
  {id:"D5q5",lv:3,type:"concept",q:"How does an allowlist differ from a blocklist like known_bad_ips.csv?",
   options:["An allowlist subtracts known-good to cut noise; a blocklist matches known-bad to raise fidelity","They are the same","An allowlist only works in real-time alerts","A blocklist must be inline, not a lookup"],a:0,
   why:"The veteran note drew the line: allowlists remove the benign so the odd thing stands out, blocklists flag the known-bad so an obvious hit scores higher. Detections commonly use both together."}

{id:"D6",stage:4,data:"desk",t:"Baselines and per-entity thresholds",goal:"Alert on what's abnormal for each entity, not on a single flat number",
 steps:[
  {spl:"index=sysmon EventCode=22\n| stats count by host",what:"18:00 — a hunt for DNS tunnelling. But every machine makes DNS queries, so you can't alert on \"any DNS\".",
   why:"<code>EventCode=22</code> is a Sysmon DNS query. Counting by host shows every workstation does DNS — a flat threshold like \"more than 10 queries\" would either miss a quiet tunnel or flag every busy host. You need to compare each host to what's <i>normal</i>.",
   noflow:true},
  {spl:"index=sysmon EventCode=22\n| stats count by host\n| eventstats avg(count) AS a\n| where count>a*2",what:"A baseline: compare each host to the fleet average with eventstats.",
   why:"<code>eventstats avg(count) AS a</code> adds the average across all hosts to <i>every</i> row without collapsing them — unlike <code>stats</code>, which would throw the per-host rows away. Then <code>where count&gt;a*2</code> keeps any host doing more than twice the average. wrk-fyodor (30 queries against a mean of about 11) is the only one left.",
   pro:"eventstats avg(x) AS a stdev(x) AS sd lets you flag count &gt; a + 3*sd — three standard deviations above normal — once you have enough history for the stdev to mean something. With only a handful of hosts, a multiple of the average is steadier."},
  {spl:"index=sysmon EventCode=22\n| eval sub=mvindex(split(QueryName,\".\"),0)\n| eval L=len(sub)\n| stats avg(L) AS avglen max(L) AS maxlen by host",what:"A better baseline for this attack: subdomain length, not query count.",
   why:"Tunnelling stuffs stolen data into long random sub-domains (<code>a9f3k2...  .cdn-telemetry.net</code>). <code>split(QueryName,\".\")</code> breaks the name on dots, <code>mvindex(...,0)</code> takes the first label, and <code>len()</code> measures it. wrk-fyodor's average label length is around 38 characters against 5 to 12 for the rest — a far sharper signal than raw count. Per-entity baselining means picking the measure that actually separates bad from normal.",
   noflow:true}
 ],
 yourturn:{goal:"Baseline DNS volume: count queries per host, add the fleet average to every row, and keep hosts doing more than twice it.",
   pieces:["index=sysmon EventCode=22","| stats count by host","| eventstats avg(count) AS a","| where count>a*2"],
   extra:[{t:"| stats avg(count) AS a",why:"stats collapses to a single average row and loses the per-host counts, so you can't compare each host. eventstats adds the average beside every row and keeps them."}]},
 quiz:[
  {id:"D6q1",lv:1,type:"concept",q:"What does `eventstats` do that `stats` does not?",
   options:["It adds the summary value to every existing row instead of collapsing the rows","It runs faster","It only works on DNS events","It deletes the original rows"],a:0,
   why:"stats reduces events to summary rows. eventstats computes the same summary but writes it back onto every row, so you can compare each row to the aggregate — exactly what a baseline needs."},
  {id:"D6q2",lv:2,type:"concept",q:"Why is a per-entity baseline better than a flat threshold like \"more than 10 DNS queries\"?",
   options:["It flags what's abnormal for each host, so it neither misses quiet tunnels nor floods on busy hosts","It uses less disk","Flat thresholds are not allowed in alerts","It removes the need for a schedule"],a:0,
   why:"Hosts differ: a flat number is wrong for all of them. Comparing each host to its own normal (or the fleet average) catches the one that jumped without alerting on the ones that are simply busy."},
  {id:"D6q3",lv:2,type:"read",q:"Using twice-the-average as the line, which host does the DNS baseline flag?",code:"index=sysmon EventCode=22\n| stats count by host\n| eventstats avg(count) AS a\n| where count>a*2",
   options:["wrk-fyodor","wrk-btun","wrk-abungstein","all four"],a:0,chk:{spl:"index=sysmon EventCode=22 | stats count by host | eventstats avg(count) AS a | where count>a*2",rows:1},
   why:"Only wrk-fyodor (about 30 queries) sits above twice the roughly-11 average. The other hosts are near or below the mean, so they fall under the line — one row returned."},
  {id:"D6q4",lv:3,type:"concept",q:"The veteran note suggested `count > a + 3*sd`. What are `a` and `sd`?",
   options:["The average and the standard deviation, from eventstats avg() and stdev()","The alert's earliest and latest times","Two different indexes","The row count and the field count"],a:0,
   why:"a is the mean and sd the standard deviation, both added by eventstats. Flagging more than three standard deviations above the mean is a stricter baseline — once you have enough history for stdev to be meaningful."},
  {id:"D6q5",lv:2,type:"read",q:"Measuring the first DNS label's length per host, which host has by far the longest average — the tunnelling tell?",code:"index=sysmon EventCode=22\n| eval sub=mvindex(split(QueryName,\".\"),0)\n| eval L=len(sub)\n| stats avg(L) AS avglen max(L) AS maxlen by host\n| sort -avglen",
   options:["wrk-fyodor","wrk-mkraeusen","wrk-btun","wrk-abungstein"],a:0,chk:{spl:"index=sysmon EventCode=22 | eval sub=mvindex(split(QueryName,\".\"),0) | eval L=len(sub) | stats avg(L) AS avglen max(L) AS maxlen by host | sort -avglen",cell:[0,0,"wrk-fyodor"]},
   why:"wrk-fyodor's average first-label length is around 38 characters, with the rest between 5 and 12. Long random sub-domains are how tunnels carry data, so length separates the tunnel from ordinary lookups more cleanly than volume does."}
 ]},

{id:"D7",stage:4,data:"desk",t:"Reading an ESCU-style detection",goal:"Read a tstats data-model detection line by line, spot its bug, and know what ES adds",
 steps:[
  {spl:"| tstats count from datamodel=Authentication where Authentication.action=failure by Authentication.src Authentication.dest",what:"Splunk's ESCU library ships detections like this. Read it a line at a time.",
   why:"<code>tstats</code> reads pre-computed statistics straight from an <b>accelerated data model</b>, so it's fast over huge volumes. <code>from datamodel=Authentication</code> names the model; <code>where Authentication.action=failure</code> keeps failed logons; <code>by Authentication.src Authentication.dest</code> groups per source and target. Field names are <i>model.field</i> — the dotted prefix is the data model, not a typo.",
   noflow:true},
  {spl:"| tstats count from datamodel=Authentication where Authentication.action=failure by Authentication.src Authentication.dest\n| where count>=20\n| rename Authentication.src AS src Authentication.dest AS dest",what:"The same brute-force logic as D1, but model-driven and fast.",
   why:"<code>where count&gt;=20</code> is the familiar threshold; <code>rename</code> strips the model prefix so the output reads cleanly. This is a complete detection: a fast tstats search over a data model, thresholded, ready to schedule. The CIM data model is what lets one detection run unchanged across every source that maps to Authentication.",
   noflow:true},
  {spl:"| tstats count from datamodel=Authentication where Authentication.action=failure by Authentication.src Authentication.dest",what:"What Enterprise Security adds — and what is just core Splunk.",
   why:"<b>Core Splunk</b> gives you everything so far: tstats, data models, the scheduled alert and its actions. <b>Enterprise Security</b> adds a layer on top — when an ESCU detection fires it writes a <b>notable</b> into Incident Review or, for risk-based alerting (RBA), a <b>risk event</b>, and then a separate risk rule raises the notable once an entity's total risk gets high enough. It also adds a <b>risk</b> score to the source via the risk framework and wires up drilldowns. The detection logic is core SPL; the notable, the risk events and the risk score are ES. Knowing the line keeps you honest about what you can build without a licence for ES.",
   screen:{title:"What ES adds",kind:"table",cols:["Core Splunk","Enterprise Security"],rows:[["tstats, data models","—"],["scheduled alert + actions","notable in Incident Review"],["email / webhook / script","risk score via risk framework"],["your own dashboards","drilldowns + Incident Review workflow"]],hl:["notable in Incident Review","risk score via risk framework"]}}
 ],
 yourturn:{goal:"Write the fast, model-driven brute-force detection: count failed authentications from the Authentication data model, grouped by source and target.",
   pieces:["| tstats count from datamodel=Authentication","where Authentication.action=failure","by Authentication.src Authentication.dest"],
   extra:[{t:"from Authentication",why:"Without datamodel=, tstats doesn't read the data model at all — the datamodel= keyword is what points it at Authentication."}]},
 quiz:[
  {id:"D7q1",lv:1,type:"concept",q:"Why do ESCU detections use `tstats` over an accelerated data model?",
   options:["It reads pre-computed statistics, so it's fast over huge volumes","It is the only command that can filter","It avoids needing a schedule","It writes notables by itself"],a:0,
   why:"tstats reads the summaries that data model acceleration builds in the background, by scheduled summary searches, instead of scanning raw events — which is what makes model-driven detections fast at scale."},
  {id:"D7q2",lv:2,type:"concept",q:"In `by Authentication.src`, what is the `Authentication.` part?",
   options:["The data model name, prefixed to the field — the dotted form data models use","A typo for a pipe","A time modifier","The name of an index"],a:0,

  {id:"D7q4",lv:2,type:"bug",q:"Spot the bug: this detection should flag sources with 20 or more failed logons, but it only ever returns the quiet ones.",
   code:"| tstats count from datamodel=Authentication where Authentication.action=failure by Authentication.src\n| where count<=20\n| rename Authentication.src AS src",
   options:["| where count<=20","| tstats count from datamodel=Authentication where Authentication.action=failure by Authentication.src","| rename Authentication.src AS src","There is no bug"],a:0,
   chk:{spl:"| tstats count from datamodel=Authentication where Authentication.action=failure by Authentication.src | where count<=20 | rename Authentication.src AS src",rows:4},

/* ============================================================
   STATION 6 — ENTERPRISE SECURITY (stage 6)
   The analyst's view from inside Splunk Enterprise Security (ES): the Incident Review queue of
   notables, how urgency is built, how a notable is triaged, and Risk-Based Alerting. Everything
   runs on the Alert Desk day (data:"desk"). The index=notable and index=risk events here are
   SAMPLE DATA shaped like ES output — a real ES install writes them from scheduled correlation
   searches; we seeded them so you can practise the queries without a licensed ES instance.

   Honest core-vs-premium line, stated in the lessons: ES is a premium app licensed on top of
   core Splunk. The notable index, Incident Review, the urgency matrix, risk events and risk
   incident rules are ES features; the SPL you run against them (stats, table, where, sort) is
   plain core SPL. SOAR (Station 7) is a separate product again.

   Gate honoured: teach before quiz (each lesson opens on a concrete triage moment, then the
   theory in the step `why` lines, before any question leans on it); a write-it task per lesson
   (WRITEITS); situational lead-ins; Level-3 questions use only what the why/veteran notes said;
   never reuse ids. ES field names match ES: urgency, severity, priority, status, owner,
   disposition, drilldown_search, risk_object, risk_score, risk_object_type, search_name.
   ============================================================ */
const ESEC=[

   pro:"A single correlation search can raise many notables in a day. Grouping by rule_name is how you spot a rule that's firing far too often and needs tuning — the same noise problem you tuned in Station 4, now seen from the queue."},

{id:"E2",stage:6,data:"desk",t:"Urgency = severity × priority",goal:"Know where a notable's urgency comes from, and triage by it",
 steps:[
  {spl:"`notable`\n| table rule_name severity priority urgency",what:"Two critical notables, but for different reasons. Line them up.",
   why:"<b>Urgency</b> isn't set by hand. ES builds it from two inputs: <b>severity</b> — how bad the correlation search thinks the event is — and <b>priority</b> — how important the asset or the identity involved is, looked up from the Assets &amp; Identities tables (the asset via <code>dest</code>/<code>src</code>/<code>dvc</code>, the identity via <code>user</code>/<code>src_user</code>). If both the asset and the identity have a priority, ES uses the <b>higher</b> of the two.",
   pro:"Priority is why the same rule can raise a medium notable on a test box and a critical one on a domain controller. Keeping Assets &amp; Identities accurate is half of what makes ES urgency trustworthy."},
  {spl:"`notable` urgency=critical\n| table rule_name severity priority",what:"The two paths to critical.",
   why:"\"New Privileged Account Created\" is <b>high</b> severity on a <b>critical</b>-priority asset (a domain controller) → <b>critical</b> urgency. \"Successful Login After Brute Force\" is <b>critical</b> severity on a <b>medium</b>-priority asset (a public web server) → also <b>critical</b>. Either a very bad event on an important asset, or a severe event on a mid-priority one, lands at the top of the queue. The matrix below is an editable lookup (<b>Urgency Levels</b>, under Configure › Content › Content Management), and an analyst can still override a single notable's urgency by hand in Incident Review.",
   screen:{title:"Urgency matrix (ES default)",kind:"table",cols:["priority ↓  /  severity →","unknown","low","medium","high","critical"],rows:[["unknown / low","low","low","low","medium","high"],["medium","low","low","medium","high","critical"],["high","medium","medium","medium","—","—"],["critical","medium","medium","high","critical","critical"]],hl:[1,3],note:"Read priority down the left, severity across the top; they meet at urgency. Informational severity always gives informational urgency. The two blank cells aren't stated in Splunk's documented default."}},
  {spl:"`notable`\n| stats count by urgency",what:"The shape of the queue in one line.",
   why:"<code>stats count by urgency</code> tells you how heavy the day is before you open a single notable: 2 critical, 4 high, 2 medium. You work the criticals first, then the highs — urgency is the triage order, not a label you can ignore."}
 ],
 yourturn:{goal:"Show only the critical-urgency notables, with the severity and priority that produced them.",
   pieces:["`notable` urgency=critical","| table rule_name severity priority"],
   extra:[{t:"| table rule_name urgency",why:"That drops the two inputs. The task is to show WHY they're critical — the severity and priority behind the urgency."}]},
 quiz:[
  {id:"E2q1",lv:1,type:"concept",q:"In ES, a notable's urgency is calculated from which two inputs?",
   options:["severity and priority","owner and status","rule_name and _time","src and dest"],a:0,
   why:"Urgency = severity (how bad the event is) × priority (how important the asset or identity is). ES fills it in automatically from those two."},
  {id:"E2q2",lv:2,type:"concept",q:"Two notables have the same rule, but one is urgency=critical and the other urgency=medium. What most likely differs?",
   options:["The priority of the asset or identity involved","The index they came from","The time they fired","Their rule_name"],a:0,
   why:"Same rule means the same severity, so the difference is priority. A higher-priority asset or identity (a domain controller, a crown-jewel server) lifts urgency; a low-priority test box keeps it down."},
  {id:"E2q3",lv:2,type:"read",q:"The shift lead wants to know how many notables you must work before the highs. Read the search and give the critical count.",code:"`notable`\n| stats count by urgency",
   options:["2","4","8","1"],a:0,chk:{spl:"`notable` | stats count by urgency | search urgency=critical",rows:1,cell:[0,1,"2"]},
   why:"stats count by urgency returns 2 critical, 4 high, 2 medium. Two criticals come first in the triage order."},
  {id:"E2q4",lv:2,type:"fill",q:"Fill the filter so you see only the top-of-queue notables.",code:"`notable` ___\n| table rule_name severity priority",codeOpts:true,
   options:["urgency=critical","severity=critical","owner=critical","status=critical"],a:0,
